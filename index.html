<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        magic: { dark: '#0f172a', card: '#1e1b4b', purple: '#8b5cf6', pink: '#ec4899', cyan: '#06b6d4' },

        body { font-family: 'Fredoka', 'Noto Sans TC', sans-serif; background: radial-gradient(circle at top, #2e1065 0%, #0f172a 100%); min-height: 100vh; transition: background 0.5s ease; }
        body.mode-senior { background: radial-gradient(circle at top, #064e3b 0%, #022c22 100%); }

</head>

<header class="w-full max-w-4xl text-center my-4">

    <div class="inline-flex items-center gap-3 bg-indigo-950/80 px-6 py-2 rounded-full border border-indigo-500/30 mb-3 shadow-lg" id="topBadge">
        <i class="fa-solid font-bold fa-headphones-simple text-amber-400"></i>
        <span class="text-amber-300 font-semibold text-sm" id="badgeText">沈浸式互動繪本・聽完動作指示後完成動作繼續</span>

    <h1 class="text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300" id="mainTitle">

</header>

<main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6 my-auto">
    <section class="md:col-span-1 bg-slate-900/80 p-6 rounded-3xl border border-purple-500/20 shadow-2xl flex flex-col justify-between gap-6" id="leftCard">
        <div>
            <h2 class="text-xl font-bold text-cyan-300 mb-4 flex items-center gap-2">
                <i class="fa-bluetooth-b fab text-cyan-400"></i> 藍牙連線
            </h2>
            <div class="bg-slate-800/90 p-4 rounded-2xl border border-slate-700/50 mb-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span id="statusIndicator" class="w-4 h-4 rounded-full bg-slate-500 inline-block shadow"></span>
                    <div>
                        <div class="text-xs text-slate-400">狀態</div>
                        <div id="statusText" class="font-bold text-slate-200 text-sm">尚未連線</div>
                    </div>
                </div>
                <i id="statusIcon" class="fa-solid fa-plug-circle-xmark text-slate-500 text-xl"></i>
            </div>
            <button id="btnConnect" type="button" class="w-full bg-cyan-500 hover:bg-cyan-400 text-white font-bold py-3 px-4 rounded-2xl shadow-lg transition text-sm">
                連接故事裝置

        </div>

        <div class="bg-indigo-950/40 p-4 rounded-2xl border border-indigo-800/40 space-y-3">
            <h3 class="text-sm font-bold text-purple-300">手動測試互動</h3>
            <button id="btnManualAction" type="button" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-3 rounded-xl shadow-md text-sm transition">
                ✨ 模擬做完動作 (解鎖下一段)

            <div id="seniorDifficultyBox" class="hidden space-y-1.5 pt-2 border-t border-indigo-800/60">
                <div class="text-[11px] text-emerald-300 font-bold">健康操活動難度：</div>
                <div class="grid grid-cols-3 gap-1.5">
                    <button type="button" id="diffBtn1" class="py-1.5 px-1 rounded-lg text-xs font-bold bg-emerald-700 text-white shadow">🟢 難度1</button>
                    <button type="button" id="diffBtn2" class="py-1.5 px-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white">🟡 難度2</button>

        <div class="relative flex-1 bg-slate-950/70 rounded-2xl p-6 border border-slate-800 flex flex-col justify-between min-h-[300px]">
            <div class="overflow-y-auto max-h-[360px] pr-2 space-y-4" id="storyScroll">

                </div>
                <div id="storyDisplay" class="text-lg leading-relaxed text-slate-300 hidden space-y-4"></div>
            </div>

            <div id="actionPrompt" class="hidden mt-4 pt-3 border-t border-slate-800 bg-pink-950/40 p-4 rounded-xl border border-pink-500/30 action-big">
                <div class="flex items-center gap-2 text-pink-300 font-bold" id="actionHeaderBox">

                    <span id="promptText">請依照提示做出動作。</span>

                <div id="actionSubText" class="text-sm text-slate-300 mt-2"></div>

        <div class="space-y-4">
            <div class="space-y-2">
                <div class="grid grid-cols-3 gap-2" id="themeButtonsContainer">
                    <button type="button" data-theme="勇敢的小騎士與巨龍" class="theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-2 rounded-xl text-xs font-semibold">⚔️ 騎士巨龍</button>
                    <button type="button" data-theme="神奇魔法森林的密道" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold">🌲 魔法森林</button>
                    <button type="button" data-theme="海底王國的寶藏探險" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold">🐬 海底寶藏</button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="customTopicInput" placeholder="或者輸入你想聽的自訂故事主題..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <div class="flex gap-3">
                <button id="btnGenerate" type="button" class="flex-1 glow-button bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 text-white font-black py-4 px-6 rounded-2xl text-base flex items-center justify-center gap-3">
                    <i id="btnIcon" class="fa-solid fa-wand-magic-sparkles"></i>
                    <span id="btnText">開始精彩故事冒險</span>
                </button>
                <button id="btnSpeak" type="button" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 px-5 rounded-2xl border border-slate-700 text-xl transition">

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-purple-500/50 text-slate-100 px-6 py-3 rounded-2xl shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50 text-sm font-semibold"></div>

<script>
const BLE_CONFIG = {
    serviceUuid: '4fa8691a-136d-4560-84ed-01354051b785',
    characteristicUuid: 'beb5483e-36e1-4688-b7f5-ea07361b26a8'
};

const WORKER_URL = 'https://empty-credit-1539.rrong1041.workers.dev';

let bleDevice = null;
let bleCharacteristic = null;
let currentMode = "child"; 
let selectedTheme = "勇敢的小騎士與巨龍";
let selectedDifficulty = 1; 
let currentStory = "";
let history = [];
let waitingForAction = false;
let expectedAction = "";
let busy = false;
let lastActionTime = 0;

const $ = id => document.getElementById(id);

function showToast(msg) {
    const t = $('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.remove('opacity-0','pointer-events-none');
    t.classList.add('opacity-100');
    setTimeout(() => {
        t.classList.remove('opacity-100');
        t.classList.add('opacity-0','pointer-events-none');
    }, 3000);
}

function setDifficulty(diff) {
    selectedDifficulty = diff;
    for (let i = 1; i <= 3; i++) {
        const btn = $(`diffBtn${i}`);
        if (!btn) continue;
        if (i === diff) {
            btn.className = "py-1.5 px-1 rounded-lg text-xs font-bold bg-emerald-700 text-white shadow";
        } else {
            btn.className = "py-1.5 px-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white";
        }
    }
    showToast(`已設定健康操難度：等級 ${diff}`);
}

async function switchMode(mode, notifyDevice = true) {
    currentMode = mode;
    const isSenior = (mode === 'senior');

    if (isSenior) {
        $('appBody').classList.add('mode-senior');$('modeChildBtn').className = "px-5 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 text-slate-400 hover:text-white";
        $('modeSeniorBtn').className = "px-5 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-emerald-600 text-white shadow-md";
        $('mainTitle').className = "text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-300";
        $('badgeText').textContent = "長輩關懷模式・全程坐姿，輕鬆健康動一動";
        $('welcomeIcon').textContent = "🌿✨";
        $('welcomeTitle').textContent = "準備好開始今日健康關懷活動了嗎？";
        $('welcomeDesc').textContent = "選擇安全坐姿伸展主題，跟著語音指示輕鬆活動筋骨。";
        $('seniorDifficultyBox').classList.remove('hidden');
        
        selectedTheme = "輕鬆坐姿手部健康伸展";
        $('themeButtonsContainer').innerHTML = `
            <button type="button" data-theme="輕鬆坐姿手部健康伸展" class="theme-btn active bg-emerald-900/50 border border-emerald-500 text-emerald-200 py-2 px-2 rounded-xl text-xs font-semibold">🙌 手部健康伸展</button>
            <button type="button" data-theme="溫和肩頸放鬆操" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold">🧘 肩頸放鬆操</button>
            <button type="button" data-theme="快樂活力健康動" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold">🌟 活力健康動</button>
        `;
        showToast('已切換至【長輩關懷模式】');
    } else {
        $('appBody').classList.remove('mode-senior');$('modeChildBtn').className = "px-5 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-pink-600 text-white shadow-md";
        $('modeSeniorBtn').className = "px-5 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 text-slate-400 hover:text-white";
        $('mainTitle').className = "text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300";
        $('badgeText').textContent = "沈浸式互動繪本・聽完動作指示後完成動作繼續";
        $('welcomeIcon').textContent = "📖✨";
        $('welcomeTitle').textContent = "準備好開始冒險了嗎？";
        $('welcomeDesc').textContent = "選擇或自訂主題，AI 會即時生成故事並在互動處停下。";
        $('seniorDifficultyBox').classList.add('hidden');

        selectedTheme = "勇敢的小騎士與巨龍";
        $('themeButtonsContainer').innerHTML = `
            <button type="button" data-theme="勇敢的小騎士與巨龍" class="theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-2 rounded-xl text-xs font-semibold">⚔️ 騎士巨龍</button>
            <button type="button" data-theme="神奇魔法森林的密道" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold">🌲 魔法森林</button>
            <button type="button" data-theme="海底王國的寶藏探險" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold">🐬 海底寶藏</button>
        `;
        showToast('已切換至【兒童冒險模式】');
    }

    bindThemeButtons();

    if (notifyDevice && bleCharacteristic) {
        await sendBLE(isSenior ? "MODE_SENIOR" : "MODE_CHILD");
    }
}

function bindThemeButtons() {
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.onclick = (e) => {
            document.querySelectorAll('.theme-btn').forEach(b => {
                b.className = 'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold';
            });
            e.currentTarget.className = currentMode === 'senior'
                ? 'theme-btn active bg-emerald-900/50 border border-emerald-500 text-emerald-200 py-2 px-2 rounded-xl text-xs font-semibold'
                : 'theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-2 rounded-xl text-xs font-semibold';
            selectedTheme = e.currentTarget.dataset.theme;
            $('customTopicInput').value = '';
        };
    });
}

function actionLabel(action) {
    const map = {
        SWIPE_LEFT:  currentMode === 'senior' ? "請慢慢向左移動手臂" : "請向左揮動手環",
        SWIPE_RIGHT: currentMode === 'senior' ? "請慢慢向右移動手臂" : "請向右揮動手環",
        JUMP:        currentMode === 'senior' ? "請保持坐姿，伸展放鬆" : "請向上跳一下",
        SHAKE:       currentMode === 'senior' ? "請輕輕搖動手臂" : "請搖晃手環",
        RUN:         currentMode === 'senior' ? "請原地輕鬆擺動雙臂" : "請原地跑步(手臂前後擺動)",
        ARM_UP:      "請慢慢將雙手抬起來"
    };
    return map[action] || "📳 請依照提示操作裝置";
}

function appendStory(title, text, action, resultText="") {
    const display = $('storyDisplay');
    const box = document.createElement('div');
    box.className = 'p-4 rounded-xl bg-slate-900/70 border border-slate-800';
    const safeTitle = document.createElement('div');
    safeTitle.className = currentMode === 'senior' ? 'text-xs font-bold text-emerald-300 mb-2' : 'text-xs font-bold text-purple-300 mb-2';
    safeTitle.textContent = title;
    const p = document.createElement('p');
    p.className = 'text-slate-200';
    p.textContent = text;
    box.appendChild(safeTitle);
    box.appendChild(p);

    if (action) {
        const a = document.createElement('div');
        a.className = 'mt-3 text-sm font-bold text-pink-400';
        a.textContent = '🎯 ' + actionLabel(action);
        box.appendChild(a);
    }
    if (resultText) {
        const r = document.createElement('div');
        r.className = 'mt-2 text-sm text-emerald-300';
        r.textContent = resultText;
        box.appendChild(r);
    }

    display.appendChild(box);
    $('storyScroll').scrollTop =$('storyScroll').scrollHeight;
}

async function connectBLE() {
    if (!navigator.bluetooth) {
        showToast('此瀏覽器不支援 Web Bluetooth，請用支援的瀏覽器。');
        return;
    }

    try {
        showToast('正在搜尋故事裝置...');
        bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [BLE_CONFIG.serviceUuid]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
            $('statusIndicator').className = 'w-4 h-4 rounded-full bg-slate-500 inline-block shadow';$('statusText').textContent = '已斷線';
            $('statusIcon').className = 'fa-solid fa-plug-circle-xmark text-slate-500 text-xl';
            bleCharacteristic = null;
            showToast('故事裝置已斷線');
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(BLE_CONFIG.serviceUuid);
        bleCharacteristic = await service.getCharacteristic(BLE_CONFIG.characteristicUuid);

        await bleCharacteristic.startNotifications();
        bleCharacteristic.addEventListener('characteristicvaluechanged', onBleEvent);

        $('statusIndicator').className = 'w-4 h-4 rounded-full bg-emerald-500 inline-block shadow-lg animate-pulse';$('statusText').textContent = '已連線';
        $('statusIcon').className = 'fa-solid fa-plug-circle-check text-emerald-400 text-xl';

        await sendBLE("READY");
        showToast('藍牙連線成功！');
    } catch (e) {
        console.error(e);
        showToast('藍牙連線失敗：' + e.message);
    }
}

function onBleEvent(event) {
    const value = new TextDecoder().decode(event.target.value).trim().toUpperCase();
    console.log("收到硬體訊號:", value);

    if (value === "SWITCH_MODE_SENIOR" || value === "MODE_SENIOR") {
        switchMode('senior', false);
        return;
    }
    if (value === "SWITCH_MODE_CHILD" || value === "MODE_CHILD") {
        switchMode('child', false);
        return;
    }

    if (!waitingForAction || busy) return;

    const now = Date.now();
    if (now - lastActionTime < 2000) return;

    const cleanExpected = (expectedAction || "").trim().toUpperCase();

    if (value === cleanExpected) {
        lastActionTime = now;
        showToast('✨ 動作正確！正在繼續...');
        handleAction(expectedAction);
    } else {
        showToast('收到 ' + value + '，目前需要：' + actionLabel(cleanExpected));
        $('actionSubText').textContent = '目前需要：' + actionLabel(cleanExpected);
    }
}

async function sendBLE(command) {
    if (!bleCharacteristic) return;
    try {
        const encoder = new TextEncoder();
        await bleCharacteristic.writeValue(encoder.encode(command));
    } catch(e) {
        console.error('BLE 傳送失敗', e);
    }
}

async function parseAIResponse(res) {
    const rawData = await res.json();
    if (!res.ok) throw new Error(rawData.error || 'AI 回應失敗');

    let content = rawData;
    if (rawData.choices && rawData.choices[0] && rawData.choices[0].message) {
        content = rawData.choices[0].message.content;
    }

    if (typeof content === 'string') {
        try {
            let cleanStr = content.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(cleanStr);
        } catch (err) {
            return { story: content, action: null, done: true };
        }
    }
    return content;
}

async function handleAction(action) {
    if (!waitingForAction || busy) return;
    waitingForAction = false;
    $('actionPrompt').classList.add('hidden');
    busy = true;

    await sendBLE("ACTION_OK");

    try {
        const res = await fetch(WORKER_URL + '/api/story', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                mode: currentMode,
                difficulty: selectedDifficulty,
                topic: selectedTheme,
                action,
                currentStory
            })
        });

        const data = await parseAIResponse(res);

        currentStory = data.story || "";
        history.push({ role: "assistant", story: currentStory, action: data.action || null });

        appendStory(currentMode === 'senior' ? `🌿 AI 健康活動 (難度 ${selectedDifficulty})` : '🤖 AI 繼續冒險', currentStory, data.done ? null : data.action);
        speak(currentStory + (data.actionLabel ? ' ' + data.actionLabel : ''));

        if (data.done) {
            $('actionPrompt').classList.remove('hidden');$('promptText').textContent = currentMode === 'senior' ? '🎉 活動圓滿完成！' : '🎉 太棒了！冒險任務完成！';
            $('actionSubText').textContent = '內容已完整結束。';
            waitingForAction = false;
        } else {
            expectedAction = data.action;
            waitingForAction = true;
            $('actionPrompt').classList.remove('hidden');
            $('promptText').textContent = data.actionLabel \vert{}\vert{} actionLabel(data.action);$('actionSubText').textContent = '完成動作後，系統將自動解鎖下一步。';
        }
    } catch(e) {
        console.error(e);
        showToast('連線失敗：' + e.message);
        waitingForAction = true;
        $('actionPrompt').classList.remove('hidden');
    } finally {
        busy = false;
    }
}

async function generateStory() {
    const custom = $('customTopicInput').value.trim();
    const topic = custom || selectedTheme;

    if (!topic) {
        showToast('請先選擇或輸入主題');
        return;
    }

    const btn = $('btnGenerate');$('btnText').textContent = currentMode === 'senior' ? `正在規劃難度 ${selectedDifficulty} 健康活動...` : 'AI 正在編寫冒險...';
    $('btnIcon').className = 'fa-solid fa-spinner animate-spin';
    btn.disabled = true;

    try {
        const res = await fetch(WORKER_URL + '/api/story', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                mode: currentMode,
                difficulty: selectedDifficulty,
                topic: topic
            })
        });

        const data = await parseAIResponse(res);

        $('welcomeMessage').classList.add('hidden');
        $('storyDisplay').innerHTML = '';$('storyDisplay').classList.remove('hidden');
        currentStory = data.story || '';
        history = [{role:'user', topic}, {role:'assistant', story:currentStory, action:data.action}];

        appendStory(currentMode === 'senior' ? `🌿 AI 健康活動開始 (難度 ${selectedDifficulty})` : '📖 AI 第一章', currentStory, data.done ? null : data.action);
        speak(currentStory + (data.actionLabel ? ' ' + data.actionLabel : ''));

        $('btnSpeak').disabled = false;

        if (data.done) {
            $('actionPrompt').classList.remove('hidden');$('promptText').textContent = '🎉 內容已完成！';
            $('actionSubText').textContent = '';
            waitingForAction = false;
        } else {
            expectedAction = data.action;
            waitingForAction = true;
            $('actionPrompt').classList.remove('hidden');
            $('promptText').textContent = data.actionLabel \vert{}\vert{} actionLabel(data.action);$('actionSubText').textContent = '請完成這個動作，ESP32 藍牙將自動通知。';
            if (bleCharacteristic) await sendBLE('START_STORY');
        }

        showToast('✨ 內容生成完成！');
    } catch(e) {
        console.error(e);
        showToast('錯誤：' + e.message);
    } finally {
        $('btnText').textContent = currentMode === 'senior' ? '開始健康坐姿活動' : '開始精彩故事冒險';
        $('btnIcon').className = 'fa-solid fa-wand-magic-sparkles';
        btn.disabled = false;
    }
}

function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-TW';
    utterance.rate = 0.95;
    window.speechSynthesis.speak(utterance);
}

window.addEventListener('DOMContentLoaded', () => {
    if ($('modeChildBtn'))$('modeChildBtn').onclick = () => switchMode('child');
    if ($('modeSeniorBtn'))$('modeSeniorBtn').onclick = () => switchMode('senior');
    if ($('btnConnect'))$('btnConnect').onclick = connectBLE;
    if ($('btnGenerate'))$('btnGenerate').onclick = generateStory;
    
    if ($('diffBtn1'))$('diffBtn1').onclick = () => setDifficulty(1);
    if ($('diffBtn2'))$('diffBtn2').onclick = () => setDifficulty(2);
    if ($('diffBtn3'))$('diffBtn3').onclick = () => setDifficulty(3);

    bindThemeButtons();

    if ($('btnManualAction')) {$('btnManualAction').onclick = () => {
            if (!waitingForAction) {
                showToast('目前沒有等待中的互動。');
                return;
            }
            handleAction(expectedAction);
        };
    }

    if ($('customTopicInput')) {$('customTopicInput').oninput = () => {
            document.querySelectorAll('.theme-btn').forEach(b => {
                b.className = 'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold';
            });
        };
    }

    if ($('btnSpeak')) {$('btnSpeak').onclick = () => {
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
            else if (currentStory) speak(currentStory + ' ' + (expectedAction ? actionLabel(expectedAction) : ''));
        };
    }
});
</script>
