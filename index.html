<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聲動奇境 - 智慧互動有聲繪本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { magic: { dark: '#0f172a', card: '#1e1b4b', purple: '#8b5cf6', pink: '#ec4899', cyan: '#06b6d4' } },
                    fontFamily: { fredoka: ['Fredoka', 'Noto Sans TC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Fredoka', 'Noto Sans TC', sans-serif; background: radial-gradient(circle at top, #2e1065 0%, #0f172a 100%); min-height: 100vh; }
        .glow-button { box-shadow: 0 4px 20px rgba(236, 72, 153, 0.5); transition: all 0.3s ease; }
    </style>
</head>
<body class="text-slate-100 p-4 md:p-8 flex flex-col items-center min-h-screen justify-between">

    <header class="w-full max-w-4xl text-center my-4">
        <div class="inline-flex items-center gap-3 bg-indigo-950/80 px-6 py-2 rounded-full border border-indigo-500/30 mb-3 shadow-lg">
            <i class="fa-solid font-bold fa-headphones-simple text-amber-400"></i>
            <span class="text-amber-300 font-semibold text-sm">硬體互動連動中・搖晃裝置即可自動解鎖下一段</span>
        </div>
        <h1 class="text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300">
            聲動奇境 ✨ 智慧互動繪本
        </h1>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6 my-auto">
        <!-- 藍牙控制區 -->
        <section class="md:col-span-1 bg-slate-900/80 p-6 rounded-3xl border border-purple-500/20 shadow-2xl flex flex-col justify-between gap-6">
            <div>
                <h2 class="text-xl font-bold text-cyan-300 mb-4 flex items-center gap-2">
                    <i class="fa-bluetooth-b fab text-cyan-400"></i> 藍牙連線
                </h2>
                <div class="bg-slate-800/90 p-4 rounded-2xl border border-slate-700/50 mb-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span id="statusIndicator" class="w-4 h-4 rounded-full bg-slate-500 inline-block shadow"></span>
                        <div>
                            <div class="text-xs text-slate-400">狀態</div>
                            <div id="statusText" class="font-bold text-slate-200 text-sm">尚未連線</div>
                        </div>
                    </div>
                    <i id="statusIcon" class="fa-solid fa-plug-circle-xmark text-slate-500 text-xl"></i>
                </div>
                <button id="btnConnect" class="w-full bg-cyan-500 hover:bg-cyan-400 text-white font-bold py-3 px-4 rounded-2xl shadow-lg transition text-sm">連接故事裝置</button>
            </div>

            <div class="bg-indigo-950/40 p-4 rounded-2xl border border-indigo-800/40">
                <h3 class="text-sm font-bold text-purple-300 mb-2">手動測試互動</h3>
                <button id="btnManualAction" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-3 rounded-xl shadow-md text-sm transition">
                    ✨ 模擬做完動作 (解鎖下一段)
                </button>
            </div>
        </section>

        <!-- 故事顯示區 -->
        <section class="md:col-span-2 bg-slate-900/80 p-6 rounded-3xl border border-purple-500/25 shadow-2xl flex flex-col justify-between gap-6">
            <div class="relative flex-1 bg-slate-950/70 rounded-2xl p-6 border border-slate-800 flex flex-col justify-between min-h-[300px]">
                <div class="overflow-y-auto max-h-[320px] pr-2 space-y-4">
                    <div id="welcomeMessage" class="text-center py-10">
                        <div class="text-5xl mb-3">📖✨</div>
                        <h3 class="text-lg font-bold text-purple-300">準備好體驗硬體互動了嗎？</h3>
                        <p class="text-sm text-slate-400 mt-1">故事唸到互動點時會暫停，此時只要搖晃你的 ESP32 裝置，即可自動繼續播放！</p>
                    </div>
                    <div id="storyDisplay" class="text-lg leading-relaxed text-slate-300 hidden whitespace-pre-line"></div>
                </div>

                <div id="actionPrompt" class="hidden mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-sm bg-pink-950/40 p-3 rounded-xl border border-pink-500/30">
                    <div class="flex items-center gap-2 text-pink-400 font-bold animate-pulse">
                        <i class="fa-solid fa-hand-sparkles text-lg"></i>
                        <span id="promptText">🛑 請搖晃硬體裝置來繼續故事...</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-3 gap-2">
                    <button data-theme="勇敢的小騎士與巨龍" class="theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-3 rounded-xl text-xs font-semibold">⚔️ 騎士巨龍</button>
                    <button data-theme="神奇魔法森林的密道" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-3 rounded-xl text-xs font-semibold">🌲 魔法森林</button>
                    <button data-theme="海底王國的寶藏探險" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-3 rounded-xl text-xs font-semibold">🐬 海底寶藏</button>
                </div>
                
                <div class="flex gap-3">
                    <button id="btnGenerate" class="flex-1 glow-button bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 text-white font-black py-4 px-6 rounded-2xl text-base flex items-center justify-center gap-3">
                        <i id="btnIcon" class="fa-solid fa-wand-magic-sparkles"></i>
                        <span id="btnText">開始互動冒險繪本</span>
                    </button>
                    <button id="btnSpeak" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 px-5 rounded-2xl border border-slate-700 text-xl transition">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-purple-500/50 text-slate-100 px-6 py-3 rounded-2xl shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50 text-sm font-semibold"></div>

    <script>
        const BLE_CONFIG = {
            serviceUuid: '4fa8691a-136d-4560-84ed-01354051b785',
            characteristicUuid: 'beb5483e-36e1-4688-b7f5-ea07361b26a8'
        };
        const WORKER_URL = 'https://empty-credit-1539.rrong1041.workers.dev';

        let bleDevice = null, bleCharacteristic = null;
        let selectedTheme = "勇敢的小騎士與巨龍";
        let storyParts = [];
        let currentPartIndex = 0;
        let waitingForAction = false;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            t.classList.add('opacity-100');
            setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0', 'pointer-events-none'); }, 3000);
        }

        async function connectBLE() {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [BLE_CONFIG.serviceUuid] });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(BLE_CONFIG.serviceUuid);
                bleCharacteristic = await service.getCharacteristic(BLE_CONFIG.characteristicUuid);

                // 關鍵：啟動藍牙通知監聽，接收來自 ESP32 的搖晃訊號！
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const decoder = new TextDecoder();
                    const value = decoder.decode(event.target.value);
                    console.log("收到 ESP32 訊號: ", value);

                    if (value === "SWIPE" || value === "START_TRIGGER") {
                        showToast("✨ 偵測到硬體動作！");
                        resumeNextPart();
                    }
                });

                document.getElementById('statusIndicator').className = 'w-4 h-4 rounded-full bg-emerald-500 inline-block shadow-lg animate-pulse';
                document.getElementById('statusText').textContent = '已連線';
                showToast('藍牙連線成功，已啟用硬體監聽！');
            } catch (e) {
                showToast('連線失敗: ' + e.message);
            }
        }

        function resumeNextPart() {
            if (waitingForAction) {
                waitingForAction = false;
                document.getElementById('actionPrompt').classList.add('hidden');
                showToast('✨ 動作完成！繼續冒險');
                currentPartIndex++;
                playNextPart();
            }
        }

        async function generateStory() {
            const btn = document.getElementById('btnGenerate');
            document.getElementById('btnText').textContent = "正在編寫互動故事...";
            document.getElementById('btnIcon').className = "fa-solid fa-spinner animate-spin";
            btn.disabled = true;

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: selectedTheme })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                storyParts = data.story.split('[ACTION]').map(s => s.trim()).filter(s => s.length > 0);
                currentPartIndex = 0;
                
                document.getElementById('welcomeMessage').classList.add('hidden');
                const display = document.getElementById('storyDisplay');
                display.textContent = data.story.replace(/\[ACTION\]/g, '\n\n🛑 【搖晃互動點】\n\n');
                display.classList.remove('hidden');
                document.getElementById('btnSpeak').disabled = false;

                showToast('故事生成完畢！');
                playNextPart();
            } catch (e) {
                showToast('錯誤: ' + e.message);
            } finally {
                document.getElementById('btnText').textContent = "開始互動冒險繪本";
                document.getElementById('btnIcon').className = "fa-solid fa-wand-magic-sparkles";
                btn.disabled = false;
            }
        }

        function playNextPart() {
            if (currentPartIndex >= storyParts.length) {
                showToast('🎉 恭喜完成所有冒險！');
                document.getElementById('actionPrompt').classList.remove('hidden');
                document.getElementById('promptText').textContent = "🎉 恭喜！所有互動冒險圓滿達成！";
                return;
            }

            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();

            const text = storyParts[currentPartIndex];
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.95;

            document.getElementById('actionPrompt').classList.add('hidden');

            utterance.onend = function() {
                if (currentPartIndex < storyParts.length - 1) {
                    waitingForAction = true;
                    document.getElementById('actionPrompt').classList.remove('hidden');
                    document.getElementById('promptText').textContent = `🛑 請搖晃 ESP32 裝置來解鎖下一段故事...`;
                    showToast('🛑 故事已暫停，等待搖晃硬體...');
                } else {
                    document.getElementById('actionPrompt').classList.remove('hidden');
                    document.getElementById('promptText').textContent = "🎉 故事全部講完了！";
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnConnect').addEventListener('click', connectBLE);
            document.getElementById('btnManualAction').addEventListener('click', resumeNextPart);
            document.getElementById('btnGenerate').addEventListener('click', generateStory);
            
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.theme-btn').forEach(b => b.className = 'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-3 rounded-xl text-xs font-semibold');
                    e.target.className = 'theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-3 rounded-xl text-xs font-semibold';
                    selectedTheme = e.target.getAttribute('data-theme');
                });
            });

            document.getElementById('btnSpeak').addEventListener('click', () => {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                } else if (storyParts.length > 0) {
                    playNextPart();
                }
            });
        });
    </script>
</body>
</html>
