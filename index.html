<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>聲動奇境｜AI互動式冒險裝置</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#312e81,#111827 70%);color:#fff;min-height:100vh;padding:18px}
.card{max-width:560px;margin:auto;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:20px;backdrop-filter:blur(12px);box-shadow:0 18px 50px #0006}
h1{font-size:25px;margin:0 0 4px} .sub{color:#c7d2fe;font-size:13px;margin-bottom:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
button,input{font:inherit}button{border:0;border-radius:12px;padding:12px;cursor:pointer}
.connect{background:#2563eb;color:white;font-weight:700}.start{background:linear-gradient(135deg,#ec4899,#7c3aed);color:#fff;font-weight:800;width:100%;margin-top:10px}
select,input{width:100%;padding:11px;border-radius:11px;border:1px solid #ffffff33;background:#fff;color:#111827}
label{display:block;font-size:13px;color:#cbd5e1;margin:12px 0 6px}
.status{padding:9px 12px;border-radius:10px;background:#0005;margin:10px 0;font-size:13px}
.ok{color:#86efac}.bad{color:#fca5a5}.story{margin-top:14px;background:#0f172acc;border-radius:16px;padding:17px;line-height:1.65;min-height:170px;white-space:pre-wrap}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.choice{background:#ffffff18;color:#fff;border:1px solid #ffffff33}.choice:disabled{opacity:.35}
.log{font-size:12px;color:#94a3b8;margin-top:12px;min-height:18px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#4f46e533;color:#c7d2fe;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>✨ 聲動奇境</h1>
  <div class="sub">AI互動式冒險裝置｜AI即時生成故事 × BLE體感互動</div>

  <div class="row">
    <button class="connect" id="bleBtn">🔗 連線 ESP32</button>
    <div class="status" id="status">尚未連線</div>
  </div>

  <label>故事主題</label>
  <select id="theme">
    <option>騎士與巨龍</option>
    <option>魔法森林</option>
    <option>海底寶藏</option>
    <option>太空探險</option>
    <option>神秘古堡</option>
  </select>

  <label>自訂主題（可留空）</label>
  <input id="custom" placeholder="例如：尋找彩虹山頂的棉花糖巨龍">

  <button class="start" id="startBtn">🪄 開始 AI 冒險</button>

  <div class="badge" id="mode">等待開始</div>
  <div class="story" id="story">按下「開始 AI 冒險」，AI 會真正生成第一段故事。接著你可以直接用 ESP32 的按鈕或體感動作決定故事走向。</div>
  <div class="choices">
    <button class="choice" id="a" disabled>A</button>
    <button class="choice" id="b" disabled>B</button>
    <button class="choice" id="c" disabled>C</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a9";
let characteristic = null;
let history = [];
let busy = false;
let connectedDevice = null;

// ==========================================
// ⚠️ 重要：請把下方引號內的網址，換成妳自己的 Cloudflare Worker 網址！
// ==========================================
const WORKER_API_URL = "https://你的worker名稱.workers.dev/api/story"; 

const $ = id => document.getElementById(id);
function setStatus(t, cls=""){ $("status").textContent=t; $("status").className="status "+cls; }
function log(t){ $("log").textContent=t; }

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW";
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

async function sendBLE(text){
  if(!characteristic) return;
  try{
    await characteristic.writeValue(new TextEncoder().encode(text));
  }catch(e){ log("BLE 傳送失敗："+e.message); }
}

function setChoices(choices){
  const ids=["a","b","c"];
  ids.forEach((id,i)=>{
    const b=$(id);
    b.textContent=choices && choices[i] ? choices[i] : ["選擇 A","選擇 B","選擇 C"][i];
    b.disabled=!choices || !choices[i] || busy;
  });
}

async function connectBluetooth(){
  try{
    if(!navigator.bluetooth) throw new Error("此瀏覽器不支援 Web Bluetooth。如果是手機，請使用 Android Chrome 或 iOS 的 Bluefy App。");
    setStatus("搜尋 ESP32…");
    const device=await navigator.bluetooth.requestDevice({
      filters:[{name:"SmartStoryBook"}],
      optionalServices:[SERVICE_UUID]
    });
    connectedDevice=device;
    device.addEventListener("gattserverdisconnected",()=>{ characteristic=null; setStatus("ESP32 已斷線","bad"); });
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    characteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
    if(characteristic.properties.notify){
      await characteristic.startNotifications();
      characteristic.addEventListener("characteristicvaluechanged", onBLEMessage);
    }
    setStatus("✨ ESP32 已連線","ok");
    log("按鈕／體感事件會自動送給 AI。");
    await sendBLE("CONNECTED");
  }catch(e){
    console.error(e);
    setStatus("連線失敗","bad");
    log(e.message);
  }
}

function onBLEMessage(event){
  const value=new TextDecoder().decode(event.target.value).trim();
  log("裝置事件："+value);
  if(value==="BTN_A") continueStory("按下左鍵 A");
  else if(value==="BTN_B") continueStory("按下中鍵 B");
  else if(value==="BTN_C") continueStory("按下右鍵 C");
  else if(value==="MOTION_SWING") continueStory("揮動手環");
  else if(value==="MOTION_JUMP") continueStory("跳動手環");
}

async function callAI(mode, action=""){
  const theme=$("custom").value.trim() || $("theme").value;
  const res=await fetch(WORKER_API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({mode,theme,action,history})
  });
  if(!res.ok) throw new Error(await res.text());
  return await res.json();
}

function renderStory(data){
  $("story").textContent=data.story || "AI 沒有產生故事內容。";
  $("mode").textContent=data.nextAction ? "🎯 "+data.nextAction : "✨ AI 故事";
  setChoices(data.choices || []);
  speak((data.story || "") + (data.choices?.length ? " " + data.choices.join("。") : ""));
}

async function startStory(){
  if(busy) return;
  busy=true; setChoices([]); $("story").textContent="🤖 AI 正在編織你的冒險…"; log("正在向 AI 請求第一段故事。");
  try{
    history=[];
    const data=await callAI("start");
    history.push({role:"assistant",...data});
    renderStory(data);
    await sendBLE("START_STORY");
    log("第一段故事完成。現在直接操作 ESP32。");
  }catch(e){
    $("story").textContent="AI 連線失敗："+e.message;
    log("請確認 Cloudflare Worker 網址是否正確。");
  }finally{busy=false; setChoices(history.at(-1)?.choices || []);}
}

async function continueStory(action){
  if(busy || history.length===0) return;
  busy=true; setChoices([]); $("mode").textContent="🤖 AI 正在判斷…"; log("收到："+action+"，AI 正在生成下一段。");
  try{
    history.push({role:"user",content:action});
    const data=await callAI("continue",action);
    history.push({role:"assistant",...data});
    renderStory(data);
    if(data.haptic) await sendBLE(data.haptic);
    log("AI 已根據你的動作改變故事。");
  }catch(e){
    log("AI 生成失敗："+e.message);
    setChoices(history.at(-2)?.choices || []);
  }finally{busy=false;}
}

$("bleBtn").onclick=connectBluetooth;
$("startBtn").onclick=startStory;
$("a").onclick=()=>continueStory("按下左鍵 A");
$("b").onclick=()=>continueStory("按下中鍵 B");
$("c").onclick=()=>continueStory("按下右鍵 C");
</script>
</body>
</html>
