<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D24">
<title>聲動奇境｜一邊聽、一邊動的冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;800&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--night:#0E0D24;--dusk:#2B2A5C;--plum:#5A3F8E;--peach:#FFB48A;--cream:#FFF7E6;--line:#EBDDBF;--moon:#FFD86B;--mint:#8FE8CC;--berry:#FF7E96;--ink:#2B2A5C;--soft:#6E6C92;
  --story:"Huninn","Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --round:"Chiron GoRound TC","Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--round);font-weight:500;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}

/* 夥伴的臉 */
.face{position:relative;width:7.2em;height:4.6em;--glow:0}
.face .eye{position:absolute;top:.4em;width:2.1em;height:2.7em;border-radius:.9em;background:var(--moon);
  box-shadow:0 0 calc(.6em + 1.4em*var(--glow)) rgba(255,216,107,calc(.35 + .5*var(--glow)));transition:all .3s;animation:blink 5s infinite}
.face .eye.l{left:.6em}.face .eye.r{right:.6em;animation-delay:.07s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.face[data-emo=happy] .eye{height:1.4em;top:1em;border-radius:1.4em 1.4em .3em .3em}
.face[data-emo=worried] .eye{height:2.1em;top:.8em}
.face[data-emo=worried] .eye.l{transform:rotate(12deg)}.face[data-emo=worried] .eye.r{transform:rotate(-12deg)}
.face.thinking .eye{animation:look 2.4s ease-in-out infinite}
@keyframes look{0%,100%{translate:-.35em 0}50%{translate:.35em 0}}
.face.moving{animation:hop .45s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-.35em)}}

/* 準備畫面 */
#home{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.top .face{font-size:9px;background:var(--dusk);border-radius:22px;padding:8px;width:auto;height:auto;min-width:74px;min-height:50px}
h1{margin:0;font-size:1.9rem;line-height:1.2;letter-spacing:.04em}
.sub{margin:2px 0 0;color:var(--soft);font-size:.95rem}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
.ask{display:block;font-weight:800;font-size:1.15rem;margin-bottom:8px}
#idea{width:100%;min-height:64px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;background:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips button{background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.95rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.row small{display:block;color:var(--soft);font-size:.82rem;line-height:1.4}
.seg{display:flex;gap:6px}
.seg button{min-width:44px;padding:6px 10px;border-radius:12px;background:var(--cream);border:2px solid var(--line);font-weight:800}
.seg button[aria-pressed=true]{background:var(--dusk);color:#fff;border-color:var(--dusk)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--plum)}
.band{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#C9C3B4;margin-right:6px}.dot.on{background:#2DBE7E}
.ghost{border:2px solid var(--dusk);border-radius:999px;padding:6px 16px;font-weight:800;white-space:nowrap}
#begin{display:block;width:100%;margin:18px 0 6px;padding:16px;border-radius:999px;background:var(--dusk);color:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 6px 0 #1b1a40}
#begin:active{transform:translateY(3px);box-shadow:0 3px 0 #1b1a40}
#notice{min-height:1.4em;color:#B23A55;font-weight:800;text-align:center;margin:6px 0}
#replayBanner{background:var(--mint);border-radius:14px;padding:8px 12px;font-weight:800;text-align:center}
.past ul{list-style:none;margin:0;padding:0}
.past li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.past li:first-child{border-top:0}
.past li span{flex:1}.past li small{color:var(--soft)}
.past li button{background:var(--moon);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem}

/* 故事畫面 */
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#22204a 0%,var(--night) 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:hidden}
#stage .face{font-size:min(5.2vw,26px);margin-bottom:6vh}
#caption{font-family:var(--story);font-size:clamp(1.15rem,4.6vw,1.75rem);line-height:1.6;text-align:center;max-width:820px;min-height:3.2em;text-shadow:0 2px 10px rgba(0,0,0,.4)}
#title{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:70px;color:rgba(255,255,255,.55);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meter{width:min(520px,86vw);height:14px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:5vh;overflow:hidden;opacity:0;transition:opacity .3s}
#meter.on{opacity:1}#meterFill{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--moon));transition:width .2s}
#fork{display:flex;gap:14px;margin-top:5vh;width:min(620px,92vw)}
#fork button{flex:1;padding:18px 10px;border-radius:22px;background:rgba(255,255,255,.1);border:3px solid var(--moon);color:#fff;font-size:1.25rem;font-weight:800;line-height:1.4}
#fork button b{display:block;font-size:2rem;color:var(--moon)}
#ctlBtn{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:1.3rem}
#sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(14,13,36,.96);border-top:2px solid rgba(255,255,255,.15);padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
#sheet button{padding:12px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:none}
#sheet .hold{background:var(--plum)}#sheet .hold.fast{background:var(--berry)}
#sheetInfo{grid-column:1/-1;color:rgba(255,255,255,.6);font-size:.85rem;text-align:center}
#resume{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,13,36,.85)}
#resume button{padding:18px 28px;border-radius:999px;background:var(--moon);color:var(--ink);font-size:1.3rem;font-weight:800}

/* 結束畫面 */
#finale{max-width:560px;margin:0 auto;padding:48px 16px;text-align:center}
#finale h2{font-size:1.6rem;margin:10px 0}
#stat{font-size:1.25rem;font-weight:800;color:var(--plum)}
#finale button{display:block;width:100%;margin:12px 0;padding:14px;border-radius:999px;font-weight:800;font-size:1.1rem}
#again{background:var(--dusk);color:#fff}#home2{border:2px solid var(--dusk)}
</style>
</head>
<body>
<main id="home">
  <div class="top"><div class="face" data-emo="happy"><i class="eye l"></i><i class="eye r"></i></div>
    <div><h1>聲動奇境</h1><p class="sub">一邊聽故事，一邊用身體冒險</p></div></div>
  <div id="replayBanner" hidden></div>
  <section class="card">
    <label class="ask" for="idea">今天想聽什麼冒險？</label>
    <textarea id="idea" maxlength="60" placeholder="例如：去月亮找掉下來的星星"></textarea>
    <ul class="chips" id="chips">
      <li><button type="button" data-idea="會打嗝的企鵝找回家的路">🐧 打嗝的企鵝</button></li>
      <li><button type="button" data-idea="去月亮找掉下來的星星">🌙 月亮上的星星</button></li>
      <li><button type="button" data-idea="海底的音樂會">🌊 海底音樂會</button></li>
      <li><button type="button" data-idea="">🎲 讓故事自己決定</button></li>
    </ul>
  </section>
  <section class="card">
    <div class="row"><b>幾歲？</b><div class="seg" id="ages"><button type="button" data-age="5" aria-pressed="false">5</button><button type="button" data-age="6" aria-pressed="true">6</button><button type="button" data-age="7" aria-pressed="false">7</button><button type="button" data-age="8" aria-pressed="false">8</button></div></div>
    <div class="row"><div class="band"><span id="bandState"></span></div><button type="button" class="ghost" id="connect">連接手環</button></div>
    <div class="row"><span><b>坐著玩</b><small>故事不會要你跑和跳</small></span><input type="checkbox" id="seated"></div>
    <div class="row"><span><b>好聽的配音</b><small>Fish 配音；不能用時自動換成裝置的聲音</small></span><input type="checkbox" id="fish" checked></div>
    <div class="row"><span><b>背景音樂</b><small>動的時候有節奏，可以跟著動</small></span><input type="checkbox" id="music" checked></div>
    <div class="row"><span><b>顯示字幕</b><small>讓旁邊的人看到故事在說什麼</small></span><input type="checkbox" id="subs" checked></div>
    <div class="row"><span><b>示範模式（給大人看）</b><small>打開後，沒戴手環時會假裝有小孩在動，故事會自己往下走</small></span><input type="checkbox" id="demo"></div>
    <div class="row"><span><b>手環靈敏度</b><small>孩子動了卻沒反應，就調高</small></span><div class="seg" id="sens"><button type="button" data-sens="low" aria-pressed="false">低</button><button type="button" data-sens="mid" aria-pressed="true">中</button><button type="button" data-sens="high" aria-pressed="false">高</button></div></div>
  </section>
  <button type="button" id="begin">開始冒險</button>
  <p id="notice" role="status"></p>
  <section class="card past" id="past" hidden><b>玩過的故事</b><ul id="pastList"></ul></section>
</main>

<section id="stage" hidden aria-label="故事進行中">
  <div id="title"></div>
  <button type="button" id="ctlBtn" aria-label="大人控制">⚙</button>
  <div class="face" id="face" data-emo="calm"><i class="eye l"></i><i class="eye r"></i></div>
  <div id="demoTag" hidden style="position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;z-index:5">示範模式：假裝有小孩在動</div>
  <p id="caption" aria-live="polite"></p>
  <div id="meter" aria-hidden="true"><i id="meterFill"></i></div>
  <div id="fork" hidden>
    <button type="button" data-choice="left"><b>◀</b><span id="forkL"></span></button>
    <button type="button" data-choice="right"><b>▶</b><span id="forkR"></span></button>
  </div>
  <div id="sheet" hidden>
    <button type="button" class="hold" id="simSlow">按住＝慢慢動</button>
    <button type="button" class="hold fast" id="simFast">按住＝用力動</button>
    <button type="button" id="pauseBtn">暫停</button>
    <button type="button" id="skipBtn">跳過這段動作</button>
    <button type="button" id="quitBtn">結束故事</button>
    <div id="sheetInfo"></div>
  </div>
  <div id="resume" hidden><button type="button" id="resumeBtn">點一下，故事繼續</button></div>
</section>

<section id="finale" hidden>
  <div class="face" data-emo="happy" style="font-size:12px;margin:0 auto;background:var(--dusk);border-radius:24px;padding:10px;width:auto;height:auto;display:inline-block;min-width:96px;min-height:64px"><i class="eye l"></i><i class="eye r"></i></div>
  <h2 id="endTitle"></h2>
  <p id="stat"></p>
  <p id="bye"></p>
  <button type="button" id="again">再玩這篇</button>
  <button type="button" id="home2">換一個新故事</button>
</section>

<script>
'use strict';
/* ═════════ 設定 ═════════ */
const WORKER_URL='https://lucky-waterfall-f8a2.shopcom2009.workers.dev'; // 換 Worker 網址時只改這一行
const BLE={service:'4fa8691a-136d-4560-84ed-01354051b785',characteristic:'beb5483e-36e1-4688-b7f5-ea07361b26a8'};
// 手環門檻（2026/11/14 實測：不動 0～1、輕擺 2～3、揮手 4～10、用力跑 7～10）。手環只看快慢，不分辨姿勢
const SENS={low:{strongMin:6,moveMin:4,lightMin:1,lightMax:4,stillMax:1},mid:{strongMin:5,moveMin:3,lightMin:1,lightMax:4,stillMax:1},high:{strongMin:4,moveMin:2,lightMin:1,lightMax:3,stillMax:1}};

/* ═════════ 畫面小工具 ═════════ */
function $(id){return document.getElementById(id)}
function show(id,on){$(id).hidden=!on}
function notice(t){$('notice').textContent=t||''}
/* ENGINE-BEGIN —— 故事播放引擎：不碰畫面、聲音、藍牙，全部從 d 傳進來（可以在電腦上模擬測試） */
function createEngine(d){
  const cfg=Object.assign({tick:100,strongMin:5,moveMin:3,lightMin:1,lightMax:4,stillMax:1,fresh:800,
    idleAt:[5,10],giveUp:14,lineGap:1400,eventSecs:{stop:3,fast:5},choiceRemind:15,choiceAuto:45},d.cfg||{});
  const S={run:0,phase:'idle',paused:false,level:0,levelAt:-1e9,act:null,choiceWaiter:null,moved:0,last:'win',story:null};
  const alive=r=>r===S.run;
  const noDing=t=>String(t||'').replace(/^\s*叮咚[！!～~。，,…—\s]*/,''),noDrum=t=>String(t||'').replace(/^\s*(咚[、，,！!～~…—\s]*){2,}/,'');
  // 每個動作：孩子身體要做什麼（夥伴喊出來），動的時候聽到什麼聲音（飛是呼咻、划是水聲、跳是彈簧聲……）
  // AI 有寫 body 就用 AI 的；舊的故事沒有，就從開始的話猜
  const BODY_RULES=[[/跳舞|舞/,'原地跳舞','boing'],[/轉圈|旋/,'原地轉圈圈','whoosh'],[/飛|翅膀|飄|拍翅/,'拍拍手臂','whoosh'],[/划|槳|船|游/,'雙手用力划','splash'],
    [/爬|攀/,'雙手往上爬','rustle'],[/跳|蹦|彈/,'原地跳','boing'],[/塞|放進|摸|拿/,'手輕輕伸出去','none'],[/踮|輕輕|偷偷|悄悄|躡/,'踮腳走','none'],[/鑽|蹲|趴|低頭/,'蹲低身體','rustle'],
    [/搖|扭|擺|晃/,'左右搖','swish'],[/揮|甩|劍|打/,'用力揮手','swish'],[/推/,'雙手用力推','step'],[/拉(?!著)|拔(?!腿)/,'用力往後拉','step'],[/挖/,'雙手挖挖挖','rustle'],
    [/舉|拋|伸|摘|抓/,'把手伸高高','swish'],[/抖/,'全身抖一抖','swish'],[/跑|衝|追|逃|奔|踏|趕/,'原地跑','step']];
  const SEATED_BODY=[['原地跳舞','坐著扭一扭'],['原地跑','雙手快快拍腿'],['原地跳','手舉高高'],['踮腳走','手指輕輕走'],['蹲低身體','身體壓低低'],['原地轉圈圈','雙手轉圈圈']];
  const SOUND_GAP={step:220,whoosh:650,splash:520,rustle:300,boing:480,swish:380,clap:300};
  function bodyOf(m){if(!m)return {body:'',sound:'none'};if(m.pace==='still')return {body:'一動也不動',sound:'none'};
    const t=String(m.go||'');let body=String(m.body||'').trim(),sound=m.sound||'';
    if(m.pace==='light'){if(!body)body=/塞|放|摸|拿|伸|摘|抓/.test(t)?'手輕輕伸出去':'踮腳走';sound='none'}   // 要很輕：踮腳或手輕輕伸，不放聲音
    for(const [re,bd,sd] of BODY_RULES)if(re.test(t)){if(!body)body=bd;if(!sound)sound=sd;break}
    if(!body)body={fast:'原地跑',light:'踮腳走'}[m.pace]||'動一動';if(!sound)sound=m.pace==='light'?'none':'step';
    if(S.story&&S.story.seated)for(const [a,b] of SEATED_BODY)body=body.replace(a,b);
    return {body,sound}}
  const buddyName=()=>(S.story&&S.story.buddy&&S.story.buddy.name)||'夥伴';
  const cueOf=m=>{const {body}=bodyOf(m);if(!body)return '';const B=buddyName();
    return m.pace==='still'?B+'小小聲說：「'+body+'……」':m.pace==='light'?B+'小小聲說：「'+body+'……」':B+'喊：「'+body+'！」'};
  const showOf=m=>{const {body}=bodyOf(m);const B=buddyName();return m.pace==='still'?B+'也變成木頭人：「'+body+'……」':B+'在旁邊做給你看：「'+body+'，像這樣！」'};
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  async function hold(r){while(alive(r)&&S.paused)await d.sleep(cfg.tick)}
  async function say(r,text){text=String(text||'').trim();if(!text||!alive(r))return;await hold(r);if(!alive(r))return;d.ui('line',text);await d.speak(text)}
  // 依序念的佇列：動作進行中，迴圈不會等它念完
  function queue(r){const q=[];let busy=false,lastEnd=d.now();
    async function pump(){if(busy)return;busy=true;while(q.length&&alive(r)){await say(r,q.shift());lastEnd=d.now()}busy=false}
    return {push(t){if(t){q.push(t);pump()}},clear(){q.length=0},get idle(){return !busy&&!q.length},get lastEnd(){return lastEnd},async drain(){while(busy&&alive(r))await d.sleep(cfg.tick)}}}
  const lv=()=>d.now()-S.levelAt<cfg.fresh?S.level:0;

  // 一段動作。孩子動，故事就回應他（跑得快、慢聽到的話不同）；停下來，故事用三句不一樣的話邀他；20 秒都沒動，夥伴陪著完成
  async function runMove(r,m,b){
    const A=S.act={skip:false,pace:m.pace||'move',ev:null};
    const need=Number(m.seconds)||18,pace=m.pace||'move';
    const {body,sound}=bodyOf(m),gap=SOUND_GAP[sound]||220;
    d.ui('move',{pace,go:m.go,body});d.cmd('ACT:BODY');d.cmd('BUZZ');d.sfx('drums');
    await d.sleep(1100);if(!alive(r))return;                                   // 先聽完「咚、咚、咚！」再說話
    const q=queue(r);q.push(noDrum(m.go));q.push(cueOf(m));                 // 鼓聲已經響了，開始的話不用再念「咚咚咚」；接著夥伴喊出身體要做什麼（「原地跑！」）
    // 第一輪照 AI 寫的順序念（「越來越近」→「追上了」），之後才打亂；不會連講同一句
    let F=(m.fast||[]).slice(),SL=((m.slow&&m.slow.length?m.slow:m.fast)||[]).slice(),fi=0,si=0,calm=0,lastLine='';
    const pick=(L,i,re)=>{if(!L.length)return '';if(i>0&&i%L.length===0){const n=shuffle(L);L.splice(0,L.length,...n)}let x=L[i%L.length];if(L.length>1&&x===lastLine)x=L[(i+1)%L.length];return x};

}
// 說故事的停頓：句子結束停久一點，換角色說話前後也停一下。停頓中被暫停或取消都會立刻反應
async function storyPause(ms,my){const end=performance.now()+ms;while(my===speechToken&&performance.now()<end){await waitResume(my);await new Promise(r=>setTimeout(r,40))}}
async function speak(text){
  // 保險：新的一句開始前，上一句（Fish 音檔或裝置語音）一定先停掉，不會兩個聲音疊在一起
  try{if(fishPlaying)player.pause()}catch(e){}try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel()}catch(e){}try{if(speechEnd)speechEnd()}catch(e){}
  const my=++speechToken;
  if(voiceMode==='fish'){                                   // Fish 自己的聲音就有語氣，維持一段一段送
    // 以前整段一口氣唸完、句子之間沒有換氣，聽起來很急：改成兩三句一段，每段之間停一下
    const parts=fishPieces(text);parts.forEach(p=>voiceFor(p));          // 整段的每一小段同時開始準備，唸第一段時後面的就好了
    let prevTalk=null;
    for(const p of parts){if(my!==speechToken)return;const talk=p.startsWith('\u0001'),t=talk?p.slice(1):p;
      if(prevTalk!==null&&prevTalk!==talk)await storyPause(260,my);      // 換人說話前停一下
      $('caption').textContent=talk?'「'+t+'」':t;await speakFish(p,my);prevTalk=talk;
      await storyPause(/[。！？!?…」]$/.test(t)?550:300,my)}
    return;
  }
  // 裝置語音：旁白和對話分開唸，一句一句唸（暫停後只重唸那一句）；字幕跟著目前唸的這一句走
  let prev=null;
  for(const part of storyParts(text)){
    if(my!==speechToken)return;
    if(prev&&prev!==part.role)await storyPause(260,my);
    for(const p of chunk(part.text,110)){                      // 一次唸一整句，不在逗號切開
      if(my!==speechToken)return;
      $('caption').textContent=part.role==='talk'?'「'+p+'」':p;
      await speakDevice(p,my,part.role);
      await storyPause(/[。！？!?…—」]$/.test(p)?420:150,my);
    }
    prev=part.role;
  }
}
// 馬上要唸的句子：不排隊，全部同時開始準備
function prefetchNow(list){if(voiceMode!=='fish')return;for(const t of list)if(t&&String(t).trim())for(const p of fishPieces(String(t).trim()))voiceFor(p)}
function prefetchText(list){
  if(voiceMode!=='fish')return;
  for(const t of list)if(t&&String(t).trim())for(const p of fishPieces(String(t).trim()))prefetchChain=prefetchChain.then(()=>voiceFor(p)).catch(()=>{});
}

/* ═════════ 聲音：音效（用程式合成，不需要音檔） ═════════ */

const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

// ── 真的鼓和真的門鈴：照真的樂器怎麼發聲來合成（不需要音檔，也不用下載）
// 鼓：鼓皮被打下去的瞬間音比較高、馬上掉下來（「咚」的感覺），再加上鼓皮的泛音、鼓棒打到的「啪」、鼓身的空氣聲，最後有一點房間的回音。
// 門鈴：兩根金屬音條被小槌敲到（Mi→Do），基音響很久，金屬的高泛音很快消失，兩個音差一點點，聽起來會「嗡嗡」地晃，像真的門鈴。

  o.frequency.setValueAtTime(f0*2.2,t);o.frequency.exponentialRampToValueAtTime(f0*1.05,t+.035);o.frequency.exponentialRampToValueAtTime(f0*.9,t+len);

  for(const [r,p,dk] of [[1.59,.32,.22],[2.14,.18,.12],[2.65,.1,.07]]){const x=a.createOscillator(),e=a.createGain();x.type='sine';   // 鼓皮的泛音（不是整數倍，所以聽起來像鼓、不像電子音）
    x.frequency.setValueAtTime(f0*r*1.6,t);x.frequency.exponentialRampToValueAtTime(f0*r,t+.03);env(e,t,p,.002,dk);x.connect(e);e.connect(out);x.start(t);x.stop(t+dk+.05)}

  if(name==='click'){noise(.04,'bandpass',2600,2,.5);return}                          // 轉手腕：「喀」

  if(name==='clang'){lastSfx=now;tone(1250,0,.25,.12);tone(1870,0,.18,.08);tone(2640,.01,.12,.05);return}                                                 // 打到：鏘
  if(name==='drum'){lastSfx=now;drumHit(0,92,.45,.5);return}                                                              // 咚
  if(name==='sparkle'){lastSfx=now;tone(1760,0,.12,.07);tone(2217,.07,.12,.07);tone(2637,.14,.2,.07);return}                                           // 魔法：叮叮叮
  if(name==='boing'){lastSfx=now;const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(520,t+.18);

/* ═════════ 背景音樂（用程式合成，不需要音檔） ═════════
   以前整篇只有人聲和「叮」，聽起來像在聽指令。現在故事有輕輕的音樂盒，動作有節奏（孩子可以跟著拍子動），
   要停住的時候音樂也跟著安靜下來。只用 C 大調五聲音階（Do Re Mi Sol La），怎麼排都不會難聽。
   story＝講故事　move＝動作　fast＝快！　soft＝輕輕的　still＝別動　branch＝選路　off＝關掉 */
const music=(()=>{
  // 音量：以前是 0.05，比 Fish 配音小 20 分貝左右，用手機喇叭幾乎聽不到，所以調大到大約 3 倍
  const MODES={story:{bpm:66,vol:.2},move:{bpm:112,vol:.26},fast:{bpm:138,vol:.28},soft:{bpm:80,vol:.2},still:{bpm:60,vol:.13},branch:{bpm:72,vol:.18}};
  const SC=[0,2,4,7,9],BASS=[65.41,55,87.31,98];                       // 低音：C、A、F、G，四小節一輪

  function ramp(tc){if(out&&actx)out.gain.setTargetAtTime(level(),actx.currentTime,tc||.25)}

    e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g,t+.012);e.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(e);e.connect(out);o.start(t);o.stop(t+dur+.05)}
  function kick(t,g){const o=actx.createOscillator(),e=actx.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);
    e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(e);e.connect(out);o.start(t);o.stop(t+.22)}

  function play(k,t,m){                                                // k：第幾個半拍（八個半拍是一小節）

    try{if(actx.state!=='running'&&actx.state!=='closed')Promise.resolve(actx.resume()).catch(()=>{})}catch(e){}
    try{const busy=typeof fishPlaying!=='undefined'&&fishPlaying;if(mainEl&&mainEl.paused&&!busy)Promise.resolve(mainEl.play()).catch(()=>{})}catch(e){}}
  function tick(){if(!actx||mode==='off'||held)return;revive();const m=mode,half=60/MODES[m].bpm/2;
    if(next<actx.currentTime)next=actx.currentTime+.05;

  function set(m){

    const a=audio();if(!a)return;
    if(!out){out=a.createGain();out.gain.value=.0001;out.connect(audioOut())}

    if(m==='off'){clearInterval(timer);timer=null}
    else{step=Math.ceil(step/8)*8;if(!timer)timer=setInterval(tick,60)}   // 換音樂時從新的一小節開始
  }
  return {set,get mode(){return mode},get on(){return on},get state(){return actx?actx.state:'none'},get level(){return out?out.gain.value:0},
    setOn(v){on=!!v;if(!on)set('off')},
    talk(v){talking=!!v;ramp(.12)},                                       // 夥伴講話時自動變小聲
    hold(v){held=!!v;ramp(.1)}};                                          // 暫停故事時音樂也停
})();

/* ═════════ 手環（藍牙） ═════════ */
const band={device:null,ch:null,queue:Promise.resolve(),connected:false};
function bandUI(){const el=$('bandState');el.replaceChildren();const i=document.createElement('i');i.className='dot'+(band.connected?' on':'');el.append(i,document.createTextNode(band.connected?'手環連上了':'手環還沒連上（可以用按鈕代替）'));$('connect').textContent=band.connected?'中斷手環':'連接手環'}
function cmd(c){if(!band.ch||!band.connected)return;const ch=band.ch;
  band.queue=band.queue.then(()=>ch===band.ch&&band.connected?ch.writeValue(new TextEncoder().encode(c)):null).catch(()=>{})}
// Windows 的 Chrome 第一次連藍牙常常失敗（Connection attempt failed），自動多試幾次
async function connectRetry(dev,tries=4){
  let last;
  for(let i=0;i<tries;i++){
    try{if(dev.gatt.connected)return dev.gatt;return await dev.gatt.connect()}
    catch(e){last=e;notice('正在連接手環……（第 '+(i+2)+' 次）');await new Promise(r=>setTimeout(r,800+i*400))}
  }
  throw last;
}
async function connectBand(){
  if(band.connected){try{band.device.gatt.disconnect()}catch(e){}return}
  if(!navigator.bluetooth||!navigator.bluetooth.requestDevice){notice('這個瀏覽器不能連手環。iPhone 請改用 Bluefy；也可以先用畫面上的按鈕試玩。');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[BLE.service]});
    const server=await connectRetry(dev),svc=await server.getPrimaryService(BLE.service),ch=await svc.getCharacteristic(BLE.characteristic);
    band.device=dev;band.ch=ch;band.connected=true;band.queue=Promise.resolve();
    dev.addEventListener('gattserverdisconnected',()=>{if(band.device!==dev)return;band.connected=false;band.ch=null;bandUI();notice('手環斷線了。可以重新連接，或長按畫面用按鈕代替。')});
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>{const t=new TextDecoder().decode(e.target.value).trim().toUpperCase();
      if(t.startsWith('CAL:')||t.startsWith('OK:'))return;
      if(t)engine.signal(t)});
    cmd('MODE_CHILD');cmd('GAME_ACTIVE');cmd('PAUSE');
    bandUI();notice('手環連上了。');
  }catch(e){band.connected=false;band.ch=null;bandUI();
    const m=String(e&&e.message||e);
    notice(/cancel/i.test(m)?'沒有選擇手環。':'沒有連上手環：'+m+'。請確認手環有開機、沒有被其他分頁或手機連著，再按一次「連接手環」。')}
}


/* ═════════ 把聲音、畫面、手環接到故事引擎 ═════════ */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function prefetch(list){prefetchText((list||[]).filter(Boolean))}
async function api(path,body){
  for(let attempt=0;;attempt++){
    const c=new AbortController(),t=setTimeout(()=>c.abort(),180000);          // AI 寫一篇大約 40～120 秒
    try{
      const r=await fetch(WORKER_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw Object.assign(Error(j.error||('故事伺服器回傳錯誤（'+r.status+'）')),{server:true});
      return j;
    }catch(e){
      if(e.name==='AbortError')throw Error('故事等太久了，請再試一次');
      if(e.server)throw e;
      if(attempt<1){await sleep(2500);continue}
      throw Error('連不到故事伺服器，請檢查網路或稍後再試');
    }finally{clearTimeout(t)}
  }
}
const face=$('face');
function fmtTime(s){s=Math.round(s||0);return s>=60?Math.floor(s/60)+' 分 '+(s%60)+' 秒':s+' 秒'}
let current=null,source='',subsOn=true;
function ui(ev,data){
  if(ev==='story'){$('title').textContent='《'+data.title+'》';face.classList.remove('thinking');face.dataset.emo='happy';music.set('story');info()}
  else if(ev==='line'){$('caption').textContent=data}
  else if(ev==='scene'){face.dataset.emo=/糟糕|不見|救命|快要|追|小心|嚇/.test(data.text)?'worried':/開心|笑|太好了|謝謝/.test(data.text)?'happy':'calm';music.set('story')}
  else if(ev==='move'){face.classList.add('moving');face.dataset.emo='happy';$('meter').classList.add('on');$('meterFill').style.width='0%';
    music.set(data.pace==='still'?'still':data.pace==='light'?'soft':data.pace==='fast'?'fast':'move')}
  else if(ev==='event'){music.set(data==='stop'?'still':'fast')}
  else if(ev==='progress'){$('meterFill').style.width=(Math.max(0,Math.min(1,data))*100).toFixed(1)+'%'}
  else if(ev==='level'){face.style.setProperty('--glow',Math.min(1,data/7).toFixed(2))}
  else if(ev==='moved'){face.classList.remove('moving');music.set('story')}
  else if(ev==='rest'){$('meter').classList.remove('on')}
  else if(ev==='choice'){$('forkL').textContent=data.left;$('forkR').textContent=data.right;show('fork',true);face.dataset.emo='calm';music.set('branch')}
  else if(ev==='chosen'){show('fork',false);music.set('story')}
  else if(ev==='paused'){$('pauseBtn').textContent=data?'繼續':'暫停';music.hold(!!data)}
  else if(ev==='end'){leaveStage();show('finale',true);window.scrollTo(0,0);
    $('endTitle').textContent='《'+data.story.title+'》';$('stat').textContent=data.moved?'你今天動了 '+fmtTime(data.moved)+'！':'';
    $('bye').textContent=(data.story.buddy&&data.story.buddy.name?data.story.buddy.name+'說：「明天見！」':'明天見！');remember(data.story,data.moved)}
  else if(ev==='error'){leaveStage();show('home',true);notice('故事沒有說成：'+data)}
}
function info(){$('sheetInfo').textContent=(band.connected?'手環已連線':demoOn?'沒有手環：示範小孩照著故事在動（按住上面的按鈕可以自己控制）':'沒有手環：用上面的按鈕代替')+'　·　'+(voiceMode==='fish'?'Fish 配音':'裝置聲音')+(source==='curated'?'　·　AI 這次沒寫成功，先說精選故事'+(current&&current.fail?'（'+Object.entries(current.fail).map(([k,v])=>k+'：'+v).join('；')+'）':''):source==='library'?'　·　故事庫':source==='ai'&&current?'　·　'+String(current.model||'').split('/').pop()+(current.seconds?'，'+current.seconds+' 秒':''):'')}
function leaveStage(){show('stage',false);show('sheet',false);simStop();releaseWake();cancelSpeech();music.set('off');music.hold(false)}
const engine=createEngine({speak,cancelSpeech,pauseSpeech,resumeSpeech,sfx,cmd,ui,prefetch,sleep,now:()=>performance.now(),cfg:{}});

/* 玩過的故事：只存編號和名稱，「再玩這篇」會向 Worker 拿回整篇（配音已經存好，不用再花額度） */
const PAST_KEY='sdq11-past';
function past(){try{return JSON.parse(localStorage.getItem(PAST_KEY)||'[]')}catch(e){return []}}
function remember(story,moved){try{const l=past().filter(x=>x.id!==story.id);l.unshift({id:story.id,title:story.title,moved:moved||0,t:Date.now()});localStorage.setItem(PAST_KEY,JSON.stringify(l.slice(0,10)))}catch(e){}renderPast()}
function renderPast(){const l=past(),ul=$('pastList');ul.replaceChildren();show('past',l.length>0);
  for(const s of l){const li=document.createElement('li'),a=document.createElement('span'),m=document.createElement('small'),b=document.createElement('button');
    a.textContent='《'+s.title+'》';m.textContent=s.moved?'動了 '+fmtTime(s.moved):'';b.type='button';b.textContent='再玩一次';b.dataset.id=s.id;li.append(a,m,b);ul.append(li)}}
$('pastList').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)begin(b.dataset.id)});

/* 螢幕不要自己鎖起來；切到別的 App 時故事暫停 */
let wake=null;
async function keepAwake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wake)wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if($('stage').hidden)return;if(document.hidden){engine.pause();show('resume',true)}else keepAwake()});
$('resumeBtn').onclick=()=>{audio();audioUnlock();show('resume',false);keepAwake();engine.resume()};

/* 沒有手環：按住按鈕（或空白鍵＝用力、S 鍵＝慢慢）代替 */
let simTimer=null,simLv=0,demoOn=false;
// 示範小孩：沒戴手環、也沒按按鈕的時候，照故事要的快慢「動」（只用聽的也聽得到整篇真正的樣子）
function demoLevel(){const A=engine.state.act,c=engine.cfg;if(!A)return 0;const ev=A.ev,j=Math.random()<.5?0:1;
  if(ev&&ev.state==='on')return ev.kind==='stop'?0:c.strongMin+2;
  if(A.pace==='fast')return c.strongMin+1+j;if(A.pace==='light')return Math.round((c.lightMin+c.lightMax)/2);if(A.pace==='still')return 0;return c.moveMin+j}
function simStart(){if(simTimer)return;simTimer=setInterval(()=>{const demo=demoOn&&!band.connected;show('demoTag',demo&&!$('stage').hidden);if(!band.connected)engine.signal('A:'+(simLv||(demo?demoLevel():0)))},250)}
function simStop(){clearInterval(simTimer);simTimer=null;simLv=0;show('demoTag',false)}
for(const [id,lv] of [['simSlow',3],['simFast',7]]){const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();simLv=lv});['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>{simLv=0}))}
document.addEventListener('keydown',e=>{if($('stage').hidden)return;
  if(e.code==='Space'){e.preventDefault();simLv=7}else if(e.key==='s'||e.key==='S')simLv=3;
  else if(e.key==='ArrowLeft')engine.signal('CHOICE_LEFT');else if(e.key==='ArrowRight')engine.signal('CHOICE_RIGHT');else if(e.key==='Enter')engine.skip()});
document.addEventListener('keyup',e=>{if(e.code==='Space'||e.key==='s'||e.key==='S')simLv=0});
$('ctlBtn').onclick=()=>{show('sheet',$('sheet').hidden);info()};
$('pauseBtn').onclick=()=>{if(engine.state.paused){audio();audioUnlock();engine.resume()}else engine.pause()};
$('skipBtn').onclick=()=>engine.skip();
$('quitBtn').onclick=()=>{engine.stop();leaveStage();show('home',true);notice('')};
$('fork').addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(b)engine.signal(b.dataset.choice==='left'?'CHOICE_LEFT':'CHOICE_RIGHT')});

/* 準備畫面 */
let ageValue='6',sensValue='mid';
function seg(id,attr,v){document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr]===v)))}
$('ages').addEventListener('click',e=>{const b=e.target.closest('[data-age]');if(b){ageValue=b.dataset.age;seg('ages','age',ageValue)}});
$('sens').addEventListener('click',e=>{const b=e.target.closest('[data-sens]');if(b){sensValue=b.dataset.sens;seg('sens','sens',sensValue)}});
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('idea').value=b.dataset.idea||'';$('idea').focus()});
$('connect').onclick=connectBand;
try{const s=JSON.parse(localStorage.getItem('sdq11')||'{}');if(/^[5-8]$/.test(String(s.age||''))){ageValue=String(s.age);seg('ages','age',ageValue)}if(SENS[s.sens]){sensValue=s.sens;seg('sens','sens',sensValue)}
  if(typeof s.fish==='boolean')$('fish').checked=s.fish;if(typeof s.music==='boolean')$('music').checked=s.music;if(typeof s.subs==='boolean')$('subs').checked=s.subs;$('demo').checked=s.demoOn===true;$('seated').checked=!!s.seated}catch(e){}
// 網址加 ?story=故事編號：直接播那一篇（例如精選故事 ?story=crow-demo-1）
const STORY_ID=(()=>{try{const v=new URLSearchParams(location.search).get('story');return /^[\w-]{3,60}$/.test(v||'')?v:''}catch(e){return ''}})();
if(STORY_ID){$('replayBanner').textContent='這次會播放故事庫裡的故事：'+STORY_ID;show('replayBanner',true)}
const WAIT_LINES=['故事正在路上，大概要等一分鐘喔。','我正在想一個只屬於你的冒險……','再等一下下，故事快寫好了！'];
async function begin(id){
  notice('');
  // 一定要在「按下按鈕」的當下做，手機才允許之後自動播放聲音
  audio();audioUnlock();try{player.src=silentWav();Promise.resolve(player.play()).catch(()=>{})}catch(e){}
  try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}
  keepAwake();
  voiceMode=$('fish').checked?'fish':'device';fishFails=0;voiceCache.clear();
  music.hold(false);music.setOn($('music').checked);subsOn=$('subs').checked;demoOn=$('demo').checked;
  const seated=$('seated').checked;
  Object.assign(engine.cfg,SENS[sensValue]||SENS.mid);
  try{localStorage.setItem('sdq11',JSON.stringify({age:ageValue,sens:sensValue,fish:$('fish').checked,music:$('music').checked,subs:subsOn,demoOn,seated}))}catch(e){}
  show('home',false);show('finale',false);show('stage',true);show('fork',false);show('sheet',false);show('resume',false);
  $('caption').style.visibility=subsOn?'visible':'hidden';$('title').textContent='';$('meter').classList.remove('on');
  face.classList.add('thinking');face.dataset.emo='calm';music.set('story');simStart();
  let story=null,waiting=true,n=0;
  (async()=>{await sleep(400);while(waiting&&!$('stage').hidden){$('caption').textContent=WAIT_LINES[n%WAIT_LINES.length];if(n<3)await speak(WAIT_LINES[n%WAIT_LINES.length]);n++;await sleep(12000)}})();
  try{story=await(id?api('/api/story/get',{id}):api('/api/story',{idea:$('idea').value.trim(),age:Number(ageValue),seated}))}
  catch(e){waiting=false;leaveStage();show('home',true);notice('故事沒有拿到：'+e.message);return}
  waiting=false;cancelSpeech();if($('stage').hidden)return;
  source=story.source||'';current=story;
  engine.start(story);
}
$('begin').onclick=()=>begin(STORY_ID||null);
$('again').onclick=()=>{if(current)begin(current.id)};
$('home2').onclick=()=>{show('finale',false);show('home',true);window.scrollTo(0,0)};
window.addEventListener('pagehide',()=>{cancelSpeech();cmd('PAUSE')});
bandUI();renderPast();
</script>
