<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聲動奇境・精簡版</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: "Noto Sans TC", system-ui, sans-serif;
    background: radial-gradient(circle at top, #2e1065 0%, #0f172a 100%);
    min-height: 100vh;
  }
  .card {
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(139, 92, 246, 0.35);
  }
  .pulse {
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(236, 72, 153, 0.1); }
    50% { box-shadow: 0 0 22px rgba(236, 72, 153, 0.35); }
  }
</style>
</head>
<body class="text-slate-100 p-4 md:p-8 flex flex-col items-center">

  <header class="w-full max-w-xl text-center mb-6">
    <p class="text-amber-300 text-sm mb-2">精簡版・雲端語音</p>
    <h1 class="text-3xl md:text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300">
      聲動奇境
    </h1>
    <p class="text-slate-400 text-sm mt-2">沙漠送點心</p>
    <p id="voiceMode" class="text-xs text-cyan-300/80 mt-2">語音：準備中…</p>
  </header>

  <main class="w-full max-w-xl space-y-4">

    <section class="card rounded-3xl p-5">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="text-xs text-slate-400">進度</div>
          <div id="progressText" class="font-bold text-lg text-purple-200">尚未開始</div>
        </div>
        <div id="bleStatus" class="text-xs text-slate-400 text-right">藍牙：未連線<br><span class="text-slate-500">可先用按鈕玩</span></div>
      </div>
      <button id="btnConnect" class="mt-3 w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2.5 rounded-xl text-sm">
        連接故事裝置（可略過）
      </button>
    </section>

    <section class="card rounded-3xl p-6 min-h-[220px]">
      <div id="storyBox" class="text-lg leading-relaxed text-slate-200">
        按「開始故事」，我們陪小繪把點心送到綠洲。
      </div>
      <div id="actionBox" class="hidden mt-5 p-4 rounded-2xl bg-pink-950/50 border border-pink-500/40 pulse">
        <div class="text-pink-300 font-bold text-base" id="actionText">—</div>
      </div>
    </section>

    <section class="space-y-3">
      <button id="btnStart" class="w-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 font-black py-4 rounded-2xl text-lg">
        開始故事
      </button>
      <button id="btnDoAction" disabled class="w-full bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-slate-950 font-bold py-3.5 rounded-2xl">
        我做好了
      </button>
      <button id="btnReplay" disabled class="w-full bg-slate-800 hover:bg-slate-700 disabled:opacity-40 border border-slate-600 font-bold py-3 rounded-2xl">
        再聽一次
      </button>
    </section>
  </main>

<script>
const WORKER_URL = "https://lucky-waterfall-f8a2.shopcom2009.workers.dev";

const STORY = [
  {
    type: "narrate",
    text: "在金色的沙漠裡，小繪捧著一盒香噴噴的點心。她說：我們把點心送到綠洲，好不好？"
  },
  {
    type: "action",
    action: "RUN",
    speak: "風把腳印吹淡了。前面有一隻小龜往綠洲爬。我們跟著牠，原地踏一踏步。",
    hint: "原地踏步一下下",
    after: "小龜帶著你們往前，遠處出現一點綠色。"
  },
  {
    type: "action",
    action: "SWIPE_LEFT",
    speak: "沙草擋住了路標。小繪說：我們把草撥開。",
    hint: "手往左揮兩下",
    after: "路標上的水滴圖案露出來了。綠洲在這個方向。"
  },
  {
    type: "action",
    action: "JUMP",
    speak: "前面有兩道矮沙丘。小繪說：我們輕輕跳過去。",
    hint: "輕輕跳兩下",
    after: "跳過沙丘，綠洲的遮陽棚就在眼前。點心送到了！"
  },
  {
    type: "narrate",
    text: "小繪打開點心盒，笑著說：謝謝你陪我走這一段。故事結束了。"
  }
];

const BLE = {
  serviceUuid: "4fa8691a-136d-4560-84ed-01354051b785",
  characteristicUuid: "beb5483e-36e1-4688-b7f5-ea07361b26a8"
};

let stepIndex = -1;
let waitingAction = null;
let busy = false;
let lastSpoken = "";
let currentAudio = null;
let objectUrl = null;

const $ = (id) => document.getElementById(id);

function setVoiceMode(text) {
  $("voiceMode").textContent = "語音：" + text;
}

function stopSpeak() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = "";
    currentAudio = null;
  }
  if (objectUrl) {
    URL.revokeObjectURL(objectUrl);
    objectUrl = null;
  }
}

async function speakBrowser(text) {
  if (!("speechSynthesis" in window)) return;
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-TW";
    u.rate = 1;
    const voices = window.speechSynthesis.getVoices() || [];
    const zh = voices.find(v => /zh-TW/i.test(v.lang)) || voices.find(v => /zh/i.test(v.lang));
    if (zh) u.voice = zh;
    u.onend = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

async function speakCloud(text) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch(WORKER_URL.replace(/\/+$/, "") + "/tts-cloudflare", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
      signal: controller.signal
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "雲端語音失敗");
    }
    const type = res.headers.get("Content-Type") || "";
    if (!type.startsWith("audio/")) throw new Error("回傳不是音檔");
    const blob = await res.blob();
    if (!blob.size) throw new Error("音檔是空的");
    stopSpeak();
    objectUrl = URL.createObjectURL(blob);
    const audio = new Audio(objectUrl);
    currentAudio = audio;
    await audio.play();
    await new Promise((resolve) => {
      audio.onended = resolve;
      audio.onerror = resolve;
    });
  } finally {
    clearTimeout(timer);
  }
}

async function speak(text) {
  if (!text) return;
  lastSpoken = text;
  stopSpeak();
  try {
    setVoiceMode("雲端合成中…");
    await speakCloud(text);
    setVoiceMode("雲端語音");
  } catch (e) {
    console.warn("cloud tts failed", e);
    setVoiceMode("裝置備援語音");
    await speakBrowser(text);
  }
}

function setProgress() {
  $("progressText").textContent = stepIndex < 0 ? "尚未開始" : "第 " + (stepIndex + 1) + " / " + STORY.length + " 段";
}

async function playStep() {
  if (busy) return;
  if (stepIndex >= STORY.length) {
    $("storyBox").textContent = "故事結束了。想再聽，按開始故事。";
    $("actionBox").classList.add("hidden");
    $("btnDoAction").disabled = true;
    waitingAction = null;
    return;
  }

  const step = STORY[stepIndex];
  busy = true;
  $("btnDoAction").disabled = true;
  $("btnReplay").disabled = true;
  $("actionBox").classList.add("hidden");
  waitingAction = null;
  setProgress();

  try {
    if (step.type === "narrate") {
      $("storyBox").textContent = step.text;
      await speak(step.text);
      stepIndex += 1;
      busy = false;
      await playStep();
      return;
    }

    $("storyBox").textContent = step.speak;
    $("actionText").textContent = step.hint;
    $("actionBox").classList.remove("hidden");
    await speak(step.speak);

    waitingAction = step.action;
    $("btnDoAction").disabled = false;
    $("btnReplay").disabled = false;
  } finally {
    busy = false;
  }
}

async function completeAction(from) {
  if (!waitingAction || busy) return;
  const step = STORY[stepIndex];
  if (!step || step.type !== "action") return;
  if (from && from !== step.action) return;

  busy = true;
  waitingAction = null;
  $("btnDoAction").disabled = true;
  stopSpeak();

  $("storyBox").textContent = step.after;
  $("actionBox").classList.add("hidden");
  await speak(step.after);

  stepIndex += 1;
  busy = false;
  await playStep();
}

$("btnStart").addEventListener("click", async () => {
  stopSpeak();
  stepIndex = 0;
  $("btnStart").textContent = "再聽一次";
  await playStep();
});

$("btnDoAction").addEventListener("click", () => completeAction(waitingAction));
$("btnReplay").addEventListener("click", async () => {
  if (lastSpoken && !busy) await speak(lastSpoken);
});

$("btnConnect").addEventListener("click", async () => {
  if (!navigator.bluetooth) {
    $("bleStatus").innerHTML = "藍牙：不支援<br><span class='text-slate-500'>用按鈕玩即可</span>";
    return;
  }
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [BLE.serviceUuid]
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(BLE.serviceUuid);
    const ch = await service.getCharacteristic(BLE.characteristicUuid);
    await ch.startNotifications();
    ch.addEventListener("characteristicvaluechanged", (e) => {
      const v = new TextDecoder().decode(e.target.value).trim().toUpperCase();
      if (waitingAction && v === waitingAction) completeAction(v);
    });
    $("bleStatus").innerHTML = "藍牙：已連線";
  } catch (e) {
    $("bleStatus").innerHTML = "藍牙：未連線<br><span class='text-slate-500'>用按鈕玩即可</span>";
  }
});

setVoiceMode("雲端優先，失敗用裝置");
</script>
</body>
</html>
