<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D24">
<title>聲動奇境｜關燈，開始說故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;800&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --dusk:#2B2A5C; --plum:#5A3F8E; --peach:#FFB48A; --cream:#FFF7E6; --paper-line:#EBDDBF;
  --moon:#FFD86B; --mint:#8FE8CC; --berry:#FF7E96; --ink:#2B2A5C; --soft:#6E6C92;
  --story:"Huninn","Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --round:"Chiron GoRound TC","Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --ui:"Chiron GoRound TC","Huninn",system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--ui);font-weight:500;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}

/* ── 夥伴的臉：兩顆會眨、會變表情的眼睛。準備畫面的小機器人和故事畫面的大臉共用 ── */
.face{position:relative;--glow:0}
.face .eye{position:absolute;top:.5em;width:1.5em;height:1.9em;border-radius:.62em;background:var(--moon);border:.3em solid transparent;
  box-shadow:0 0 calc(.5em + 1.1em*var(--glow)) rgba(255,216,107,calc(.35 + .5*var(--glow)));
  transition:width .3s,height .3s,top .3s,border-radius .3s,transform .3s,background-color .3s;animation:blink 5.2s infinite}
.face .eye.l{left:.5em}.face .eye.r{right:.5em;animation-delay:.06s}
@keyframes blink{0%,93%,100%{scale:1 1}96%{scale:1 .12}}
.face[data-emo=happy] .eye,.face[data-emo=proud] .eye{width:1.75em;height:1.7em;top:.8em;border-radius:50%;background:transparent;border-top-color:var(--moon);box-shadow:none;animation:none}
.face[data-emo=proud] .eye{transform:translateY(-.12em) scale(1.08)}
.face[data-emo=excited] .eye{width:1.7em;height:1.9em;top:.45em;border-radius:50%}
.face[data-emo=surprised] .eye{width:1.75em;height:1.75em;top:.55em;border-radius:50%;animation:none}
.face[data-emo=worried] .eye{height:1.6em;top:.7em}
.face[data-emo=worried] .eye.l{transform:rotate(14deg)}.face[data-emo=worried] .eye.r{transform:rotate(-14deg)}
.face[data-emo=sad] .eye{height:1.3em;top:.95em;border-radius:.5em .5em .7em .7em}
.face[data-emo=sad] .eye.l{transform:rotate(-16deg)}.face[data-emo=sad] .eye.r{transform:rotate(16deg)}
.face[data-emo=calm] .eye{height:1em;top:1.1em;border-radius:.45em}
.face[data-emo=scared] .eye{width:1.1em;height:1.1em;top:.9em;border-radius:50%;animation:shiver .22s infinite}
.face[data-emo=scared] .eye.l{left:.8em}.face[data-emo=scared] .eye.r{right:.8em}
@keyframes shiver{0%,100%{transform:translateX(-.03em)}50%{transform:translateX(.03em)}}
.face.thinking .eye{animation:look 2.6s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(-.22em)}50%{transform:translateX(.22em)}}
.face.moving{animation:hop .5s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-.22em)}}

/* ── 準備畫面：黃昏的天空，下面是一張米色的紙 ── */
.sky{position:relative;height:292px;overflow:hidden;color:#FFF7E6;
  background:linear-gradient(180deg,#2B2A5C 0%,#4A3A86 38%,#8A4F96 66%,#F09E82 90%,#FFC59A 100%)}
.sky .star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#FFF3C4;opacity:.85;animation:twinkle 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes twinkle{0%,100%{opacity:.85}50%{opacity:.25}}
.sky .crescent{position:absolute;right:30px;top:calc(26px + env(safe-area-inset-top));width:54px;height:54px;border-radius:50%;box-shadow:-13px 8px 0 0 var(--moon);transform:rotate(-18deg)}
.sky .hills{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:112px;display:block}
.titles{position:relative;max-width:560px;margin:0 auto;padding:calc(34px + env(safe-area-inset-top)) 24px 0}
.mark{font-family:var(--story);font-weight:700;font-size:2.9rem;letter-spacing:.08em;margin:0;line-height:1.15;text-shadow:0 3px 0 rgba(27,24,66,.35)}
.lede{font-family:var(--story);font-size:1.18rem;margin:8px 0 0;color:#FFE9C9}
.buddy{position:absolute;right:max(26px,calc(50% - 250px));bottom:20px;width:104px;height:84px;border-radius:30px 30px 26px 26px;background:#211F4D;border:4px solid #FFF7E6;font-size:22px;animation:peek 4.5s ease-in-out infinite}
.buddy::before{content:"";position:absolute;left:50%;top:-20px;width:4px;height:18px;margin-left:-2px;background:#FFF7E6;border-radius:2px}
.buddy::after{content:"";position:absolute;left:50%;top:-30px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--berry)}
@keyframes peek{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}

#setup main{max-width:560px;margin:0 auto;padding:6px 22px calc(44px + env(safe-area-inset-bottom))}
.ask{font-family:var(--story);font-weight:700;font-size:1.5rem;margin:0 0 10px;display:block}
#idea{display:block;width:100%;min-height:100px;resize:none;border:3px solid #FFD3DC;border-radius:26px;padding:16px 20px;background:#fff;
  font-family:var(--story);font-size:1.4rem;line-height:1.6;color:var(--ink);box-shadow:0 5px 0 #FFD3DC;transition:border-color .15s,box-shadow .15s}
#idea::placeholder{color:#B5AA90}
#idea:focus{border-color:var(--berry);box-shadow:0 5px 0 var(--berry);outline:none}
.ideas{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 30px;padding:0;list-style:none}
.ideas button{font-family:var(--story);font-size:1.04rem;line-height:1.4;padding:8px 14px;border-radius:999px;background:#fff;border:2px solid var(--paper-line);box-shadow:0 3px 0 var(--paper-line);transition:transform .12s,box-shadow .12s}
.ideas li:nth-child(4n+1) button{background:#FFE7EC;border-color:#FFC6D1;box-shadow:0 3px 0 #FFC6D1}
.ideas li:nth-child(4n+2) button{background:#E2F8F0;border-color:#B6EBD9;box-shadow:0 3px 0 #B6EBD9}
.ideas li:nth-child(4n+3) button{background:#FFF1CC;border-color:#F6DC94;box-shadow:0 3px 0 #F6DC94}
.ideas li:nth-child(4n+4) button{background:#EAE6FF;border-color:#CEC6F7;box-shadow:0 3px 0 #CEC6F7}
.ideas button:active{transform:translateY(3px);box-shadow:none}

.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:2px dashed var(--paper-line)}
.field>span:first-child{font-family:var(--story);font-size:1.16rem;font-weight:700}
.ages{display:flex;gap:8px}
.ages button{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--paper-line);font-family:var(--story);font-weight:700;font-size:1.25rem}
.ages button[aria-pressed=true]{background:var(--berry);border-color:var(--berry);color:#fff;transform:scale(1.08)}
.band{border-bottom:2px dashed var(--paper-line);margin-bottom:26px}
.band small{display:block;font-family:var(--ui);font-weight:400;font-size:.82rem;color:var(--soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#D9CDB0;margin-right:7px}
.dot.on{background:#39C99B;box-shadow:0 0 0 4px #D2F5E8}
.ghost{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 16px;min-height:48px;white-space:nowrap;font-weight:600;box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.ghost:active{transform:translateY(3px);box-shadow:none}

/* 最大的按鈕本身就是「夜晚」：按下去，燈就關了 */
#begin{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:72px;border-radius:24px;
  background:var(--dusk);color:var(--moon);font-family:var(--story);font-weight:700;font-size:1.5rem;letter-spacing:.05em;
  box-shadow:0 6px 0 #17163A,0 14px 26px rgba(43,42,92,.28);transition:transform .12s,box-shadow .12s}
#begin::before{content:"";width:26px;height:26px;border-radius:50%;box-shadow:-7px 4px 0 0 var(--moon);transform:rotate(-18deg) translate(4px,-4px)}
#begin:active{transform:translateY(5px);box-shadow:0 1px 0 #17163A}
#notice{min-height:1.7em;margin:14px 0 0;color:#C2334F;font-size:.95rem;font-weight:600}

.how{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:how}
.how li{counter-increment:how;position:relative;background:#fff;border:2px solid var(--paper-line);border-radius:18px;padding:30px 10px 12px;text-align:center;font-family:var(--story);font-size:1rem;line-height:1.45}
.how li::before{content:counter(how);text-align:center;position:absolute;left:50%;top:-14px;margin-left:-15px;width:30px;height:30px;line-height:30px;border-radius:50%;background:var(--moon);font-weight:700;font-family:var(--ui);font-size:.95rem}
.past{margin-top:28px}
.past h2,.grown summary{font-family:var(--story);font-size:1.16rem;font-weight:700;margin:0 0 8px}
.past ul{list-style:none;margin:0;padding:0}
.past li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:2px dashed var(--paper-line);font-family:var(--story);font-size:1.06rem}
.past li span:last-child{font-family:var(--ui);font-size:.8rem;color:var(--soft);white-space:nowrap}
.grown{margin-top:26px;background:#fff;border:2px solid var(--paper-line);border-radius:22px;padding:4px 18px}
.grown summary{cursor:pointer;margin:0;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
.grown summary::-webkit-details-marker{display:none}
.grown summary::after{content:"＋";color:var(--berry);font-size:1.3rem;line-height:1}
.grown[open] summary::after{content:"－"}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:2px dashed var(--paper-line)}
.sw b{display:block;font-family:var(--round);font-weight:800;font-size:1.06rem}
.sw small{display:block;color:var(--soft);font-size:.84rem;line-height:1.5}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:56px;height:32px;margin:0;border-radius:999px;background:#E8DEC6;position:relative;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(43,42,92,.25);transition:transform .2s}
.sw input:checked{background:var(--berry)}
.sw input:checked::after{transform:translateX(24px)}
.seg{display:flex;gap:6px;flex:none}
.seg button{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--paper-line)}
.seg button[aria-pressed=true]{background:var(--berry);border-color:var(--berry);color:#fff}
.grown p{font-family:var(--story);font-size:.95rem;color:var(--soft);margin:0;padding:14px 0;border-top:2px dashed var(--paper-line)}
.grown a{color:var(--ink)}

/* ── 故事畫面：燈關掉，只剩夥伴的眼睛 ── */
#stage{position:fixed;inset:0;background:#000;color:#CFC8B4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);touch-action:manipulation;user-select:none;-webkit-user-select:none;animation:lightsOff 1.1s ease-out both}
@keyframes lightsOff{from{background:#3A3272;opacity:0}to{background:#000;opacity:1}}
#face{width:5.2em;height:3.4em;font-size:34px;margin-top:-70px;opacity:.9}
#smile{width:150px;height:44px;margin-top:8px;overflow:visible}
#smile path{fill:none;stroke-width:5;stroke-linecap:round}
#smile .track{stroke:#26233F}
#smileFill{stroke:var(--moon);stroke-dasharray:100;stroke-dashoffset:100;opacity:0;transition:stroke-dashoffset .25s linear,opacity .2s}
#caption{width:100%;max-width:520px;min-height:5.4em;text-align:center;font-family:var(--story);font-size:1.22rem;line-height:1.8;color:#D9D1BA;margin:22px 0 0}
#fork{width:100%;max-width:520px;display:flex;gap:12px;justify-content:center;margin-top:26px}
#fork button{flex:1;min-height:84px;border:2px solid #4A4670;border-radius:20px;background:#12112A;font-family:var(--story);font-size:1.16rem;color:#E9E1C8;padding:10px;line-height:1.4}
#fork small{display:block;font-family:var(--ui);font-size:.74rem;color:#8480A8;margin-top:2px}
#hush{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;color:#55526F;font-size:.82rem;margin:0}
#sheet{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#1B1A3D;border:2px solid #3A3870;border-radius:22px;padding:14px;color:#EDE6D0}
#sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheet button{border:2px solid #3A3870;border-radius:14px;min-height:50px;padding:8px;background:#232150}
#sheet button.hold{grid-column:1/-1;background:#2E2B6B;border-color:#57539E}
#sheet p{margin:10px 2px 0;color:#9C98C4;font-size:.78rem}
#resume{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center}
#resume button{font-family:var(--story);font-weight:700;font-size:1.4rem;color:#2B2A5C;background:var(--moon);border-radius:22px;padding:18px 30px}

/* ── 結束畫面：天亮了 ── */
#finale{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;color:#FFF7E6;
  background:linear-gradient(180deg,#2B2A5C 0%,#6A4594 42%,#F09E82 80%,#FFD9A8 100%);animation:dawn 1.4s ease-out both}
@keyframes dawn{from{opacity:0}to{opacity:1}}
#finale .face{width:5.2em;height:3.2em;font-size:30px}
#finale h2{font-family:var(--story);font-size:2.4rem;margin:8px 0 2px;text-shadow:0 3px 0 rgba(27,24,66,.35)}
#finale .title{font-family:var(--story);font-size:1.2rem;margin:0 0 4px;color:#FFE9C9}
#bye{font-family:var(--story);font-size:1.5rem;margin:0 0 22px}
#stat{display:inline-block;background:rgba(255,247,230,.92);color:var(--ink);font-family:var(--story);font-size:1.08rem;border-radius:999px;padding:8px 18px;margin:0 0 26px}
#stat:empty{display:none}
#again{background:var(--cream);color:var(--ink);border-radius:20px;min-height:60px;padding:12px 28px;font-family:var(--story);font-weight:700;font-size:1.25rem;box-shadow:0 5px 0 #D9B98E}
#again:active{transform:translateY(5px);box-shadow:none}

.mark,.ask,.field>span:first-child,.ages button,.seg button,#begin,.ghost,.past h2,.grown summary,#resume button,#again,#finale h2,.how li::before{font-family:var(--round);font-weight:800}

/* ── RGB 電競燈：慢慢流動的彩虹，不閃爍 ── */
:root{--rgb:linear-gradient(90deg,#FF2D55,#FF9F0A,#FFE60A,#30D158,#00E5FF,#3D5AFE,#BF5AF2,#FF2D55)}
@keyframes rgbflow{from{background-position:0% 50%}to{background-position:300% 50%}}
@keyframes rgbborder{from{background-position:0 0,0% 50%}to{background-position:0 0,300% 50%}}
@keyframes rgbspin{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
@keyframes rgbedge{0%,100%{border-color:#FF2D55}17%{border-color:#FF9F0A}33%{border-color:#30D158}50%{border-color:#00E5FF}67%{border-color:#3D5AFE}83%{border-color:#BF5AF2}}
@keyframes rgbfill{0%,100%{background-color:#FF2D55}17%{background-color:#FF9F0A}33%{background-color:#30D158}50%{background-color:#00E5FF}67%{background-color:#3D5AFE}83%{background-color:#BF5AF2}}
@keyframes rgbglow{0%,100%{box-shadow:0 6px 0 #17163A,0 0 26px rgba(255,45,85,.7)}17%{box-shadow:0 6px 0 #17163A,0 0 26px rgba(255,159,10,.7)}33%{box-shadow:0 6px 0 #17163A,0 0 26px rgba(48,209,88,.7)}50%{box-shadow:0 6px 0 #17163A,0 0 26px rgba(0,229,255,.7)}67%{box-shadow:0 6px 0 #17163A,0 0 26px rgba(61,90,254,.75)}83%{box-shadow:0 6px 0 #17163A,0 0 26px rgba(191,90,242,.7)}}
/* 彩虹字：標題、結束畫面 */
.mark,#finale h2{background:var(--rgb);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 3px 0 rgba(20,18,50,.45));animation:rgbflow 8s linear infinite}
/* 開始按鈕：彩虹邊框＋會換顏色的光暈 */
#begin{border:3px solid transparent;background:linear-gradient(var(--dusk),var(--dusk)) padding-box,var(--rgb) border-box;background-size:100% 100%,300% 100%;
  animation:rgbborder 6s linear infinite,rgbglow 6s linear infinite}
/* 小機器人：外框和天線燈跟著變色 */
.buddy{animation:peek 4.5s ease-in-out infinite,rgbedge 6s linear infinite}
.buddy::after{animation:rgbfill 6s linear infinite;box-shadow:0 0 10px rgba(255,255,255,.6)}
/* 選到的按鈕和打開的開關：彩虹流動 */
.ages button[aria-pressed=true],.seg button[aria-pressed=true],.sw input:checked{background:var(--rgb);background-size:300% 100%;border-color:transparent;animation:rgbflow 6s linear infinite}
.ages button[aria-pressed=true],.seg button[aria-pressed=true]{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
#idea:focus{animation:rgbedge 5s linear infinite}
/* 故事畫面：夥伴的眼睛和笑容慢慢換顏色 */
#face{animation:rgbspin 12s linear infinite}
#face.moving{animation:hop .5s ease-in-out infinite,rgbspin 12s linear infinite}
#smile{animation:rgbspin 12s linear infinite}
#fork button{animation:rgbedge 6s linear infinite}
#finale .face{animation:rgbspin 12s linear infinite}
#finale h2{filter:drop-shadow(0 3px 0 rgba(20,18,50,.6)) drop-shadow(0 0 3px rgba(20,18,50,.45))}

/* ── 深色電競主題：取代原本的米色，讓 RGB 燈光更亮 ── */
:root{--cream:#0E0D24;--ink:#F2EEFF;--soft:#A7A2D2;--paper-line:#2E2B5C;--card:#17153A;--card-2:#1F1C4A}
body{background:#0E0D24 radial-gradient(circle at 12% 30%,rgba(191,90,242,.16),transparent 38%) fixed,
  radial-gradient(circle at 90% 75%,rgba(0,229,255,.10),transparent 40%) fixed;background-color:#0E0D24}
#idea{background:var(--card);border-color:#3A3670;box-shadow:0 5px 0 #3A3670;color:var(--ink)}
#idea::placeholder{color:#6E69A0}
#idea:focus{box-shadow:0 5px 0 #3A3670,0 0 18px rgba(0,229,255,.25)}
.ideas button{background:var(--card)!important;color:var(--ink)}
.ideas li:nth-child(4n+1) button{border-color:#FF2D55!important;box-shadow:0 3px 0 #FF2D55,0 0 12px rgba(255,45,85,.3)!important}
.ideas li:nth-child(4n+2) button{border-color:#30D158!important;box-shadow:0 3px 0 #30D158,0 0 12px rgba(48,209,88,.3)!important}
.ideas li:nth-child(4n+3) button{border-color:#FFE60A!important;box-shadow:0 3px 0 #FFE60A,0 0 12px rgba(255,230,10,.25)!important}
.ideas li:nth-child(4n+4) button{border-color:#BF5AF2!important;box-shadow:0 3px 0 #BF5AF2,0 0 12px rgba(191,90,242,.3)!important}
.ideas button:active{box-shadow:none!important}
.ages button,.seg button{background:var(--card);border-color:#3A3670;color:var(--ink)}
.ghost{background:var(--card);border-color:#00E5FF;color:var(--ink);box-shadow:0 3px 0 #00A8BD,0 0 12px rgba(0,229,255,.25)}
.how li,.grown{background:var(--card);border-color:#2E2B5C}
.how li::before{color:#1B1940}
.sw input{background:#3A3670}
#notice{color:#FF6B86}
/* 結束畫面：夜空，彩虹字 */
#finale{background:radial-gradient(circle at 50% 30%,#2A2066 0,#0E0D24 70%);color:var(--ink)}
#finale .title{color:#C9C3F2}
#stat{background:var(--card-2);color:var(--ink);border:2px solid #3A3670}
#again{background:var(--card);color:var(--ink);border:3px solid transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,var(--rgb) border-box;background-size:100% 100%,300% 100%;
  animation:rgbborder 6s linear infinite;box-shadow:0 0 18px rgba(0,229,255,.25)}
#again:active{transform:translateY(3px)}
@media (max-width:400px){.mark{font-size:2.5rem}.how{grid-template-columns:1fr}.how li{padding:14px 12px 12px 52px;text-align:left}.how li::before{left:12px;top:50%;margin:-15px 0 0}.ages button{width:44px;height:44px}}
@media (min-width:700px){.sky{height:330px}.mark{font-size:3.4rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="setup">
  <header class="sky">
    <i class="star" style="--x:9%;--y:16%;--s:4px"></i><i class="star" style="--x:24%;--y:52%;--s:3px;--d:.8s"></i><i class="star" style="--x:41%;--y:11%;--s:3px;--d:1.6s"></i>
    <i class="star" style="--x:58%;--y:34%;--s:4px;--d:.4s"></i><i class="star" style="--x:71%;--y:58%;--s:3px;--d:2.1s"></i><i class="star" style="--x:88%;--y:44%;--s:3px;--d:1.1s"></i>
    <i class="star" style="--x:15%;--y:70%;--s:3px;--d:2.6s"></i><i class="star" style="--x:50%;--y:62%;--s:2px;--d:1.9s"></i>
    <div class="crescent" aria-hidden="true"></div>
    <div class="titles">
      <h1 class="mark">聲動奇境</h1>
      <p class="lede">放下手機，跟故事一起動起來。</p>
    </div>
    <svg class="hills" viewBox="0 0 400 112" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 62 Q70 18 150 54 T300 44 T400 30 V112 H0Z" fill="#3B3276"/>
      <path d="M0 92 Q90 50 190 84 T400 66 V112 H0Z" fill="#0E0D24"/>
    </svg>
    <div class="buddy face" data-emo="happy" id="buddy" aria-hidden="true"><i class="eye l"></i><i class="eye r"></i></div>
  </header>

  <main>
    <label class="ask" for="idea">今天想聽什麼故事？</label>
    <textarea id="idea" maxlength="110" placeholder="例如：怕水的恐龍去海邊"></textarea>
    <ul class="ideas" id="ideas" aria-label="點一個當作靈感">
      <li><button type="button" data-idea="會打嗝的企鵝找回家的路">🐧 會打嗝的企鵝</button></li>
      <li><button type="button" data-idea="月亮上的麵包店少了一顆星星">🥐 月亮上的麵包店</button></li>
      <li><button type="button" data-idea="不敢睡覺的小貓頭鷹">🦉 不敢睡覺的貓頭鷹</button></li>
      <li><button type="button" data-idea="">🎲 讓故事自己決定</button></li>
    </ul>

    <div class="field">
      <span>孩子幾歲</span>
      <div class="ages" id="ages" role="group" aria-label="孩子幾歲">
        <button type="button" data-age="5" aria-pressed="false">5</button><button type="button" data-age="6" aria-pressed="true">6</button>
        <button type="button" data-age="7" aria-pressed="false">7</button><button type="button" data-age="8" aria-pressed="false">8</button>
      </div>
    </div>
    <div class="field band">
      <span><span id="bandState"><i class="dot"></i>手環還沒連上</span><small>沒有手環也可以用畫面上的按鈕玩</small></span>
      <button type="button" class="ghost" id="connect">連接手環</button>
    </div>

    <button type="button" id="begin">關燈，開始說故事</button>
    <p id="notice" role="status" aria-live="polite"></p>

    <ol class="how" aria-label="怎麼玩">
      <li>說出想聽的故事</li>
      <li>把手機放下，聽夥伴說</li>
      <li>夥伴動，你也跟著動</li>
    </ol>

    <section class="past" id="past" hidden>
      <h2>聽過的故事</h2>
      <ul id="pastList"></ul>
    </section>

    <details class="grown">
      <summary>更多設定</summary>
      <label class="sw"><span><b>坐著玩</b><small>故事不會出現跑和跳</small></span><input type="checkbox" id="seated"></label>
      <label class="sw"><span><b>顯示字幕</b><small>讓旁邊的人看到故事在說什麼</small></span><input type="checkbox" id="subs"></label>
      <label class="sw"><span><b>用 Fish 配音</b><small>聲音比較好聽，但要等久一點</small></span><input type="checkbox" id="fish"></label>
      <div class="sw"><span><b>手環靈敏度</b><small>孩子動了卻沒反應，就調高</small></span>
        <div class="seg" id="sensSeg" role="group" aria-label="手環靈敏度"><button type="button" data-sens="low" aria-pressed="false">低</button><button type="button" data-sens="mid" aria-pressed="true">中</button><button type="button" data-sens="high" aria-pressed="false">高</button></div>
      </div>
      <p>沒有手環？故事開始後長按畫面，會出現代替手環的按鈕。長輩的坐姿活動在<a href="./">原本的頁面</a>。</p>
    </details>
  </main>
</div>

<section id="stage" hidden aria-label="故事進行中">
  <div class="face" id="face" data-emo="calm" aria-hidden="true"><i class="eye l"></i><i class="eye r"></i></div>
  <svg id="smile" viewBox="0 0 150 44" aria-hidden="true"><path class="track" d="M12 8 Q75 50 138 8"/><path id="smileFill" pathLength="100" d="M12 8 Q75 50 138 8"/></svg>
  <p id="caption" hidden></p>
  <div id="fork" hidden>
    <button type="button" data-choice="left"><span id="forkL"></span><small>◀ 左邊的按鈕</small></button>
    <button type="button" data-choice="right"><span id="forkR"></span><small>右邊的按鈕 ▶</small></button>
  </div>
  <p id="hush">故事進行中，可以把手機放下了。長按畫面可以暫停。</p>
  <div id="sheet" hidden>
    <div class="grid">
      <button type="button" id="pauseBtn">暫停故事</button>
      <button type="button" id="skipBtn">跳過這段動作</button>
      <button type="button" class="hold" id="simMove">按住＝在動（代替手環）</button>
      <button type="button" id="simJump">跳一下</button>
      <button type="button" id="quitBtn">結束故事</button>
    </div>
    <p id="sheetInfo"></p>
  </div>
  <div id="resume" hidden><button type="button" id="resumeBtn">點一下，故事繼續</button></div>
</section>

<section id="finale" hidden>
  <div class="face" data-emo="happy" aria-hidden="true"><i class="eye l"></i><i class="eye r"></i></div>
  <h2>故事說完了</h2>
  <p class="title" id="endTitle"></p>
  <p id="bye">明天見。</p>
  <p id="stat"></p>
  <button type="button" id="again">再聽一個故事</button>
</section>

<script>
'use strict';
/* ═════════ 設定 ═════════ */
const WORKER_URL='https://lucky-waterfall-f8a2.shopcom2009.workers.dev'; // 換 Worker 網址時只改這一行
const BLE={service:'4fa8691a-136d-4560-84ed-01354051b785',characteristic:'beb5483e-36e1-4688-b7f5-ea07361b26a8'};
// 門檻依 2026/11/14 手環實測：不動 0～1、輕擺 2～3、揮手 4～10、用力跑 7～10
// strong＝衝刺；any＝有在動；light＝輕輕的（太大力會 ≥ tooHard）；stillMax＝不動
const SENS={low:{bodyMin:4,armMin:3,stillMax:1,strongMin:6,moveMin:4,lightMin:1,lightMax:4,tooHard:7},
  mid:{bodyMin:3,armMin:2,stillMax:1,strongMin:5,moveMin:3,lightMin:1,lightMax:4,tooHard:6},
  high:{bodyMin:2,armMin:1,stillMax:1,strongMin:4,moveMin:2,lightMin:1,lightMax:3,tooHard:5}};

/* ENGINE-BEGIN —— 故事流程核心（不碰畫面、聲音、藍牙，全部由外面傳進來，方便測試） */
function createEngine(d){
  const cfg=Object.assign({bodyMin:3,armMin:2,stillMax:1,strongMin:5,moveMin:3,lightMin:1,lightMax:4,tooHard:6,
    tick:100,autoContinue:60,practiceAuto:14,reHint:20,prefetchBoth:true,seated:false,
    waitFirst:4,waitDemo:9,waitEvery:7,cueMin:2000,cueMax:4500,cueWindow:2500},d.cfg||{});
  const S={run:0,phase:'idle',paused:false,pauses:0,act:null,story:null,pending:{},choiceWaiter:null,practices:0,moved:0};
  const alive=r=>r===S.run;
  const CMD={body:'ACT:BODY',jump:'ACT:JUMP',arm:'ACT:ARM',still:'ACT:STILL',shake:'ACT:BODY',game:'ACT:BODY'};
  const P_HINT=a=>['跟我一起試試看！','跟我一起'+a+'！','沒關係，我們等一下再試。'];
  const PRACTICE=[
    {kind:'body',do:'原地跑步',lead:'跟我一起，在原地跑一跑！',beats:['跑、跑、跑！','好棒，再一下下！','哇，你跑得好快！'],sound:'step',demo:'swing',target:{type:'seconds',value:5}},
    {kind:'shake',do:'搖一搖',lead:'手一上一下，跟我一起搖一搖！',beats:['搖！','再搖！','搖得好棒！'],sound:'clap',demo:'shake',target:{type:'count',value:3}},
    {kind:'arm',do:'揮動雙手',lead:'把手舉起來，跟我一起揮一揮！',beats:['揮呀揮！','再大力一點！','揮得好漂亮！'],sound:'rustle',demo:'wave',target:{type:'seconds',value:4}},
    {kind:'still',do:'像木頭人一樣不動',lead:'現在變成木頭人，一動也不要動……',beats:['噓……','很好，繼續不動……','好厲害，你完全沒動！'],sound:'none',demo:'freeze',target:{type:'seconds',value:3}}
  ].map(m=>Object.assign(m,{hints:P_HINT(m.do),hintAt:[3,7,11]}));

  async function hold(r){while(alive(r)&&S.paused)await d.sleep(cfg.tick)}
  // 唸一段。聲音層支援暫停時，暫停後會從停下的那一句接著唸；不支援時才整段重唸
  async function say(r,text){
    text=String(text||'').trim();if(!text)return;
    while(alive(r)){await hold(r);if(!alive(r))return;const pc=S.pauses;d.ui('line',text);await d.speak(text);if(d.pauseSpeech||S.pauses===pc)return}
  }
  function makeQueue(r){
    const q=[];let busy=false;
    async function pump(){if(busy)return;busy=true;while(q.length&&alive(r))await say(r,q.shift());busy=false}
    return {push(t){if(t){q.push(t);pump()}},clear(){q.length=0},get idle(){return !busy&&!q.length},async drain(){while(busy&&alive(r))await d.sleep(cfg.tick)}};
  }

  // 一段動作：孩子動的時候旁白跟著進度往下講；沒動時提示一層一層變清楚；絕不卡死
  async function runMove(r,m,opt){
    opt=opt||{};
    const name=S.story?S.story.companion.name:'我';
    const A=S.act={kind:m.kind,sound:m.sound,value:0,target:m.target.value,lastProgress:0,lastPacket:0,skip:false,auto:false};
    d.ui('move',{move:m,practice:!!opt.practice});
    d.cmd(CMD[m.kind]);d.cmd('BUZZ');d.sfx('chime');d.robot('DEMO:'+m.demo);
    const q=makeQueue(r);q.push(m.lead);
    const said=[false,false];let leadDone=0,stage=0,hintClock=0,lastHint=0;
    const auto=(opt.practice?cfg.practiceAuto:cfg.autoContinue)*1000;
    while(alive(r)){
      await hold(r);if(!alive(r))return null;
      const now=d.now();
      if(!leadDone&&q.idle){leadDone=now;hintClock=now}
      const frac=A.value/A.target;
      d.ui('progress',Math.min(1,frac));
      if(A.skip||frac>=1)break;
      if(!said[0]&&frac>=1/3){said[0]=true;q.push(m.beats[0])}
      if(!said[1]&&frac>=2/3){said[1]=true;q.push(m.beats[1])}
      if(A.lastProgress>hintClock){hintClock=A.lastProgress;stage=0}          // 有在動 → 提示重新計時
      if(leadDone&&q.idle){
        const idle=(now-hintClock)/1000;
        if(stage<3&&idle>=m.hintAt[stage]){q.push(m.hints[stage]);d.robot(stage===2?'WAIT':'NUDGE');stage++;lastHint=now}
        else if(stage>=3&&now-lastHint>=cfg.reHint*1000){q.push(m.hints[1]);d.robot('NUDGE');lastHint=now}
        if(now-Math.max(A.lastProgress,leadDone)>=auto){A.auto=true;break}
      }
      await d.sleep(cfg.tick);
    }
    if(!alive(r))return null;
    S.act=null;d.cmd('PAUSE');q.clear();await q.drain();
    if(!alive(r))return null;
    d.ui('progress',1);
    if(!opt.practice)S.moved+=m.target.type==='count'?Math.round(Math.min(A.value,A.target)*1.5):Math.round(Math.min(A.value,A.target));
    if(A.auto){
      d.robot('WAIT');
      if(!opt.practice)await say(r,name+'牽起你的手：「沒關係，我們一起慢慢走過去。」');
    }else{d.robot('CHEER');d.sfx('cheer')}
    if(!(opt.practice&&A.auto))await say(r,m.beats[2]);
    d.ui('progress',0);d.ui('level',0);d.ui('rest');
    return {auto:A.auto,skipped:A.skip};
  }

  // v4 玩法：照 phases 判斷進度，進度旁白照「孩子做了多少」一句一句往下唸。
  // 孩子沒動時故事停著等，但一直有聲音（等待句 → 示範 → 輪流），不會自動跳過；大人可以按右鍵跳過。
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const LV={strong:l=>l>=cfg.strongMin,any:l=>l>=cfg.moveMin,light:l=>l>=cfg.lightMin&&l<=cfg.lightMax};
  const phaseSize=ph=>ph.mode==='count'?ph.n:ph.mode==='cue'?ph.rounds:ph.seconds;
  const phaseDemo=ph=>ph.mode==='still'?'freeze':(ph.mode==='count'||ph.mode==='cue')?'shake':ph.band==='light'?'wave':'swing';
  async function runGame(r,g){
    const A=S.act={kind:'game',sound:g.sound,level:0,levelAt:0,sCount:0,skip:false,lastProgress:0,lastPacket:0};
    d.ui('move',{move:g});d.cmd('ACT:BODY');d.cmd('BUZZ');d.sfx('chime');d.robot('DEMO:'+g.demo);
    const q=makeQueue(r);q.push(g.lead);
    while(alive(r)&&!q.idle&&!A.skip){await hold(r);await d.sleep(cfg.tick)}     // 先唸完「為什麼要動」
    if(!alive(r))return null;
    const total=g.phases.reduce((s,ph)=>s+phaseSize(ph),0);
    let pi=-1,ph=null,phDone=0,before=0,said=0,last=d.now(),idleSince=d.now(),stage=0,lastLine=0,wi=0,oopsAt=0,moved=0,cue=null,sMark=0,misses=0;
    const nextPhase=()=>{pi++;ph=g.phases[pi];phDone=0;cue=null;sMark=A.sCount;idleSince=d.now();stage=0;
      if(ph.mode==='cue')q.push(ph.hint);else if(ph.call)q.push(ph.call);      // 聽口令搖：開頭只說「等叮再搖」，「搖！」留到叮的時候
      d.robot('DEMO:'+phaseDemo(ph))};
    nextPhase();
    while(alive(r)){
      await hold(r);if(!alive(r))return null;
      const now=d.now(),dt=Math.min(0.3,(now-last)/1000);last=now;
      if(A.skip)break;
      const fresh=now-A.levelAt<800,lv=fresh?A.level:0;
      let progressed=false;
      if(ph.mode==='level'){
        if(LV[ph.band](lv)){phDone+=dt;moved+=dt;progressed=true}
        else if(ph.band==='light'&&lv>cfg.lightMax){                        // 要輕輕的卻太大力：進度倒退，不是亂動也能過
          phDone=Math.max(0,phDone-dt*1.5);progressed=true;
          if(now-oopsAt>4000&&q.idle){oopsAt=now;q.push(ph.oops||'輕一點，慢慢來……')}
        }
      }else if(ph.mode==='still'){
        if(fresh&&lv<=cfg.stillMax){phDone+=dt;progressed=true}
        else if(lv>=cfg.moveMin){                                             // 要停住卻明顯在動：這一次重來
          if(phDone>0.8&&now-oopsAt>4000&&q.idle){oopsAt=now;q.push(pick(['哎呀，動到了！我們再停一次。','噓……動了喔，再當一次木頭人。']))}
          phDone=0;
        }
      }else if(ph.mode==='count'){
        const c=A.sCount-sMark;if(c>phDone){moved+=(c-phDone)*0.8;phDone=c;progressed=true}
      }else if(ph.mode==='cue'){
        progressed=true;                                      // 等口令時本來就要停著，不算「沒動」
        const wait=()=>now+cfg.cueMin+Math.random()*(cfg.cueMax-cfg.cueMin);
        if(!cue){if(q.idle)cue={state:'arm',until:wait(),mark:A.sCount}}
        else if(cue.state==='arm'){
          if(A.sCount>cue.mark){cue.mark=A.sCount;cue.until=wait();if(now-oopsAt>3000&&q.idle){oopsAt=now;q.push(ph.early)}}
          else if(now>=cue.until){d.sfx('ding');d.robot('DEMO:shake');q.push(ph.call);cue={state:'go',until:now+cfg.cueWindow,mark:A.sCount}}
        }else if(A.sCount>cue.mark){phDone+=1;moved+=1;misses=0;d.sfx('cheer');cue=null}
        else if(now>=cue.until){misses++;cue=null;if(misses>=2){misses=0;q.push(ph.hint);d.robot('DEMO:shake')}else q.push('沒關係，再一次！')}
      }
      const frac=Math.min(1,(before+Math.min(phDone,phaseSize(ph)))/total);
      d.ui('progress',frac);
      while(said<g.steps.length-1&&frac>=(said+1)/g.steps.length){q.push(g.steps[said]);said++}
      if(phDone>=phaseSize(ph)){before+=phaseSize(ph);if(pi+1>=g.phases.length)break;nextPhase();continue}
      if(progressed){stage=0;idleSince=now}
      else if(q.idle){
        const idle=(now-idleSince)/1000;
        if(stage===0&&idle>=cfg.waitFirst){q.push(g.waits[wi++%g.waits.length]);d.robot('NUDGE');stage=1;lastLine=now}
        else if(stage===1&&idle>=cfg.waitDemo){q.push(ph.hint);d.robot('DEMO:'+phaseDemo(ph));stage=2;lastLine=now}
        else if(stage>=2&&now-lastLine>=cfg.waitEvery*1000){
          if(stage%2){q.push(ph.hint);d.robot('DEMO:'+phaseDemo(ph))}else{q.push(g.waits[wi++%g.waits.length]);d.sfx('wind')}
          stage++;lastLine=now}
      }
      await d.sleep(cfg.tick);
    }
    if(!alive(r))return null;
    S.act=null;d.cmd('PAUSE');q.clear();await q.drain();if(!alive(r))return null;
    d.ui('progress',1);S.moved+=Math.round(moved);
    d.robot('CHEER');d.sfx('cheer');
    await say(r,g.steps[g.steps.length-1]);
    d.ui('progress',0);d.ui('level',0);d.ui('rest');
    return {skipped:A.skip};
  }

  // 手環（或模擬按鈕）送來的訊號
  function signal(sig){
    const now=d.now(),A=S.act;
    if(sig==='CHOICE_LEFT'||sig==='CHOICE_RIGHT'){if(S.choiceWaiter&&!S.paused){const w=S.choiceWaiter;S.choiceWaiter=null;w(sig==='CHOICE_LEFT'?'left':'right')}return}
    if(sig==='START'){if(A)A.skip=true;return}                                // 大人可以按右鍵幫孩子跳過
    if(!A||S.paused)return;
    if(A.kind==='game'){                                                     // v4 玩法：只記下最新強度和搖的次數，判斷交給 runGame
      if(sig==='S'){A.sCount++;d.sfx(A.sound==='none'?'clap':A.sound);return}
      if(sig.length>2&&sig[0]==='A'&&sig[1]===':'){const lv=Number(sig.slice(2));if(Number.isFinite(lv)){A.level=lv;A.levelAt=now;d.ui('level',lv)}}
      return;
    }
    if(sig==='S'&&A.kind==='shake'){A.value+=1;A.lastProgress=now;d.sfx('clap');return}
    if(sig==='J'){if(A.kind==='jump'){A.value+=1;A.lastProgress=now;d.sfx(A.sound)}else if(A.kind==='body')d.sfx(A.sound);return}
    if(sig==='S'){if(A.kind==='body'||A.kind==='arm')d.sfx(A.sound);return}
    if(sig.length>2&&sig[0]==='A'&&sig[1]===':'){
      const lv=Number(sig.slice(2));if(!Number.isFinite(lv))return;
      const dt=A.lastPacket?Math.min(0.5,Math.max(0.05,(now-A.lastPacket)/1000)):0.25;A.lastPacket=now;d.ui('level',lv);
      if(A.kind==='body'){if(lv>=cfg.bodyMin){A.value+=dt;A.lastProgress=now}}
      else if(A.kind==='arm'){if(lv>=cfg.armMin){A.value+=dt;A.lastProgress=now}}
      else if(A.kind==='still'){if(lv<=cfg.stillMax){A.value+=dt;A.lastProgress=now}else if(lv>=cfg.bodyMin)A.value=Math.max(0,A.value-1)}
    }
  }

  // 等 AI 的時候不讓孩子空等：先唸一句，還沒好就一起做小練習
  async function waitWith(r,promise,line){
    let settled=false,val,err;promise.then(v=>{settled=true;val=v},e=>{settled=true;err=e});
    await d.sleep(300);
    if(!settled&&line)await say(r,line);

  function fetchHalf(c){const p=d.api(S.story&&S.story.api===4?'/api/v4/next':'/api/v3/next',{story:S.story,choice:c});p.catch(()=>{});return p}

  }
  async function askBranch(r){
    const b=S.story.branch,name=S.story.companion.name;

    let choice=null;new Promise(res=>{S.choiceWaiter=res}).then(c=>{choice=c});

  async function start(params){

      const data=await waitWith(r,d.api(cfg.api==='v3'?'/api/v3/start':'/api/v4/start',params),'故事正在路上。等它來的時候，我們先暖暖身！');
      if(!alive(r))return;
      S.story=data.story;S.phase='story';d.ui('story',data.story);
      const name=S.story.companion.name;
      if(cfg.prefetchBoth){S.pending.left=fetchHalf('left');S.pending.right=fetchHalf('right')}   // 孩子聽上半段時，兩條路都先準備好
      const w=data.warmup||{lines:[],steps:[],outro:''};

        if(!alive(r))return;

      }

      if(half&&half.scenes)await playScenes(r,half.scenes);
      else await say(r,name+'說：「今天的路先走到這裡。剩下的冒險，我們明天再繼續！」');
      if(!alive(r))return;
      d.robot('WAVE');
      await say(r,name+'跟你揮揮手：「今天謝謝你陪我冒險。明天見！」');
      if(!alive(r))return;
      S.phase='done';d.cmd('PAUSE');d.ui('end',{story:S.story,moved:S.moved});
    }catch(e){
      if(!alive(r))return;
      S.phase='error';S.act=null;d.cmd('PAUSE');d.ui('error',(e&&e.message)||String(e));
    }
  }
  function stop(){S.run++;S.act=null;S.choiceWaiter=null;S.paused=false;S.phase='idle';d.cmd('PAUSE');d.cmd('BRANCH_OFF');if(d.cancelSpeech)d.cancelSpeech()}
  function pause(){if(S.paused||S.phase==='idle'||S.phase==='done'||S.phase==='error')return;S.paused=true;S.pauses++;d.cmd('PAUSE');if(d.pauseSpeech)d.pauseSpeech();else if(d.cancelSpeech)d.cancelSpeech();d.ui('paused',true)}

  return {start,stop,pause,resume,signal,skipMove(){if(S.act)S.act.skip=true},state:S,cfg};
}

let voiceMode='device',speechToken=0,speechEnd=null,fishFails=0;
const player=new Audio();player.preload='auto';player.playsInline=true;
const voiceCache=new Map();let prefetchChain=Promise.resolve();
function silentWav(){const n=800,b=new Uint8Array(44+n*2),v=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let s='';for(const x of b)s+=String.fromCharCode(x);return 'data:audio/wav;base64,'+btoa(s)}
function chunk(text,max){
  const parts=String(text).match(/[^。！？!?\n]+[。！？!?…」』]*|\n+/g)||[text];const out=[];let cur='';
  const add=t=>{if(cur&&(cur+t).length>max){out.push(cur);cur=''}cur+=t};
  for(const p of parts){const t=p.replace(/\n+/g,'');if(!t)continue;
    if(t.length<=max){add(t);continue}
    // 句子太長：先在逗號處分開，真的還太長才硬切
    for(const c of t.match(/[^，、；：,]+[，、；：,」』]*/g)||[t]){
      if(c.length<=max){add(c);continue}
      if(cur){out.push(cur);cur=''}
      for(let i=0;i<c.length;i+=max)out.push(c.slice(i,i+max))}}
  if(cur)out.push(cur);return out}
function endSpeech(){if(speechEnd){const f=speechEnd;speechEnd=null;f()}}
// 暫停：Fish 音檔停在原位；裝置語音停掉這一句，繼續時只重唸這一句
let speechPaused=false,fishPlaying=false;const resumeWaiters=[];
function releaseWaiters(){resumeWaiters.splice(0).forEach(f=>f())}
function waitResume(my){return new Promise(res=>{if(!speechPaused||my!==speechToken)return res();resumeWaiters.push(res)})}
function pauseSpeech(){if(speechPaused)return;speechPaused=true;try{player.pause()}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function resumeSpeech(){if(!speechPaused)return;speechPaused=false;if(fishPlaying){try{Promise.resolve(player.play()).catch(()=>{})}catch(e){}}releaseWaiters()}
function cancelSpeech(){speechToken++;speechPaused=false;releaseWaiters();try{speechSynthesis.cancel()}catch(e){}try{player.pause()}catch(e){}endSpeech()}
async function speakDevice(text,my){
  while(my===speechToken){
    await waitResume(my);if(my!==speechToken)return;
    await speakDeviceOnce(text,my);
    if(!speechPaused)return;          // 唸完了；若是被暫停打斷，繼續後重唸這一句
  }
}
function speakDeviceOnce(text,my){return new Promise(resolve=>{
  if(my!==speechToken)return resolve();
  if(!('speechSynthesis' in window)){const fin=()=>{clearTimeout(tm0);if(speechEnd===fin)speechEnd=null;resolve()};const tm0=setTimeout(fin,text.length*230+400);speechEnd=fin;return}
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.92;u.pitch=1.05;
  const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==='zh-TW')||vs.find(v=>/^zh/.test(v.lang))||null;
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(tm);if(speechEnd===fin)speechEnd=null;resolve()};
  const tm=setTimeout(fin,text.length*420+5000);speechEnd=fin;u.onend=fin;u.onerror=fin;
  try{speechSynthesis.speak(u)}catch(e){fin()}})}
async function fetchVoice(text){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);
  try{const r=await fetch(WORKER_URL+'/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text}),signal:c.signal});
    if(!r.ok||!(r.headers.get('Content-Type')||'').includes('audio/'))throw Error('voice');
    return URL.createObjectURL(await r.blob())}finally{clearTimeout(t)}}
function voiceFor(text){if(!voiceCache.has(text))voiceCache.set(text,fetchVoice(text).catch(()=>null));return voiceCache.get(text)}
async function speakFish(text,my){
  const url=await voiceFor(text);if(my!==speechToken)return;
  if(!url){if(++fishFails>=3)voiceMode='device';return speakDevice(text,my)}
  fishFails=0;
  await waitResume(my);if(my!==speechToken)return;
  let blocked=false;
  await new Promise(resolve=>{let done=false,tm=null,budget=text.length*450+12000;
    const fin=()=>{if(done)return;done=true;fishPlaying=false;clearTimeout(tm);player.onended=player.onerror=null;if(speechEnd===fin)speechEnd=null;resolve()};
    const guard=()=>{if(!speechPaused)budget-=1000;if(budget<=0)return fin();tm=setTimeout(guard,1000)};   // 暫停的時間不算進逾時
    tm=setTimeout(guard,1000);speechEnd=fin;player.onended=fin;player.onerror=fin;player.src=url;fishPlaying=true;
    Promise.resolve(player.play()).catch(()=>{if(speechPaused)return;blocked=true;fin()})});
  if(blocked&&my===speechToken)await speakDevice(text,my);
}
async function speak(text){
  const my=++speechToken;
  // 裝置語音一句一句唸（暫停後只重唸那一句）；字幕跟著目前唸的這一段走
  for(const p of chunk(text,voiceMode==='fish'?360:40)){if(my!==speechToken)return;$('caption').textContent=p;await(voiceMode==='fish'?speakFish(p,my):speakDevice(p,my))}
}
// Fish 配音有延遲，所以一幕開始時就先把這一幕會用到的句子抓好
function prefetch(sc){
  if(voiceMode!=='fish')return;
  const list=[...chunk(sc.text,360)];
  if(sc.move)list.push(sc.move.lead,...sc.move.beats);
  if(sc.game){list.push(sc.game.lead,...sc.game.steps);for(const ph of sc.game.phases)if(ph.call)list.push(ph.call)}
  if(sc.after)list.push(...chunk(sc.after,360));
  if(sc.move)list.push(...sc.move.hints);
  for(const t of list)prefetchChain=prefetchChain.then(()=>voiceFor(t)).catch(()=>{});
}

/* ═════════ 聲音：音效（用程式合成，不需要音檔） ═════════ */
let actx=null,lastSfx=0;
function audio(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume();return actx}
function noise(dur,type,freq,q,gain,attack){
  const a=audio();if(!a)return;const n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=a.createGain(),t=a.currentTime;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+(attack||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);src.stop(t+dur+0.02);return f}
function tone(freq,at,dur,gain){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+at;o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05)}
function sfx(name){
  if(!name||name==='none')return;
  const now=performance.now();
  if(name==='chime'){tone(880,0,.5,.18);tone(1320,.14,.7,.16);return}
  if(name==='cheer'){tone(660,0,.18,.14);tone(880,.12,.18,.14);tone(1100,.24,.4,.16);return}
  if(name==='ding'){tone(1568,0,.6,.24);tone(2350,0,.35,.08);return}                 // 「聽口令搖」的口令聲，要和其他聲音分得出來
  if(now-lastSfx<170)return;lastSfx=now;

  else if(name==='splash'){const f=noise(.28,'bandpass',1500,.9,.42);if(f&&actx)f.frequency.exponentialRampToValueAtTime(500,actx.currentTime+.26)}
  else if(name==='rustle')noise(.14,'highpass',3200,.5,.2);
  else if(name==='clap')noise(.05,'bandpass',1900,1.2,.55);
  else if(name==='wind')noise(.7,'lowpass',620,.4,.16,.3);
}

const band={device:null,ch:null,queue:Promise.resolve(),connected:false};
function bandUI(){const el=$('bandState');el.replaceChildren();const i=document.createElement('i');i.className='dot'+(band.connected?' on':'');
  el.append(i,document.createTextNode(band.connected?'手環連上了':'手環還沒連上'));$('connect').textContent=band.connected?'中斷連線':'連接手環'}
function cmd(c){if(!band.ch||!band.connected)return;const ch=band.ch;

// Windows 的 Chrome 第一次連藍牙常常失敗（Connection attempt failed），自動多試幾次
async function connectRetry(dev,tries=4){
  let last;
  for(let i=0;i<tries;i++){
    try{if(dev.gatt.connected)return dev.gatt;return await dev.gatt.connect()}
    catch(e){last=e;notice('正在連接手環……（第 '+(i+2)+' 次）');await new Promise(r=>setTimeout(r,800+i*400))}
  }
  throw last;
}
async function connectBand(){
  if(band.connected){try{band.device.gatt.disconnect()}catch(e){}return}
  if(!navigator.bluetooth||!navigator.bluetooth.requestDevice){notice('這個瀏覽器不能連手環。iPhone 請改用 Bluefy；也可以先用畫面上的按鈕試玩。');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[BLE.service]});
    const server=await connectRetry(dev),svc=await server.getPrimaryService(BLE.service),ch=await svc.getCharacteristic(BLE.characteristic);
    band.device=dev;band.ch=ch;band.connected=true;band.queue=Promise.resolve();
    dev.addEventListener('gattserverdisconnected',()=>{if(band.device!==dev)return;band.connected=false;band.ch=null;bandUI();notice('手環斷線了。可以重新連接，或長按畫面用按鈕代替。')});
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>{const t=new TextDecoder().decode(e.target.value).trim().toUpperCase();if(t)engine.signal(t)});
    cmd('MODE_CHILD');cmd('GAME_ACTIVE');cmd('PAUSE');bandUI();notice('手環連上了。');
  }catch(e){band.connected=false;band.ch=null;bandUI();
    const m=String(e&&e.message||e);
    notice(/cancel/i.test(m)?'沒有選擇手環。':'沒有連上手環：'+m+'。請確認手環有開機、沒有被其他分頁或手機連著，再按一次「連接手環」。')}
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(path,body){
  // 連不上（Failed to fetch）通常是 Worker 當下出錯或網路不穩：自動再試一次
  for(let attempt=0;;attempt++){
    const c=new AbortController(),t=setTimeout(()=>c.abort(),150000);
    try{
      const r=await fetch(WORKER_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw Object.assign(Error(j.error||(r.status===404?'Worker 還是舊版，請先部署 worker_v4.js':'故事伺服器回傳錯誤（'+r.status+'）')),{server:true});
      return j;
    }catch(e){
      if(e.name==='AbortError')throw Error('故事等太久了，請再試一次');
      if(e.server)throw e;
      if(attempt<1){await new Promise(r=>setTimeout(r,2500));continue}
      throw Error('連不到故事伺服器。請打開 Worker 的 /health 看看有沒有回應，或稍後再試');
    }finally{clearTimeout(t)}
  }
}

function remember(story,moved){try{const list=pastStories();list.unshift({title:story.title,name:story.companion.name,moved:moved||0,t:Date.now()});localStorage.setItem('sdq-v3-stories',JSON.stringify(list.slice(0,6)))}catch(e){}renderPast()}
function renderPast(){const list=pastStories(),ul=$('pastList');ul.replaceChildren();show('past',list.length>0);
  for(const s of list){const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');a.textContent='《'+s.title+'》和'+s.name;b.textContent=s.moved?'動了 '+fmtTime(s.moved):'';li.append(a,b);ul.append(li)}}

const engine=createEngine({speak,cancelSpeech,pauseSpeech,resumeSpeech,sfx,cmd,robot,api,ui,prefetch,sleep,now:()=>performance.now(),cfg:{}});

/* 螢幕不要自己鎖起來（鎖了故事會被系統暫停） */
let wake=null;
async function keepAwake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wake)wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{
  if($('stage').hidden)return;
  if(document.hidden){engine.pause();show('resume',true)}else keepAwake();
});
$('resumeBtn').onclick=()=>{audio();show('resume',false);keepAwake();engine.resume()};

/* 沒有手環時，用按鈕或鍵盤代替 */
let simTimer=null,simHeld=false,simStep=0;
function simStart(){if(simTimer)return;simTimer=setInterval(()=>{if(band.connected)return;engine.signal('A:'+(simHeld?6:0));if(simHeld&&(++simStep%2===0))engine.signal('S')},250)}
function simStop(){clearInterval(simTimer);simTimer=null;simHeld=false}
const holdOn=e=>{e.preventDefault();simHeld=true},holdOff=()=>{simHeld=false};
$('simMove').addEventListener('pointerdown',holdOn);['pointerup','pointerleave','pointercancel'].forEach(t=>$('simMove').addEventListener(t,holdOff));
$('simJump').onclick=()=>engine.signal('J');
document.addEventListener('keydown',e=>{
  if($('stage').hidden)return;
  if(e.code==='Space'){e.preventDefault();simHeld=true}
  else if(e.key==='j'||e.key==='J')engine.signal('J');
  else if(e.key==='ArrowLeft')engine.signal('CHOICE_LEFT');
  else if(e.key==='ArrowRight')engine.signal('CHOICE_RIGHT');
  else if(e.key==='Enter')engine.skipMove();
});
document.addEventListener('keyup',e=>{if(e.code==='Space')simHeld=false});

/* 黑畫面上長按一秒，才會出現控制鈕（避免孩子誤觸） */
let pressTimer=null;
$('stage').addEventListener('pointerdown',e=>{if(e.target.closest('#sheet,#fork,#resume'))return;pressTimer=setTimeout(()=>{show('sheet',true);clearTimeout(sheetTimer);sheetTimer=setTimeout(()=>{if(!simHeld)show('sheet',false)},9000)},900)});
['pointerup','pointerleave','pointercancel'].forEach(t=>$('stage').addEventListener(t,()=>clearTimeout(pressTimer)));
$('sheet').addEventListener('pointerdown',()=>{clearTimeout(sheetTimer);sheetTimer=setTimeout(()=>{if(!simHeld)show('sheet',false)},9000)});
$('pauseBtn').onclick=()=>{if(engine.state.paused){audio();engine.resume()}else engine.pause()};
$('skipBtn').onclick=()=>engine.skipMove();
$('quitBtn').onclick=()=>{engine.stop();leaveStage();show('setup',true);notice('')};
$('fork').addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(b)engine.signal(b.dataset.choice==='left'?'CHOICE_LEFT':'CHOICE_RIGHT')});

/* 準備畫面 */
$('ideas').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('idea').value=b.dataset.idea||'';$('idea').focus()});
let ageValue='6',sensValue='mid';
function setSens(v){sensValue=v;document.querySelectorAll('#sensSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sens===v)))}
$('sensSeg').addEventListener('click',e=>{const b=e.target.closest('[data-sens]');if(b)setSens(b.dataset.sens)});
function setAge(a){ageValue=String(a);document.querySelectorAll('#ages button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.age===ageValue)))}
$('ages').addEventListener('click',e=>{const b=e.target.closest('[data-age]');if(b)setAge(b.dataset.age)});
$('connect').onclick=connectBand;
try{const s=JSON.parse(localStorage.getItem('sdq-v3')||'{}');if(s.age&&/^[5-8]$/.test(String(s.age)))setAge(s.age);$('fish').checked=s.voice==='fish';if(s.sens&&SENS[s.sens])setSens(s.sens);$('seated').checked=!!s.seated;$('subs').checked=!!s.subs}catch(e){}
function begin(){
  notice('');
  // 這些一定要在「按下按鈕」的當下做，手機才允許之後自動播放聲音
  audio();try{player.src=silentWav();Promise.resolve(player.play()).catch(()=>{})}catch(e){}
  try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}
  keepAwake();
  voiceMode=$('fish').checked?'fish':'device';fishFails=0;voiceCache.clear();
  const seated=$('seated').checked;
  Object.assign(engine.cfg,SENS[sensValue]||SENS.mid,{seated});
  try{localStorage.setItem('sdq-v3',JSON.stringify({age:ageValue,voice:voiceMode,sens:sensValue,seated,subs:$('subs').checked}))}catch(e){}
  simStart();
  engine.start({mode:'child',player:'solo',posture:seated?'seated':'general',age:Number(ageValue),topic:$('idea').value.trim(),chat:[]});
}
$('begin').onclick=begin;
$('again').onclick=()=>{show('finale',false);show('setup',true);window.scrollTo(0,0)};
window.addEventListener('pagehide',()=>{cancelSpeech();cmd('PAUSE')});
bandUI();renderPast();
</script>
</body>
</html>
