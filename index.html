<script>

/* =========================================================

========================================================= */

let bleDevice = null;

let expectedAction = "";

let busy = false;

let lastActionTime = 0;



const $ = id =>
    document.getElementById(id);



/* =========================================================
   Toast
========================================================= */

function showToast(msg) {

    const t =
        $('toast');


    t.textContent =
        msg;


    t.classList.remove(
        'opacity-0',
        'pointer-events-none'
    );


    t.classList.add(
        'opacity-100'
    );


    setTimeout(() => {

        t.classList.remove(
            'opacity-100'
        );


        t.classList.add(
            'opacity-0',
            'pointer-events-none'
        );

    }, 3000);

}



/* =========================================================
   語音
========================================================= */

function speak(text) {

    if (
        !('speechSynthesis' in window)
    ) {

        return;

    }


    if (!text) {

        return;

    }


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        'zh-TW';


    utterance.rate =
        0.95;


    utterance.pitch =
        1.0;


    window.speechSynthesis.speak(
        utterance
    );

}



/* =========================================================
   清除語音並播放
========================================================= */

function speakNow(text) {

    if (
        !('speechSynthesis' in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    setTimeout(() => {

        speak(text);

    }, 80);

}



/* =========================================================
   成功 / 失敗
========================================================= */

function speakSuccess() {

    speakNow(
        "成功！做得很好！"
    );

}


function speakFailure() {

    speakNow(
        "失敗，再試一次。"
    );

}



/* =========================================================
   動作顯示文字
========================================================= */

function actionLabel(action) {

    const map = {

        SWIPE_LEFT:

            currentMode === 'senior'

                ? "↩️ 請慢慢向左移動手臂"

                : "⬅️ 請向左揮動手環",


        SWIPE_RIGHT:

            currentMode === 'senior'

                ? "↪️ 請慢慢向右移動手臂"

                : "➡️ 請向右揮動手環",


        JUMP:
            "⬆️ 請向上跳一下",


        SHAKE:

            currentMode === 'senior'

                ? "📳 請輕輕搖動手臂"

                : "📳 請搖晃手環",


        RUN:

            currentMode === 'senior'

                ? "🏃 請在坐姿下輕鬆擺動雙臂"

                : "🏃 請原地跑步，手臂前後擺動",


        ARM_UP:
            "🙋 請慢慢將手臂抬起來",


        ARM_DOWN:
            "🙆 請慢慢將手臂放下",


        TILT_LEFT:
            "↩️ 請慢慢向左傾斜",


        TILT_RIGHT:
            "↪️ 請慢慢向右傾斜",


        HOLD_UP:
            "✋ 請抬高手臂並保持一下"

    };


    return map[action] ||
        "📳 請依照提示操作裝置";

}



/* =========================================================
   動作語音文字
   不包含 Emoji
========================================================= */

function actionSpeechLabel(action) {

    const map = {

        SWIPE_LEFT:

            currentMode === 'senior'

                ? "請慢慢向左移動手臂"

                : "請向左揮動手環",


        SWIPE_RIGHT:

        RUN:

        ARM_UP:

        ARM_DOWN:
            "請慢慢將手臂放下",


        TILT_LEFT:

        TILT_RIGHT:

        HOLD_UP:

    return map[action] ||
        "請依照提示操作裝置";

/* =========================================================
   播放動作
========================================================= */

function speakAction(action) {

    speakNow(
        actionSpeechLabel(action)
    );

}



/* =========================================================
   故事 → 動作
========================================================= */

function speakStoryThenAction(
    story,
    action
) {

    if (
        !('speechSynthesis' in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const storyUtterance =
        new SpeechSynthesisUtterance(
            story
        );


    storyUtterance.lang =
        'zh-TW';


    storyUtterance.rate =
        0.95;


    storyUtterance.pitch =
        1.0;


    storyUtterance.onend =
        () => {

            if (action) {

                speakAction(
                    action
                );

            }

        };


    window.speechSynthesis.speak(
        storyUtterance
    );

}

/* =========================================================
   BLE 連線
========================================================= */

async function connectBLE() {

    if (!navigator.bluetooth) {

        showToast(
            '此瀏覽器不支援 Web Bluetooth，請使用支援的瀏覽器。'
        );

        return;

    }


    try {

        showToast(
            '正在搜尋故事裝置...'
        );


        bleDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    BLE_CONFIG.serviceUuid
                ]

            });


        bleDevice.addEventListener(
            'gattserverdisconnected',
            () => {

                $('statusIndicator').className =
                    'w-4 h-4 rounded-full bg-slate-500 inline-block shadow';


                $('statusText').textContent =
                    '已斷線';


                $('statusIcon').className =
                    'fa-solid fa-plug-circle-xmark text-slate-500 text-xl';


                bleCharacteristic =
                    null;


                showToast(
                    '故事裝置已斷線'
                );

            }
        );


        const server =
            await bleDevice.gatt.connect();


        const service =
            await server.getPrimaryService(
                BLE_CONFIG.serviceUuid
            );


        bleCharacteristic =
            await service.getCharacteristic(
                BLE_CONFIG.characteristicUuid
            );


        await bleCharacteristic.startNotifications();


        bleCharacteristic.addEventListener(
            'characteristicvaluechanged',
            onBleEvent
        );


        $('statusIndicator').className =
            'w-4 h-4 rounded-full bg-emerald-500 inline-block shadow-lg animate-pulse';


        $('statusText').textContent =
            '已連線';


        $('statusIcon').className =
            'fa-solid fa-plug-circle-check text-emerald-400 text-xl';


        await sendBLE(
            currentMode === 'senior'
                ? "MODE_SENIOR"
                : "MODE_CHILD"
        );


        await sendBLE(
            "READY"
        );


        showToast(
            '藍牙連線成功！'
        );

    }


    catch (e) {

        console.error(e);

        showToast(
            '藍牙連線失敗：' +
            e.message
        );

    }

}



/* =========================================================
   ESP32 → 網頁
========================================================= */

function onBleEvent(event) {

    const value =
        new TextDecoder()
            .decode(event.target.value)
            .trim()
            .toUpperCase();


    console.log(
        "收到硬體訊號:",
        value
    );



    /* 模式切換 */

    if (
        value === "SWITCH_MODE_SENIOR" ||
        value === "MODE_SENIOR"
    ) {

        switchMode(
            'senior',
            false
        );

        return;

    }


    if (
        value === "SWITCH_MODE_CHILD" ||
        value === "MODE_CHILD"
    ) {

        switchMode(
            'child',
            false
        );

        return;

    }



    /* 沒有等待動作 */

    if (
        !waitingForAction ||
        busy
    ) {

        return;

    }


    const now =
        Date.now();


    if (
        now - lastActionTime < 2000
    ) {

        return;

    }


    const cleanExpected =
        (expectedAction || "")
        .trim()
        .toUpperCase();



    /* =====================================================
       正確
    ===================================================== */

    if (
        value === cleanExpected
    ) {

        lastActionTime =
            now;


        showToast(
            '✨ 動作正確！'
        );


        /*
         * 先播放成功聲。
         * handleAction 會等成功聲結束後才繼續。
         */

        playSuccessThenContinue(
            expectedAction
        );

    }



    /* =====================================================
       錯誤
    ===================================================== */

    else {

        showToast(
            '收到 ' +
            value +
            '，目前需要：' +
            actionLabel(expectedAction)
        );


        $('actionSubText').textContent =
            '目前需要：' +
            actionLabel(expectedAction);


        speakFailure();

    }

}



/* =========================================================
   成功 → 下一段
========================================================= */

function playSuccessThenContinue(action) {

    if (
        !('speechSynthesis' in window)
    ) {

        handleAction(action);

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            "成功！做得很好！"
        );


    utterance.lang =
        'zh-TW';


    utterance.rate =
        0.95;


    utterance.onend =
        () => {

            handleAction(
                action
            );

        };


    window.speechSynthesis.speak(
        utterance
    );

}



/* =========================================================
   BLE 傳送
========================================================= */

async function sendBLE(command) {

    if (!bleCharacteristic) {

        return;

    }


    try {

        const encoder =
            new TextEncoder();


        await bleCharacteristic.writeValue(
            encoder.encode(command)
        );

    }


    catch (e) {

        console.error(
            'BLE 傳送失敗',
            e
        );

    }

}



/* =========================================================
   AI JSON
========================================================= */

async function parseAIResponse(res) {

    const rawData =
        await res.json();


    if (!res.ok) {

        throw new Error(
            rawData.error ||
            'AI 回應失敗'
        );

    }


    let content =
        rawData;


    if (
        rawData.choices &&
        rawData.choices[0] &&
        rawData.choices[0].message
    ) {

        content =
            rawData.choices[0]
                .message
                .content;

    }


    if (
        typeof content === 'string'
    ) {

        try {

            let cleanStr =
                content
                    .replace(/```json/g, '')
                    .replace(/```/g, '')
                    .trim();


            return JSON.parse(
                cleanStr
            );

        }


        catch (err) {

            return {

                story:
                    content,

                action:
                    null,

                done:
                    true

            };

        }

    }


    return content;

}

/* =========================================================
   動作完成後
========================================================= */

async function handleAction(action) {

    if (
        !waitingForAction ||
        busy
    ) {

        return;

    }


    waitingForAction =
        false;


    $('actionPrompt')
        .classList
        .add('hidden');


    busy =
        true;


    await sendBLE(
        "ACTION_OK"
    );


    try {


        /* ===================================================
           ⚠️ 這裡是這次修正兒童「故事斷掉」的重點
           
           不再用 /api/story
           
           而是：
           
           /api/action
           
           表示「目前故事完成了一個動作，
           請接著目前故事往下寫」。
        =================================================== */


        const res =
            await fetch(
                WORKER_URL +
                '/api/action',
                {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({

                        mode:
                            currentMode,

                        topic:
                            selectedTheme,

                        difficulty:
                            selectedDifficulty,

                        action:
                            action,

                        currentStory:
                            currentStory,

                        history:
                            history

                    })

                }
            );


        const data =
            await parseAIResponse(res);



        /* ===================================================
           👴 長輩模式
           
           不要故事。
        =================================================== */

        if (
            currentMode === 'senior'
        ) {

            currentStory =
                "";


            if (
                data.done
            ) {

                $('actionPrompt')
                    .classList
                    .remove('hidden');


                $('promptText').textContent =
                    '🎉 今日活動完成！';


                $('actionSubText').textContent =
                    '辛苦了，請慢慢休息。';


                waitingForAction =
                    false;


                speakNow(
                    "今日活動完成，做得很好，請慢慢休息。"
                );

            }


            else {

                expectedAction =
                    data.action;


                waitingForAction =
                    true;


                $('actionPrompt')
                    .classList
                    .remove('hidden');


                $('promptText').textContent =
                    actionLabel(
                        data.action
                    );


                $('actionSubText').textContent =
                    '請坐穩，慢慢完成動作。';


                speakAction(
                    data.action
                );

            }


            return;

        }



        /* ===================================================
           👦 兒童模式
        =================================================== */

        currentStory =
            data.story ||
            currentStory;


        history.push({

            role:
                "assistant",

            story:
                currentStory,

            action:
                data.action ||
                null

        });


        appendStory(

            '🤖 AI 繼續冒險',

            currentStory,

            data.done
                ? null
                : data.action

        );



        /* 故事結束 */

        if (
            data.done
        ) {

            $('actionPrompt')
                .classList
                .remove('hidden');


            $('promptText').textContent =
                '🎉 太棒了！冒險任務完成！';


            $('actionSubText').textContent =
                '故事已完整結束。';


            waitingForAction =
                false;


            speak(
                currentStory
            );

        }



        /* 還有下一個動作 */

        else {

            expectedAction =
                data.action;


            waitingForAction =
                true;


            $('actionPrompt')
                .classList
                .remove('hidden');


            $('promptText').textContent =
                data.actionLabel ||
                actionLabel(
                    data.action
                );


            $('actionSubText').textContent =
                '完成動作後，故事會繼續。';


            /*
             * 這裡非常重要：
             *
             * 故事先念完
             * ↓
             * 再念動作
             *
             * 不會互相打斷。
             */

            speakStoryThenAction(

                currentStory,

                data.action

            );

        }

    }


    catch (e) {

        console.error(e);


        showToast(
            '連線失敗：' +
            e.message
        );


        waitingForAction =
            true;


        $('actionPrompt')
            .classList
            .remove('hidden');

    }


    finally {

        busy =
            false;

    }

}

        }



        /* ===================================================

        =================================================== */

        currentStory =

            "";


        history = [

            {
                role:
                    'user',

                topic:

            {
                role:
                    'assistant',

                story:

                action:

        ];

            '📖 AI 第一章',

            currentStory,

                ? null
                : data.action

            $('promptText').textContent =

            );

            waitingForAction =

                .remove('hidden');

                );

                    ) {

                        );

                        return;

                    }


                    /*
                     * 手動測試也走同樣的成功流程
                     */

                    playSuccessThenContinue(
                        expectedAction
                    );

                }
            );



        /* ===================================================
           自訂主題
        =================================================== */

        $('customTopicInput')
            .addEventListener(
                'input',
                () => {

                        .querySelectorAll(
                            '.theme-btn'
                        )
                        .forEach(b => {

                                'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold';

                        });

                }
            );



        /* ===================================================
           手動播放
        =================================================== */

        $('btnSpeak')
            .addEventListener(
                'click',
                () => {

                    if (
                        window.speechSynthesis.speaking
                    ) {

                        window.speechSynthesis.cancel();

                        return;

                    }


                    /* 長輩 */

                    if (
                        currentMode === 'senior'
                    ) {

                        if (
                            expectedAction
                        ) {

                            speakAction(
                                expectedAction
                            );

                        }

                        return;

                    }


                    /* 兒童 */

                    if (
                        currentStory
                    ) {

                        if (
                            expectedAction
                        ) {

                            speakStoryThenAction(

                                currentStory,

                                expectedAction

                            );

                        }

                        else {

                            speak(
                                currentStory
                            );

                        }

                    }

                }
            );

    }
);


</script>
