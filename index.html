<script>
/* =====================================================
   聲動奇境 9.0 FRONTEND
   ===================================================== */

const BLE_CONFIG = {
    serviceUuid: '4fa8691a-136d-4560-84ed-01354051b785',
    characteristicUuid: 'beb5483e-36e1-4688-b7f5-ea07361b26a8'
};

const WORKER_URL = 'https://empty-credit-1539.rrong1041.workers.dev';

let bleDevice = null;
let bleCharacteristic = null;
let currentMode = 'child';
let selectedTheme = '勇敢的小騎士與巨龍';
let selectedDifficulty = 'easy';
let currentStory = '';
let currentAction = '';
let currentActionNarration = '';
let currentActionPurpose = '';
let storyMemory = null;
let adventureSeed = '';
let currentRound = 0;
let maxRound = 11;
let sceneId = '';
let sceneSeed = '';
let history = [];
let waitingForAction = false;
let expectedAction = '';
let busy = false;
let lastActionTime = 0;
let speechPlaying = false;

const $ = id => document.getElementById(id);

const CHILD_THEMES = [
    { name:'勇敢的小騎士與巨龍', icon:'⚔️', short:'騎士巨龍' },
    { name:'神奇魔法森林的密道', icon:'🌲', short:'魔法森林' },
    { name:'海底王國的寶藏探險', icon:'🐬', short:'海底王國' },
    { name:'星際太空救援任務', icon:'🚀', short:'星際救援' },
    { name:'神秘海圖與海盜寶藏', icon:'🏴‍☠️', short:'海盜寶藏' },
    { name:'恐龍世界大冒險', icon:'🦖', short:'恐龍世界' },
    { name:'魔法學院的失控魔法', icon:'🧙', short:'魔法學院' },
    { name:'機器人城市大危機', icon:'🤖', short:'機器城市' },
    { name:'神秘偵探事件', icon:'🕵️', short:'神秘偵探' },
    { name:'城堡幽靈之謎', icon:'👻', short:'幽靈城堡' },
    { name:'貓咪的宇宙旅行', icon:'🐱', short:'貓咪宇宙' },
    { name:'火山島求生大冒險', icon:'🌋', short:'火山島' },
    { name:'冰雪王國的冬日危機', icon:'❄️', short:'冰雪王國' },
    { name:'神獸山脈的秘密', icon:'🐉', short:'神獸山脈' },
    { name:'神奇時光列車', icon:'🚂', short:'時光列車' },
    { name:'星空夢境大冒險', icon:'🌌', short:'星空夢境' },
    { name:'沙漠失落城市', icon:'🏜️', short:'失落城市' },
    { name:'海洋救援隊', icon:'🌊', short:'海洋救援' }
];

const ACTION_INSTRUCTIONS = {
    SWIPE_LEFT:'現在向左閃避！',
    SWIPE_RIGHT:'現在向右閃避！',
    JUMP:'現在跳起來！',
    SHAKE:'現在搖一搖，把它甩開！',
    RUN:'現在快跑，追上去！',
    ARM_UP:'現在把手抬高！',
    ARM_DOWN:'現在把手放下！',
    TILT_LEFT:'現在向左傾斜！',
    TILT_RIGHT:'現在向右傾斜！',
    HOLD_UP:'現在把手抬起並保持住！'
};

function getActionNarration(data) {
    const action = String(data?.action || '').trim().toUpperCase();
    return ACTION_INSTRUCTIONS[action] || data?.actionNarration || data?.actionPurpose || '現在做出你的動作！';
}

function getActionIcon(action) {
    const icons = {
        SWIPE_LEFT:'⬅️', SWIPE_RIGHT:'➡️', JUMP:'⬆️', SHAKE:'📳',
        RUN:'🏃', ARM_UP:'🙋', ARM_DOWN:'🙆', TILT_LEFT:'↩️', TILT_RIGHT:'↪️', HOLD_UP:'✋'
    };
    return icons[action] || '✨';
}

function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0', 'pointer-events-none');
    t.classList.add('opacity-100');
    setTimeout(() => {
        t.classList.remove('opacity-100');
        t.classList.add('opacity-0', 'pointer-events-none');
    }, 3000);
}

function removeEmoji(text) {
    if (!text) return '';
    try {
        return text.replace(/[\p{Extended_Pictographic}\uFE0F]/gu, '').replace(/\s{2,}/g,' ').trim();
    } catch {
        return text.trim();
    }
}

/* =====================================================
   核心：handleStory 與互動處理
===================================================== */
async function handleStory(actionType = 'START', actionData = {}) {
    if (busy) return;
    busy = true;

    // 取得自訂主題或選擇的主題
    const customInput = $('customTopicInput').value.trim();
    const activeTheme = customInput || selectedTheme;

    try {
        $('welcomeMessage').classList.add('hidden');
        $('storyDisplay').classList.remove('hidden');
        
        if (actionType === 'START') {
            $('storyDisplay').innerHTML = `<div class="text-purple-300 animate-pulse">✨ 正在為你編織精彩的 ${activeTheme} 冒險故事中...</div>`;
            $('btnText').textContent = '故事生成中...';
        } else {
            showToast('正在驗證動作並推進劇情...');
        }

        const response = await fetch(`${WORKER_URL}/api/story`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                mode: currentMode,
                theme: activeTheme,
                difficulty: selectedDifficulty,
                action: actionType,
                data: actionData,
                history: history,
                storyMemory: storyMemory,
                adventureSeed: adventureSeed,
                currentRound: currentRound,
                maxRound: maxRound,
                sceneId: sceneId
            })
        });

        if (!response.ok) {
            throw new Error('伺服器回應錯誤狀態：' + response.status);
        }

        const result = await response.json();
        
        // 更新狀態與記憶
        currentStory = result.story || result.text || '發生了奇妙的事情...';
        currentAction = result.action || '';
        expectedAction = currentAction;
        storyMemory = result.storyMemory || storyMemory;
        adventureSeed = result.adventureSeed || adventureSeed;
        currentRound = (result.currentRound !== undefined) ? result.currentRound : (currentRound + 1);
        sceneId = result.sceneId || sceneId;

        // 記錄到歷史
        history.push({ role: 'assistant', content: currentStory, action: currentAction });

        // 渲染畫面
        const p = document.createElement('p');
        p.className = 'mb-4 text-slate-200';
        p.textContent = currentStory;
        $('storyDisplay').appendChild(p);
        $('storyScroll').scrollTop =$('storyScroll').scrollHeight;

        // 朗讀故事
        speak(currentStory);
        $('btnSpeak').removeAttribute('disabled');

        // 處理下一步動作提示
        if (currentAction && currentAction !== 'FINISH') {
            waitingForAction = true;
            const promptTextEl = $('promptText');
            const subTextEl = $('actionSubText');
            const actionPromptEl = $('actionPrompt');

            currentActionNarration = getActionNarration({ action: currentAction });
            promptTextEl.textContent = `${getActionIcon(currentAction)} ${currentActionNarration}`;
            subTextEl.textContent = `請對裝置做出動作以繼續故事。`;
            actionPromptEl.classList.remove('hidden');
        } else {
            waitingForAction = false;
            $('actionPrompt').classList.add('hidden');
            if (currentAction === 'FINISH') {
                showToast('🎉 恭喜你完成了這段精彩的冒險！');
            }
        }

    } catch (e) {
        console.error('handleStory 錯誤:', e);
        showToast('連線至伺服器發生錯誤，請稍後再試');
    } finally {
        busy = false;
        $('btnText').textContent = '開始精彩故事冒險';
    }
}

async function handleAction(actionName) {
    if (!waitingForAction || busy) return;
    waitingForAction = false;
    $('actionPrompt').classList.add('hidden');
    await handleStory('ACTION', { triggeredAction: actionName });
}


/* =====================================================
   語音合成 (TTS) 設定
===================================================== */
let availableVoices = [];
let selectedVoice = null;
let speechToken = 0;
let voiceSettings = { rate: 1, pitch: 1, volume: 1, emotion: 'natural', voiceURI: '', version: 5 };

const EMOTION_PROFILES = {
    natural: { rate: 1, pitch: 1 },
    lively: { rate: 1.05, pitch: 1.08 },
    tense: { rate: 1.02, pitch: 1.12 },
    gentle: { rate: .88, pitch: .94 }
};

function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    availableVoices = speechSynthesis.getVoices();
    const select = $('voiceSelect');
    if (!select) return;
    select.innerHTML = '<option value="__AUTO__">✨ 自動（使用裝置自然語音）</option>';
    availableVoices.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = `${voice.name} (${voice.lang})`;
        select.appendChild(option);
    });
}

if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = loadVoices;
}

function stopSpeech() {
    speechToken++;
    try { speechSynthesis.cancel(); } catch(e) {}
    speechPlaying = false;
}

async function speak(text) {
    if (!text || !('speechSynthesis' in window)) return;
    const clean = removeEmoji(text);
    if (!clean) return;
    stopSpeech();
    const token = speechToken;
    speechPlaying = true;
    const utterance = new SpeechSynthesisUtterance(clean);
    
    if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang || 'zh-TW';
    } else {
        utterance.lang = 'zh-TW';
    }
    utterance.rate = voiceSettings.rate;
    utterance.pitch = voiceSettings.pitch;
    utterance.volume = voiceSettings.volume;

    await new Promise(resolve => {
        let finished = false;
        const finish = () => { if (!finished) { finished = true; resolve(); } };
        utterance.onend = finish;
        utterance.onerror = finish;
        setTimeout(finish, Math.max(7000, clean.length * 500));
        try { speechSynthesis.speak(utterance); } catch(e) { finish(); }
    });

    if (token === speechToken) {
        speechPlaying = false;
    }
}


/* =====================================================
   BLE 藍牙連線
===================================================== */
async function connectBLE() {
    if (!navigator.bluetooth) {
        showToast('此瀏覽器不支援 Web Bluetooth。');
        return;
    }
    try {
        showToast('正在搜尋故事裝置……');
        bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [BLE_CONFIG.serviceUuid]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
            $('statusIndicator').className = 'w-4 h-4 rounded-full bg-slate-500 inline-block shadow';$('statusText').textContent = '已斷線';
            $('statusIcon').className = 'fa-solid fa-plug-circle-xmark text-slate-500 text-xl';
            bleCharacteristic = null;
            showToast('故事裝置已斷線');
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(BLE_CONFIG.serviceUuid);
        bleCharacteristic = await service.getCharacteristic(BLE_CONFIG.characteristicUuid);
        await bleCharacteristic.startNotifications();
        bleCharacteristic.addEventListener('characteristicvaluechanged', onBleEvent);

        $('statusIndicator').className = 'w-4 h-4 rounded-full bg-emerald-500 inline-block shadow-lg animate-pulse';$('statusText').textContent = '已連線';
        $('statusIcon').className = 'fa-solid fa-plug-circle-check text-emerald-400 text-xl';
        showToast('藍牙連線成功！');
    } catch(e) {
        console.error(e);
        showToast('藍牙連線失敗：' + e.message);
    }
}

async function onBleEvent(event) {
    const value = new TextDecoder().decode(event.target.value).trim().toUpperCase();
    console.log('收到硬體訊號：', value);
    if (value === 'SWITCH_MODE_SENIOR' || value === 'MODE_SENIOR') {
        await switchMode('senior', false);
        return;
    }
    if (value === 'SWITCH_MODE_CHILD' || value === 'MODE_CHILD') {
        await switchMode('child', false);
        return;
    }
    if (waitingForAction && !busy && value === String(expectedAction).trim().toUpperCase()) {
        await handleAction(value);
    }
}


/* =====================================================
   主題與介面初始化
===================================================== */
function renderChildThemes() {
    const container = $('themeButtonsContainer');
    container.innerHTML = '';
    CHILD_THEMES.forEach((theme, index) => {
        const button = document.createElement('button');
        button.className = index === 0
            ? 'theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-2 rounded-xl text-xs font-semibold'
            : 'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold';
        button.innerHTML = `${theme.icon} ${theme.short}`;
        button.addEventListener('click', () => {
            document.querySelectorAll('.theme-btn').forEach(b => {
                b.className = 'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold';
            });
            button.className = 'theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-2 rounded-xl text-xs font-semibold';
            selectedTheme = theme.name;
            $('customTopicInput').value = '';
        });
        container.appendChild(button);
    });
}

    expectedAction = '';
    currentStory = '';
    currentAction = '';
    history = [];

    adventureSeed = '';
    currentRound = 0;
    sceneId = '';
}

    $('actionPrompt').classList.add('hidden');$('storyDisplay').innerHTML = '';

        $('mainTitle').className = 'text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-300';$('badgeText').textContent = '長輩模式・全程坐姿，輕鬆健康動一動';
        $('welcomeIcon').textContent = '🌿✨';
        $('welcomeTitle').textContent = '準備好開始今日健康活動了嗎？';
        $('welcomeDesc').textContent = '請坐在有椅背的椅子上，AI 會依照劇情安排自然的活動。';

        $('appBody').classList.remove('mode-senior');
        $('modeChildBtn').className = 'px-5 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-pink-600 text-white shadow-md';$('modeSeniorBtn').className = 'px-5 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 text-slate-400 hover:text-white';
        $('mainTitle').className = 'text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300';$('badgeText').textContent = '沈浸式互動繪本・故事會隨你的行動改變';
        $('welcomeIcon').textContent = '📖✨';
        $('welcomeTitle').textContent = '準備好開始冒險了嗎？';
        $('welcomeDesc').textContent = '選擇主題或自訂故事，AI 會建立完整冒險。';
        $('seniorDifficultyPanel').classList.add('hidden');
        selectedTheme = CHILD_THEMES[0].name;
        renderChildThemes();
    }
}
