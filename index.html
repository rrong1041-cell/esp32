/* =========================================================

/* =========================================================
   快速取得元素
========================================================= */

const $ = id =>

/* =========================================================
   Toast
========================================================= */

function showToast(msg) {

    const t = $('toast');

    t.textContent = msg;

    t.classList.remove(
        'opacity-0',
        'pointer-events-none'
    );

    t.classList.add(
        'opacity-100'
    );

    setTimeout(() => {

        t.classList.remove(
            'opacity-100'
        );

        t.classList.add(
            'opacity-0',
            'pointer-events-none'
        );

    }, 3000);

}


/* =========================================================
   語音控制
========================================================= */

/*
    這次最重要的修改之一。

    舊版：

    speak(story);
    waitingForAction = true;

    會變成「故事還在講，已經可以做動作」。

    新版：

    await speak(story);

    代表一定等故事講完才繼續。
*/

function stopSpeech() {

    if ('speechSynthesis' in window) {

        window.speechSynthesis.cancel();

    }

    speechPlaying = false;

}


function speak(text) {

    return new Promise(resolve => {

        if (
            !('speechSynthesis' in window) ||
            !text
        ) {

            resolve();

            return;

        }


        const utterance =
            new SpeechSynthesisUtterance(text);


        utterance.lang = 'zh-TW';

        utterance.rate = 0.95;

        utterance.pitch = 1.0;

        speechPlaying = true;


        utterance.onend = () => {

            speechPlaying = false;

            resolve();

        };


        utterance.onerror = () => {

            speechPlaying = false;

            resolve();

        };


        window.speechSynthesis.speak(
            utterance
        );

    });

}


/* =========================================================
   動作文字
========================================================= */

function actionSpeechLabel(action) {

    const map = {

        SWIPE_LEFT:
            currentMode === 'senior'
                ? "請慢慢向左移動手臂"
                : "請向左揮動手環",

        SWIPE_RIGHT:
            currentMode === 'senior'
                ? "請慢慢向右移動手臂"
                : "請向右揮動手環",

        JUMP:
            currentMode === 'senior'
                ? "請保持坐姿，伸展放鬆"
                : "請向上跳一下",

        SHAKE:
            currentMode === 'senior'
                ? "請輕輕搖動手臂"
                : "請搖晃手環",

        RUN:
            currentMode === 'senior'
                ? "請原地輕鬆擺動雙臂"
                : "請原地跑步，手臂前後擺動",

        ARM_UP:
            "請慢慢將雙手抬起來",

        ARM_DOWN:
            "請慢慢將雙手放下",

        TILT_LEFT:
            "請慢慢向左傾斜身體",

        TILT_RIGHT:
            "請慢慢向右傾斜身體",

        HOLD_UP:
            "請抬高手臂並保持一下"

    };

    return map[action] ||
        "請依照提示操作裝置";

}


/*
    UI 可以有 Emoji。

    但是語音只使用上面的
    actionSpeechLabel()。

    所以不會念出「📳」。
*/

function actionLabel(action) {

    const prefix = {

        SWIPE_LEFT: "⬅️ ",

        SWIPE_RIGHT: "➡️ ",

        JUMP: "⬆️ ",

        SHAKE: "📳 ",

        RUN: "🏃 ",

        ARM_UP: "🙋 ",

        ARM_DOWN: "🙆 ",

        TILT_LEFT: "↩️ ",

        TILT_RIGHT: "↪️ ",

        HOLD_UP: "✋ "

    }[action] || "📳 ";

    return prefix +
        actionSpeechLabel(action);

}


/* =========================================================
   動作鎖定
========================================================= */

function lockAction() {

    /*
        這就是「故事沒講完不能亂甩」的核心。
    */

    waitingForAction = false;


    $('actionPrompt')
        .classList.add(
            'action-locked'
        );

    $('actionSubText').textContent =
        '🔒 故事／語音提示播放中，請等待播放完畢。';

}


/* =========================================================
   解鎖動作
========================================================= */

function unlockAction(action) {

    if (!action) {

        waitingForAction = false;

        return;

    }


    expectedAction =
        String(action)
            .trim()
            .toUpperCase();


    waitingForAction = true;


    $('actionPrompt')
        .classList.remove(
            'hidden',
            'action-locked'
        );


    $('actionPrompt')
        .classList.add(
            'action-ready'
        );


    $('promptText').textContent =
        actionLabel(expectedAction);


    $('actionSubText').textContent =
        '🟢 語音提示已播放完畢，現在可以完成動作。';

}


/* =========================================================
   切換模式
========================================================= */

async function switchMode(
    mode,
    notifyDevice = true
) {

    /*
        切換模式時先停止上一段語音，
        避免兒童故事切到長輩模式後還繼續念。
    */

    stopSpeech();

    waitingForAction = false;

    expectedAction = "";

    busy = false;

    currentStory = "";

    history = [];

    currentMode = mode;

    const isSenior =
        mode === 'senior';


    $('actionPrompt')
        .classList.add('hidden');


    $('storyDisplay').innerHTML = "";

       長輩模式
    ------------------------- */

        $('mainTitle').className =
            "text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-300";


        $('badgeText').textContent =
            "長輩模式・全程坐姿，輕鬆健康動一動";


        $('welcomeIcon').textContent =
            "🌿✨";


        $('welcomeTitle').textContent =
            "準備好開始今日健康活動了嗎？";


        $('welcomeDesc').textContent =
            "選擇安全坐姿伸展主題，跟著語音指示輕鬆活動筋骨。";


        selectedTheme =
            "輕鬆坐姿手部健康伸展";


        $('themeButtonsContainer').innerHTML = `

            <button
                data-theme="輕鬆坐姿手部健康伸展"
                class="theme-btn active bg-emerald-900/50 border border-emerald-500 text-emerald-200 py-2 px-2 rounded-xl text-xs font-semibold">

                🙌 手部健康伸展

            </button>

            <button
                data-theme="坐姿肩頸放鬆操"
                class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold">

                🧘 肩頸放鬆操

            </button>

            <button
                data-theme="坐姿活力健康動"
                class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold">

                🌟 活力健康動

       兒童模式
    ------------------------- */

    else {

        $('appBody')
            .classList.remove(
                'mode-senior'
            );


        $('modeChildBtn').className =
            "px-5 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-pink-600 text-white shadow-md";


        $('modeSeniorBtn').className =
            "px-5 py-2 rounded-xl font-bold text-sm transition flex items-center gap-2 text-slate-400 hover:text-white";


        $('mainTitle').className =

        $('badgeText').textContent =
            "沈浸式互動繪本・聽完動作指示後完成動作繼續";


        $('welcomeIcon').textContent =
            "📖✨";


        $('welcomeTitle').textContent =
            "準備好開始冒險了嗎？";


        $('welcomeDesc').textContent =
            "選擇或自訂主題，AI 會即時生成故事並在互動處停下。";

            "勇敢的小騎士與巨龍";

            <button

/* =========================================================
   主題按鈕
========================================================= */

function bindThemeButtons() {

    document
        .querySelectorAll('.theme-btn')

            btn.addEventListener(
                'click',
                e => {

                    document
                        .querySelectorAll('.theme-btn')
                        .forEach(b => {

                            b.className =
                                currentMode === 'senior'

                                ? 'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold'

                                : 'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold';

                        });


                    e.currentTarget.className =
                        currentMode === 'senior'

                        ? 'theme-btn active bg-emerald-900/50 border border-emerald-500 text-emerald-200 py-2 px-2 rounded-xl text-xs font-semibold'

                        : 'theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-2 rounded-xl text-xs font-semibold';


                    selectedTheme =
                        e.currentTarget.dataset.theme;


                    $('customTopicInput').value =
                        '';

                }
            );

        });

}

/* =========================================================
   故事顯示
========================================================= */

function appendStory(

    text,

    resultText = ""
) {

    safeTitle.className =

    const p =

    p.className =
        'text-slate-200';


    p.textContent =

        );

    );


    $('storyScroll').scrollTop =
        $('storyScroll').scrollHeight;

}


/* =========================================================
   BLE 連線
========================================================= */

async function connectBLE() {

    if (!navigator.bluetooth) {

        showToast(
            '此瀏覽器不支援 Web Bluetooth，請用支援的瀏覽器。'
        );

        return;

    }


    try {

        showToast(
            '正在搜尋故事裝置...'
        );


        bleDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    BLE_CONFIG.serviceUuid
                ]

            });


        bleDevice.addEventListener(
            'gattserverdisconnected',
            () => {

                $('statusIndicator').className =
                    'w-4 h-4 rounded-full bg-slate-500 inline-block shadow';

                $('statusText').textContent =
                    '已斷線';


                $('statusIcon').className =
                    'fa-solid fa-plug-circle-xmark text-slate-500 text-xl';


                bleCharacteristic =
                    null;


                showToast(
                    '故事裝置已斷線'
                );

            }
        );


        const server =
            await bleDevice.gatt.connect();


        const service =
            await server.getPrimaryService(
                BLE_CONFIG.serviceUuid
            );


        bleCharacteristic =
            await service.getCharacteristic(
                BLE_CONFIG.characteristicUuid
            );


        await bleCharacteristic
            .startNotifications();


        bleCharacteristic.addEventListener(
            'characteristicvaluechanged',
            onBleEvent
        );


        $('statusIndicator').className =
            'w-4 h-4 rounded-full bg-emerald-500 inline-block shadow-lg animate-pulse';


        $('statusText').textContent =
            '已連線';


        $('statusIcon').className =
            'fa-solid fa-plug-circle-check text-emerald-400 text-xl';


        await sendBLE(
            "READY"
        );


        showToast(
            '藍牙連線成功！'
        );


    } catch (e) {

        console.error(e);

        showToast(
            '藍牙連線失敗：' +
            e.message
        );

    }

}


/* =========================================================
   接收 ESP32
========================================================= */

async function onBleEvent(event) {

    const value =
        new TextDecoder()
            .decode(
                event.target.value
            )
            .trim()
            .toUpperCase();


    console.log(
        "收到硬體訊號:",
        value
    );


    /* 模式切換 */

    if (
        value === "SWITCH_MODE_SENIOR" ||
        value === "MODE_SENIOR"
    ) {

        await switchMode(
            'senior',
            false
        );

        return;

    }


    if (
        value === "SWITCH_MODE_CHILD" ||
        value === "MODE_CHILD"
    ) {

        await switchMode(
            'child',
            false
        );

        return;

    }


    /*
        =================================================
        最重要的防護
        =================================================

        waitingForAction 在故事播放期間是 false。

        所以：

        ESP32 傳 SWIPE_LEFT
        ESP32 傳 SHAKE
        ESP32 傳 JUMP

        全部都會在這裡被擋掉。

        不會跳下一段。
    */

    if (
        !waitingForAction ||
        busy
    ) {

        console.log(
            "目前不能接受動作:",
            value
        );

        return;

    }


    const now =
        Date.now();


    if (
        now - lastActionTime < 2000
    ) {

        return;

    }


    const cleanExpected =
        (expectedAction || "")
            .trim()
            .toUpperCase();


    if (
        value === cleanExpected
    ) {

        lastActionTime =
            now;


        await handleAction(
            expectedAction
        );


    } else {

        /*
            錯誤動作不會換故事。
        */

        showToast(
            '❌ 收到 ' +
            value +
            '，目前需要：' +
            actionLabel(
                expectedAction
            )
        );


        $('actionSubText').textContent =
            '❌ 動作不正確，請再試一次。';


        stopSpeech();


        await speak(
            "失敗，再試一次。"
        );


        await speak(
            actionSpeechLabel(
                expectedAction
            )
        );


        /*
            說完失敗提示後，
            仍然保持原本的動作。
        */

        waitingForAction = true;

    }

}


/* =========================================================
   BLE 發送
========================================================= */

async function sendBLE(command) {

    if (!bleCharacteristic) {
        return;
    }


    try {

        const encoder =
            new TextEncoder();


        await bleCharacteristic
            .writeValue(
                encoder.encode(
                    command
                )
            );


    } catch (e) {

        console.error(
            'BLE 傳送失敗',
            e
        );

    }

}


/* =========================================================
   AI 回應解析
========================================================= */

async function parseAIResponse(res) {

    const rawData =
        await res.json();


    if (!res.ok) {

        throw new Error(
            rawData.error ||
            'AI 回應失敗'
        );

    }


    let content =
        rawData;


    if (
        rawData.choices &&
        rawData.choices[0] &&
        rawData.choices[0].message
    ) {

        content =
            rawData
                .choices[0]
                .message
                .content;

    }


    if (
        typeof content === 'string'
    ) {

        try {

            let cleanStr =
                content
                    .replace(
                        /```json/g,
                        ''
                    )
                    .replace(
                        /```/g,
                        ''
                    )
                    .trim();


            return JSON.parse(
                cleanStr
            );


        } catch (err) {

            return {

                story: content,

                action: null,

                done: true

            };

        }

    }


    return content;

}


/* =========================================================
   動作成功
========================================================= */

async function handleAction(action) {

    if (
        !waitingForAction ||
        busy
    ) {

        return;

    }


    /*
        先鎖起來。

        所以成功後等待 AI 回應期間，
        ESP32 也不能一直觸發。
    */

    waitingForAction = false;

    busy = true;

    expectedAction = "";


    $('actionSubText').textContent =
        '⏳ 動作完成，正在繼續...';


    await sendBLE(
        "ACTION_OK"
    );


    /*
        成功語音一定先講完。
    */

    stopSpeech();


    await speak(
        "成功！做得很好！"
    );


    try {

        let res;


        /*
            =================================================
            兒童：
            /api/action

            長輩：
            /api/action

            都不是 /api/story。
            =================================================
        */

        res =
            await fetch(
                WORKER_URL +
                '/api/action',
                {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({

                            mode:
                                currentMode,

                            topic:
                                selectedTheme,

                            difficulty:
                                selectedDifficulty,

                            action:
                                action,

                            currentStory:
                                currentStory,

                            history:
                                history

                        })

                }
            );


        const data =
            await parseAIResponse(
                res
            );


        /*
            -------------------------------
            長輩模式
            -------------------------------

            不把 AI story 當故事播放。

            只取得下一個健康動作。
        */

        if (
            currentMode === 'senior'
        ) {

            const nextAction =
                data.action;


            if (
                !nextAction ||
                data.done
            ) {

                $('actionPrompt')
                    .classList.remove(
                        'hidden'
                    );


                $('promptText').textContent =
                    '🎉 活動圓滿完成！';


                $('actionSubText').textContent =
                    '今天的健康活動已完成。';


                waitingForAction =
                    false;


            } else {

                $('actionPrompt')
                    .classList.remove(
                        'hidden'
                    );


                lockAction();


                await speak(
                    actionSpeechLabel(
                        nextAction
                    )
                );


                unlockAction(
                    nextAction
                );

            }


            return;

        }


        /*
            -------------------------------
            兒童模式
            -------------------------------

            這裡才接續故事。
        */

        const nextStory =
            data.story || "";


        currentStory =
            nextStory;


        history.push({

            role:
                "assistant",

            story:
                nextStory,

            action:
                data.action ||
                null

        });


        /*
            先顯示下一段，
            但先鎖定。
        */

        appendStory(

            '🤖 AI 繼續冒險',

            nextStory,

            null

        );


        $('actionPrompt')
            .classList.remove(
                'hidden'
            );


        lockAction();


        /*
            先完整念下一段故事。
        */

        await speak(
            nextStory
        );


        /*
            故事念完之後，
            才念動作提示。
        */

        if (
            !data.done &&
            data.action
        ) {

            await speak(
                actionSpeechLabel(
                    data.action
                )
            );


            /*
                動作提示也講完，
                現在才解鎖。
            */

            unlockAction(
                data.action
            );


            $('actionSubText').textContent =
                '完成動作後，故事會從目前劇情繼續。';


        } else {

            $('promptText').textContent =
                '🎉 太棒了！冒險任務完成！';


            $('actionSubText').textContent =
                '故事已完整結束。';


            waitingForAction =
                false;

        }


    } catch (e) {

        console.error(e);


        showToast(
            '連線失敗：' +
            e.message
        );


        /*
            如果取得下一段失敗，
            不讓它卡在「正在處理」。
        */

        waitingForAction =
            true;


        $('actionPrompt')
            .classList.remove(
                'hidden'
            );


        $('actionSubText').textContent =
            '⚠️ 取得下一段失敗，請再試一次。';


    } finally {

        busy =
            false;

    }

}


/* =========================================================
   開始故事 / 開始長輩活動
========================================================= */

async function generateStory() {

    if (busy) {
        return;
    }


    const custom =
        $('customTopicInput')
            .value
            .trim();


    const topic =
        custom ||
        selectedTheme;


    if (!topic) {

        showToast(
            '請先選擇或輸入主題'
        );

        return;

    }


    /*
        開始新的內容時，
        清掉上一段狀態。
    */

    stopSpeech();

    waitingForAction =
        false;

    expectedAction =
        "";

    currentStory =
        "";

    history =
        [];


    busy =
        true;


    const btn =
        $('btnGenerate');


    $('btnText').textContent =
        currentMode === 'senior'
            ? '正在規劃健康活動...'
            : 'AI 正在編寫冒險...';


    $('btnIcon').className =
        'fa-solid fa-spinner animate-spin';


    btn.disabled =
        true;


    try {

        const res =
            await fetch(
                WORKER_URL +
                '/api/story',
                {

                    method:
                        'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({

                            mode:
                                currentMode,

                            topic:
                                topic,

                            difficulty:
                                selectedDifficulty

                        })

                }
            );


        const data =
            await parseAIResponse(
                res
            );


        $('welcomeMessage')
            .classList.add(
                'hidden'
            );


        $('storyDisplay')
            .innerHTML =
            '';


        $('storyDisplay')
            .classList.remove(
                'hidden'
            );


        currentStory =
            data.story || "";


        history = [

            {
                role:
                    'user',

                topic:
                    topic

            },

            {
                role:
                    'assistant',

                story:
                    currentStory,

                action:
                    data.action

            }

        ];


        /*
            =================================================
            兒童模式
            =================================================
        */

        if (
            currentMode === 'child'
        ) {

            appendStory(

                '📖 AI 第一章',

                currentStory,

                null

            );


            /*
                先鎖。
            */

            $('actionPrompt')
                .classList.remove(
                    'hidden'
                );


            lockAction();


            /*
                故事完整播放。
            */

            await speak(
                currentStory
            );


            /*
                故事講完後才播放動作。
            */

            if (
                !data.done &&
                data.action
            ) {

                await speak(
                    actionSpeechLabel(
                        data.action
                    )
                );


                /*
                    動作語音也講完，
                    才正式解鎖。
                */

                unlockAction(
                    data.action
                );


                $('actionSubText').textContent =
                    '完成動作後，故事會接續目前劇情。';


            } else {

                $('promptText').textContent =
                    '🎉 內容已完成！';


                $('actionSubText').textContent =
                    '故事已完整結束。';


                waitingForAction =
                    false;

            }


            $('btnSpeak').disabled =
                false;


            /*
                告訴 ESP32 可以開始。
            */

            if (bleCharacteristic) {

                await sendBLE(
                    'START_STORY'
                );

            }

        }


        /*
            =================================================
            長輩模式
            =================================================
        */

        else {

            /*
                長輩模式不把 story 當故事念。

                storyDisplay 只顯示活動開始，
                避免變成繪本。
            */

            $('storyDisplay')
                .innerHTML = `

                    <div class="p-4 rounded-xl bg-slate-900/70 border border-slate-800">

                        <div class="text-xs font-bold text-emerald-300 mb-2">
                            🌿 健康活動
                        </div>

                        <p class="text-slate-200">
                            活動準備完成，請依照語音提示進行。
                        </p>

                    </div>

                `;


            $('actionPrompt')
                .classList.remove(
                    'hidden'
                );


            lockAction();


            /*
                先講活動開始。
            */

            await speak(
                "健康活動準備開始。"
            );


            if (
                !data.done &&
                data.action
            ) {

                await speak(
                    actionSpeechLabel(
                        data.action
                    )
                );


                unlockAction(
                    data.action
                );


                $('actionSubText').textContent =
                    '🟢 提示播放完畢，現在可以開始活動。';


            } else {

                $('promptText').textContent =
                    '🎉 活動準備完成！';


                waitingForAction =
                    false;

            }


            if (bleCharacteristic) {

                await sendBLE(
                    'START'
                );

            }

        }


        showToast(
            '✨ 內容生成完成！'
        );


    } catch (e) {

        console.error(e);


        showToast(
            '錯誤：' +
            e.message
        );


    } finally {

        $('btnText').textContent =
            currentMode === 'senior'
                ? '開始健康活動'
                : '開始精彩故事冒險';


        $('btnIcon').className =
            'fa-solid fa-wand-magic-sparkles';


        btn.disabled =
            false;


        busy =
            false;

    }

}


/* =========================================================
   DOM 初始化
========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    () => {


        $('btnConnect')
            .addEventListener(
                'click',
                connectBLE
            );


        $('btnGenerate')
            .addEventListener(
                'click',
                generateStory
            );


        bindThemeButtons();


        /*
            手動測試動作

            故事沒講完時也不能使用。
        */

        $('btnManualAction')
            .addEventListener(
                'click',
                async () => {

                    if (
                        !waitingForAction
                    ) {

                        showToast(
                            '🔒 請先等故事與動作提示播放完畢。'
                        );

                        return;

                    }


                    await handleAction(
                        expectedAction
                    );

                }
            );


        /*
            自訂主題時取消目前主題選擇。
        */

        $('customTopicInput')
            .addEventListener(
                'input',
                () => {

                    document
                        .querySelectorAll(
                            '.theme-btn'
                        )
                        .forEach(b => {

                            b.className =
                                'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold';

                        });

                }
            );


        /*
            再播放故事。

            重新播放期間再次鎖定動作。
        */

        $('btnSpeak')
            .addEventListener(
                'click',
                async () => {

                    if (
                        speechPlaying
                    ) {

                        stopSpeech();

                        return;

                    }


                    if (!currentStory) {
                        return;
                    }


                    /*
                        重新播放故事時，
                        暫時鎖住 ESP32。
                    */

                    const oldAction =
                        expectedAction;


                    lockAction();


                    await speak(
                        currentStory
                    );


                    if (
                        oldAction
                    ) {

                        await speak(
                            actionSpeechLabel(
                                oldAction
                            )
                        );


                        unlockAction(
                            oldAction
                        );

                    }

                }
            );

    }
);

</script>
