<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聲動奇境 - ESP32 藍牙繪本裝置</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; margin-top: 0; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .card {
            background: #334155;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 8px;
        }
        .status-indicator.connected { background: #22c55e; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-secondary { background: #475569; color: white; }
        .log-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            height: 120px;
            overflow-y: auto;
            color: #34d399;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔮 藍牙繪本裝置</h1>
    
    <div class="card">
        <h3>連線狀態</h3>
        <p style="display: flex; align-items: center; margin: 8px 0;">
            <span id="statusDot" class="status-indicator"></span>
            <span id="statusText">尚未連線</span>
        </p>
        <button id="connectBtn" class="btn-primary" onclick="toggleConnection()">連接故事裝置</button>
    </div>

    <div class="card">
        <h3>測試 / 手動觸發模式</h3>
        <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 0;">可手動點擊送出 SWIPE 信號或觸發震動。</p>
        <button class="btn-secondary" onclick="sendSwipeSignal()">⚡ 手動觸發 SWIPE 揮動</button>
    </div>

    <div class="card">
        <h3>即時通訊紀錄</h3>
        <div id="logBox" class="log-box">等待藍牙指令與狀態...</div>
    </div>
</div>

<script>
    // Web Bluetooth UUID 宣告 (需與 ESP32 端一致)
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26aae";

    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    function log(message) {
        const box = document.getElementById("logBox");
        box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${message}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    async function toggleConnection() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            await bluetoothDevice.gatt.disconnect();
            updateConnectionState(false);
            log("已中斷藍牙連線");
            return;
        }

        try {
            log("正在搜尋 ESP32 藍牙裝置...");
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "SmartStory" }, { namePrefix: "ESP32" }],
                optionalServices: [SERVICE_UUID]
            });

            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            log("正在連線到 GATT 伺服器...");
            const server = await bluetoothDevice.gatt.connect();

            log("正在尋找服務與特徵值...");
            const service = await server.getPrimaryService(SERVICE_UUID);
            bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            // 啟用通知以接收來自 ESP32 的訊息
            await bluetoothCharacteristic.startNotifications();
            bluetoothCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

            updateConnectionState(true);
            log("藍牙連線成功！");

        } catch (error) {
            log("連線失敗: " + error);
            console.error(error);
            updateConnectionState(false);
        }
    }

    function updateConnectionState(isConnected) {
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");
        const btn = document.getElementById("connectBtn");

        if (isConnected) {
            dot.classList.add("connected");
            text.innerText = "已連線";
            btn.innerText = "中斷連線";
            btn.style.background = "#ef4444";
        } else {
            dot.classList.remove("connected");
            text.innerText = "尚未連線";
            btn.innerText = "連接故事裝置";
            btn.style.background = "#3b82f6";
            bluetoothCharacteristic = null;
        }
    }

    function onDisconnected() {
        log("裝置已斷線");
        updateConnectionState(false);
    }

    function handleNotifications(event) {
        const value = new TextDecoder().decode(event.target.value);
        log(`收到硬體訊號: ${value}`);
        if (value.includes("SWIPE")) {
            // 觸發後續動作
            triggerStoryAdvance();
        }
    }

    async function sendSwipeSignal() {
        if (!bluetoothCharacteristic) {
            log("錯誤：尚未連接藍牙裝置");
            alert("請先連接故事裝置！");
            return;
        }
        try {
            const encoder = new TextEncoder();
            await bluetoothCharacteristic.writeValue(encoder.encode("TRIGGER_HAPTIC"));
            log("已發送震動/觸發信號至 ESP32");
        } catch (error) {
            log("發送失敗: " + error);
        }
    }

    function triggerStoryAdvance() {
        log("觸發故事換頁 / 推進劇情！");
    }
</script>

</body>
</html>
