<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D24">
<title>聲動奇境｜關燈，開始說故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;800&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --dusk:#2B2A5C; --plum:#5A3F8E; --peach:#FFB48A; --cream:#FFF7E6; --paper-line:#EBDDBF;
  --moon:#FFD86B; --mint:#8FE8CC; --berry:#FF7E96; --ink:#2B2A5C; --soft:#6E6C92;
  --story:"Huninn","Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --round:"Chiron GoRound TC","Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --ui:"Chiron GoRound TC","Huninn",system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--ui);font-weight:500;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}

/* ── 夥伴的臉：兩顆會眨、會變表情的眼睛。準備畫面的小機器人和故事畫面的大臉共用 ── */
.face{position:relative;--glow:0}
.face .eye{position:absolute;top:.5em;width:1.5em;height:1.9em;border-radius:.62em;background:var(--moon);border:.3em solid transparent;
  box-shadow:0 0 calc(.5em + 1.1em*var(--glow)) rgba(255,216,107,calc(.35 + .5*var(--glow)));
  transition:width .3s,height .3s,top .3s,border-radius .3s,transform .3s,background-color .3s;animation:blink 5.2s infinite}
.face .eye.l{left:.5em}.face .eye.r{right:.5em;animation-delay:.06s}
@keyframes blink{0%,93%,100%{scale:1 1}96%{scale:1 .12}}
.face[data-emo=happy] .eye,.face[data-emo=proud] .eye{width:1.75em;height:1.7em;top:.8em;border-radius:50%;background:transparent;border-top-color:var(--moon);box-shadow:none;animation:none}
.face[data-emo=proud] .eye{transform:translateY(-.12em) scale(1.08)}
.face[data-emo=excited] .eye{width:1.7em;height:1.9em;top:.45em;border-radius:50%}
.face[data-emo=surprised] .eye{width:1.75em;height:1.75em;top:.55em;border-radius:50%;animation:none}
.face[data-emo=worried] .eye{height:1.6em;top:.7em}
.face[data-emo=worried] .eye.l{transform:rotate(14deg)}.face[data-emo=worried] .eye.r{transform:rotate(-14deg)}
.face[data-emo=sad] .eye{height:1.3em;top:.95em;border-radius:.5em .5em .7em .7em}
.face[data-emo=sad] .eye.l{transform:rotate(-16deg)}.face[data-emo=sad] .eye.r{transform:rotate(16deg)}
.face[data-emo=calm] .eye{height:1em;top:1.1em;border-radius:.45em}
.face[data-emo=scared] .eye{width:1.1em;height:1.1em;top:.9em;border-radius:50%;animation:shiver .22s infinite}
.face[data-emo=scared] .eye.l{left:.8em}.face[data-emo=scared] .eye.r{right:.8em}
@keyframes shiver{0%,100%{transform:translateX(-.03em)}50%{transform:translateX(.03em)}}
.face.thinking .eye{animation:look 2.6s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(-.22em)}50%{transform:translateX(.22em)}}
.face.moving{animation:hop .5s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-.22em)}}
/* 眼睛會到處看（--lx/--ly 由程式隨機設定）；偶爾連眨兩下 */
.face .eye{translate:var(--lx,0) var(--ly,0);transition:width .3s,height .3s,top .3s,border-radius .3s,transform .3s,background-color .3s,translate .45s ease}
.face.blink2 .eye{animation:blink2 .5s 1}
@keyframes blink2{0%,100%{scale:1 1}20%,60%{scale:1 .1}40%{scale:1 1}}
/* 臉頰：開心的時候紅紅的 */
.face .cheek{position:absolute;top:2.3em;width:.95em;height:.45em;border-radius:50%;background:#FF7E96;opacity:0;filter:blur(1.5px);transition:opacity .4s}
.face .cheek.l{left:.15em}.face .cheek.r{right:.15em}
.face[data-emo=happy] .cheek,.face[data-emo=proud] .cheek,.face[data-emo=excited] .cheek{opacity:.6}
/* 嘴巴：表情不同形狀不同；說話時一開一合（--open 由程式控制） */
.face .mouth{position:absolute;left:50%;translate:-50% 0;top:2.35em;width:1.1em;height:.6em;box-sizing:border-box;border:.2em solid transparent;border-bottom-color:var(--moon);border-radius:50%;
  transition:width .2s,height .2s,top .2s,border-radius .2s,background-color .2s}
.face[data-emo=happy] .mouth,.face[data-emo=proud] .mouth{width:1.7em;height:.95em;top:2.15em}
.face[data-emo=excited] .mouth{width:1.4em;height:.7em;top:2.65em;border:0;background:var(--moon);border-radius:.1em .1em .9em .9em}
.face[data-emo=surprised] .mouth,.face[data-emo=scared] .mouth{width:.7em;height:.8em;top:2.6em;border:.2em solid var(--moon);border-radius:50%}
.face[data-emo=worried] .mouth{width:1em;height:.2em;top:2.95em;border:0;background:var(--moon);border-radius:.1em;transform:rotate(-7deg)}
.face[data-emo=sad] .mouth{width:1.2em;height:.7em;top:2.85em;border-color:transparent;border-top-color:var(--moon)}
.face.talking .mouth{width:1.15em;top:2.55em;height:calc(.18em + .72em*var(--open,0));border:0;background:var(--moon);border-radius:.6em;transform:none;transition:height .07s linear}

/* ── 準備畫面：黃昏的天空，下面是一張米色的紙 ── */
.sky{position:relative;height:292px;overflow:hidden;color:#FFF7E6;
  background:linear-gradient(180deg,#2B2A5C 0%,#4A3A86 38%,#8A4F96 66%,#F09E82 90%,#FFC59A 100%)}
.sky .star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#FFF3C4;opacity:.85;animation:twinkle 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes twinkle{0%,100%{opacity:.85}50%{opacity:.25}}
.sky .crescent{position:absolute;right:30px;top:calc(26px + env(safe-area-inset-top));width:54px;height:54px;border-radius:50%;box-shadow:-13px 8px 0 0 var(--moon);transform:rotate(-18deg)}
.sky .hills{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:112px;display:block}
.titles{position:relative;max-width:560px;margin:0 auto;padding:calc(34px + env(safe-area-inset-top)) 24px 0}
.mark{font-family:var(--story);font-weight:700;font-size:2.9rem;letter-spacing:.08em;margin:0;line-height:1.15;text-shadow:0 3px 0 rgba(27,24,66,.35)}
.lede{font-family:var(--story);font-size:1.18rem;margin:8px 0 0;color:#FFE9C9}
.buddy{position:absolute;right:max(26px,calc(50% - 250px));bottom:20px;width:104px;height:84px;border-radius:30px 30px 26px 26px;background:#211F4D;border:4px solid #FFF7E6;font-size:22px;animation:peek 4.5s ease-in-out infinite}
.buddy::before{content:"";position:absolute;left:50%;top:-20px;width:4px;height:18px;margin-left:-2px;background:#FFF7E6;border-radius:2px}
.buddy::after{content:"";position:absolute;left:50%;top:-30px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--berry)}
@keyframes peek{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}

#setup main{max-width:560px;margin:0 auto;padding:6px 22px calc(44px + env(safe-area-inset-bottom))}
.ask{font-family:var(--story);font-weight:700;font-size:1.5rem;margin:0 0 10px;display:block}
#idea{display:block;width:100%;min-height:100px;resize:none;border:3px solid #FFD3DC;border-radius:26px;padding:16px 20px;background:#fff;
  font-family:var(--story);font-size:1.4rem;line-height:1.6;color:var(--ink);box-shadow:0 5px 0 #FFD3DC;transition:border-color .15s,box-shadow .15s}
#idea::placeholder{color:#B5AA90}
#idea:focus{border-color:var(--berry);box-shadow:0 5px 0 var(--berry);outline:none}
.ideas{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 30px;padding:0;list-style:none}
.ideas button{font-family:var(--story);font-size:1.04rem;line-height:1.4;padding:8px 14px;border-radius:999px;background:#fff;border:2px solid var(--paper-line);box-shadow:0 3px 0 var(--paper-line);transition:transform .12s,box-shadow .12s}
.ideas li:nth-child(4n+1) button{background:#FFE7EC;border-color:#FFC6D1;box-shadow:0 3px 0 #FFC6D1}
.ideas li:nth-child(4n+2) button{background:#E2F8F0;border-color:#B6EBD9;box-shadow:0 3px 0 #B6EBD9}
.ideas li:nth-child(4n+3) button{background:#FFF1CC;border-color:#F6DC94;box-shadow:0 3px 0 #F6DC94}
.ideas li:nth-child(4n+4) button{background:#EAE6FF;border-color:#CEC6F7;box-shadow:0 3px 0 #CEC6F7}
.ideas button:active{transform:translateY(3px);box-shadow:none}

.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:2px dashed var(--paper-line)}
.field>span:first-child{font-family:var(--story);font-size:1.16rem;font-weight:700}
.ages{display:flex;gap:8px}
.ages button{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--paper-line);font-family:var(--story);font-weight:700;font-size:1.25rem}
.ages button[aria-pressed=true]{background:var(--berry);border-color:var(--berry);color:#fff;transform:scale(1.08)}
.band{border-bottom:2px dashed var(--paper-line);margin-bottom:26px}
.field small{display:block;font-family:var(--ui);font-weight:400;font-size:.82rem;color:var(--soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#D9CDB0;margin-right:7px}
.dot.on{background:#39C99B;box-shadow:0 0 0 4px #D2F5E8}
.ghost{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 16px;min-height:48px;white-space:nowrap;font-weight:600;box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.ghost:active{transform:translateY(3px);box-shadow:none}

/* 最大的按鈕本身就是「夜晚」：按下去，燈就關了 */
#begin{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:72px;border-radius:24px;
  background:var(--dusk);color:var(--moon);font-family:var(--story);font-weight:700;font-size:1.5rem;letter-spacing:.05em;
  box-shadow:0 6px 0 #17163A,0 14px 26px rgba(43,42,92,.28);transition:transform .12s,box-shadow .12s}
#begin::before{content:"";width:26px;height:26px;border-radius:50%;box-shadow:-7px 4px 0 0 var(--moon);transform:rotate(-18deg) translate(4px,-4px)}
#begin:active{transform:translateY(5px);box-shadow:0 1px 0 #17163A}
#notice{min-height:1.7em;margin:14px 0 0;color:#C2334F;font-size:.95rem;font-weight:600}

.how{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:how}
.how li{counter-increment:how;position:relative;background:#fff;border:2px solid var(--paper-line);border-radius:18px;padding:30px 10px 12px;text-align:center;font-family:var(--story);font-size:1rem;line-height:1.45}
.how li::before{content:counter(how);text-align:center;position:absolute;left:50%;top:-14px;margin-left:-15px;width:30px;height:30px;line-height:30px;border-radius:50%;background:var(--moon);font-weight:700;font-family:var(--ui);font-size:.95rem}
.past{margin-top:28px}
.past h2,.grown summary{font-family:var(--story);font-size:1.16rem;font-weight:700;margin:0 0 8px}
.past ul{list-style:none;margin:0;padding:0}
.past li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:2px dashed var(--paper-line);font-family:var(--story);font-size:1.06rem}
.past li span:first-child{flex:1;min-width:0}
.past li .moved{font-family:var(--ui);font-size:.8rem;color:var(--soft);white-space:nowrap}
.past li .replay{flex:none;font-family:var(--round);font-weight:800;font-size:.85rem;color:#2B2A5C;background:var(--moon);border:0;border-radius:999px;padding:6px 12px;cursor:pointer;align-self:center}
.grown{margin-top:26px;background:#fff;border:2px solid var(--paper-line);border-radius:22px;padding:4px 18px}
.grown summary{cursor:pointer;margin:0;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
.grown summary::-webkit-details-marker{display:none}
.grown summary::after{content:"＋";color:var(--berry);font-size:1.3rem;line-height:1}
.grown[open] summary::after{content:"－"}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:2px dashed var(--paper-line)}
.sw b{display:block;font-family:var(--round);font-weight:800;font-size:1.06rem}
.sw small{display:block;color:var(--soft);font-size:.84rem;line-height:1.5}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:56px;height:32px;margin:0;border-radius:999px;background:#E8DEC6;position:relative;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(43,42,92,.25);transition:transform .2s}
.sw input:checked{background:var(--berry)}
.sw input:checked::after{transform:translateX(24px)}
.seg{display:flex;gap:6px;flex:none}
.seg button{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--paper-line)}
.seg button[aria-pressed=true]{background:var(--berry);border-color:var(--berry);color:#fff}
.grown p{font-family:var(--story);font-size:.95rem;color:var(--soft);margin:0;padding:14px 0;border-top:2px dashed var(--paper-line)}
.grown a{color:var(--ink)}

/* ── 故事畫面：燈關掉，只剩夥伴的眼睛 ── */
#stage{position:fixed;inset:0;color:#CFC8B4;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 36%,#1C1748 0,#0B0A22 52%,#000 100%);
  padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);touch-action:manipulation;user-select:none;-webkit-user-select:none;animation:lightsOff 1.1s ease-out both}
/* 夜空的小星星，慢慢閃 */
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;animation:twinkle 6s ease-in-out infinite;
  background:radial-gradient(1.6px 1.6px at 10% 16%,#FFF3C4,transparent 70%),radial-gradient(1.4px 1.4px at 26% 72%,#C9F6FF,transparent 70%),
  radial-gradient(1.8px 1.8px at 84% 14%,#FFF3C4,transparent 70%),radial-gradient(1.3px 1.3px at 70% 64%,#FFD3F0,transparent 70%),
  radial-gradient(1.5px 1.5px at 45% 9%,#fff,transparent 70%),radial-gradient(1.3px 1.3px at 92% 48%,#C9F6FF,transparent 70%),
  radial-gradient(1.5px 1.5px at 6% 52%,#FFD3F0,transparent 70%),radial-gradient(1.2px 1.2px at 58% 86%,#fff,transparent 70%)}
#stage>*{position:relative}
#stage>#hush,#stage>#sheet,#stage>#resume{position:absolute}
@keyframes lightsOff{from{opacity:0;filter:brightness(2.2)}to{opacity:1;filter:none}}

/* ── 機器人夥伴：RGB 外框的頭、會擺的手、天線燈 ── */
.bot{font-size:clamp(24px,7.5vw,34px);margin:-30px 0 0;animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
.bot .head{position:relative;z-index:2;padding:.45em .55em .5em;border-radius:1.4em;border:.13em solid transparent;
  background:linear-gradient(#100F2C,#100F2C) padding-box,var(--rgb) border-box;background-size:100% 100%,300% 100%;
  animation:rgbborder 6s linear infinite,headglow 6s linear infinite}
@keyframes headglow{0%,100%{box-shadow:0 0 28px rgba(62,230,255,.32),inset 0 0 20px rgba(62,230,255,.1)}33%{box-shadow:0 0 28px rgba(139,108,255,.38),inset 0 0 20px rgba(139,108,255,.12)}66%{box-shadow:0 0 28px rgba(255,95,200,.32),inset 0 0 20px rgba(255,95,200,.1)}}
/* 機器人的眼睛和嘴巴：青白色的螢幕光 */
.bot .face{--moon:#A6F4FF;width:5.2em;height:3.6em}
.bot .face .eye{box-shadow:0 0 calc(.45em + 1em*var(--glow)) rgba(110,230,255,calc(.5 + .45*var(--glow)))}
.bot .face[data-emo=happy] .eye,.bot .face[data-emo=proud] .eye{box-shadow:none}
/* 準備畫面的小機器人：同一隻，比較小，坐在山坡上跟你揮手 */
.bot.mini{position:absolute;z-index:2;right:max(34px,calc(50% - 250px));bottom:40px;margin:0;font-size:17px}
@media (min-width:700px){.bot.mini{font-size:21px;bottom:46px}}
.bot .ant{position:absolute;z-index:1;left:50%;top:-.95em;width:.14em;height:1em;margin-left:-.07em;background:#3F3B7A;border-radius:.1em;transform-origin:50% 100%;animation:antwig 2.6s ease-in-out infinite}
.bot .ant::after{content:"";position:absolute;left:50%;top:-.4em;width:.48em;height:.48em;margin-left:-.24em;border-radius:50%;animation:rgbfill 6s linear infinite;box-shadow:0 0 12px 3px rgba(255,255,255,.3)}
@keyframes antwig{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.bot .arm{position:absolute;z-index:1;top:1.55em;width:.46em;height:1.75em;border-radius:.3em;background:#2E2A66;border:.08em solid #4E49A0;transform-origin:50% .2em;
  transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.bot .arm::after{content:"";position:absolute;left:50%;bottom:-.32em;width:.62em;height:.62em;margin-left:-.31em;border-radius:50%;animation:rgbfill 6s linear infinite;box-shadow:0 0 10px rgba(255,255,255,.35)}
.bot .arm.l{left:-.5em;transform:rotate(28deg)}.bot .arm.r{right:-.5em;transform:rotate(-28deg)}
#face{width:5.2em;height:3.6em;font-size:1em}
/* 機器人示範的動作（跟著 DEMO 指令換） */
.bot[data-pose=up] .arm.l{transform:rotate(165deg)}.bot[data-pose=up] .arm.r{transform:rotate(-165deg)}
.bot[data-pose=down] .arm.l{transform:rotate(3deg)}.bot[data-pose=down] .arm.r{transform:rotate(-3deg)}
.bot[data-pose=down]{animation:squat 1.2s ease-in-out infinite}
@keyframes squat{0%,100%{transform:translateY(0)}50%{transform:translateY(8px) scale(1.02,.97)}}
.bot[data-pose=ask] .arm.l{transform:rotate(92deg)}.bot[data-pose=ask] .arm.r{transform:rotate(-92deg)}
.bot[data-pose=ask]{animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.bot[data-pose=freeze] .arm.l{transform:rotate(45deg)}.bot[data-pose=freeze] .arm.r{transform:rotate(-45deg)}
.bot[data-pose=freeze]{animation:none}
.bot[data-pose=shake] .arm.l,.bot[data-pose=swim] .arm.l{animation:altL .55s ease-in-out infinite alternate}
.bot[data-pose=shake] .arm.r,.bot[data-pose=swim] .arm.r{animation:altR .55s ease-in-out infinite alternate-reverse}
@keyframes altL{from{transform:rotate(25deg)}to{transform:rotate(165deg)}}
@keyframes altR{from{transform:rotate(-25deg)}to{transform:rotate(-165deg)}}
.bot[data-pose=flap] .arm.l{animation:flapL .32s ease-in-out infinite alternate}.bot[data-pose=flap] .arm.r{animation:flapR .32s ease-in-out infinite alternate}
@keyframes flapL{from{transform:rotate(45deg)}to{transform:rotate(125deg)}}
@keyframes flapR{from{transform:rotate(-45deg)}to{transform:rotate(-125deg)}}
.bot[data-pose=swing]{animation:runhop .36s ease-in-out infinite}
.bot[data-pose=swing] .arm.l{animation:swingL .36s ease-in-out infinite alternate}.bot[data-pose=swing] .arm.r{animation:swingR .36s ease-in-out infinite alternate}
@keyframes runhop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes swingL{from{transform:rotate(-10deg)}to{transform:rotate(55deg)}}
@keyframes swingR{from{transform:rotate(-55deg)}to{transform:rotate(10deg)}}
.bot[data-pose=wave] .arm.r{animation:waveR .3s ease-in-out infinite alternate}
@keyframes waveR{from{transform:rotate(-130deg)}to{transform:rotate(-170deg)}}
.bot[data-pose=cheer]{animation:runhop .45s ease-in-out infinite}
.bot[data-pose=cheer] .arm.l{animation:cheerL .45s ease-in-out infinite alternate}.bot[data-pose=cheer] .arm.r{animation:cheerR .45s ease-in-out infinite alternate}
@keyframes cheerL{from{transform:rotate(140deg)}to{transform:rotate(170deg)}}
@keyframes cheerR{from{transform:rotate(-140deg)}to{transform:rotate(-170deg)}}
.bot[data-pose=jump]{animation:botjump .8s cubic-bezier(.3,0,.4,1) infinite}
.bot[data-pose=jump] .arm.l{transform:rotate(150deg)}.bot[data-pose=jump] .arm.r{transform:rotate(-150deg)}
@keyframes botjump{0%,100%{transform:translateY(0) scale(1.04,.95)}45%{transform:translateY(-34px) scale(.97,1.04)}}
.bot[data-pose=twist],.bot[data-pose=steer]{animation:rock .5s ease-in-out infinite alternate}
.bot[data-pose=twist] .arm.l,.bot[data-pose=steer] .arm.l{transform:rotate(70deg)}.bot[data-pose=twist] .arm.r,.bot[data-pose=steer] .arm.r{transform:rotate(-70deg)}
@keyframes rock{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.bot[data-pose=stir] .arm.r{animation:stirR .5s linear infinite}
@keyframes stirR{0%{transform:rotate(-70deg)}25%{transform:rotate(-95deg)}50%{transform:rotate(-110deg)}75%{transform:rotate(-95deg)}100%{transform:rotate(-70deg)}}
.bot[data-pose=nudge]{animation:nudge .5s ease-in-out 2}
@keyframes nudge{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(-8px) rotate(-6deg)}70%{transform:translateX(8px) rotate(6deg)}}

/* 進度條：孩子動的時候，彩虹慢慢填滿 */
#meter{width:min(240px,62vw);height:12px;margin-top:26px;border-radius:99px;background:#1A1838;border:1px solid #2E2B5C;overflow:hidden;opacity:0;transition:opacity .3s}
#meter.on{opacity:1}
#meterFill{display:block;height:100%;width:0;border-radius:inherit;background:var(--rgb);background-size:300% 100%;animation:rgbflow 4s linear infinite;transition:width .25s linear;box-shadow:0 0 12px rgba(255,255,255,.4)}
#caption{width:100%;max-width:540px;min-height:5.4em;text-align:center;font-family:var(--story);font-size:1.22rem;line-height:1.8;color:#E4DCC6;margin:22px 0 0;
  padding:12px 18px;border-radius:20px;background:rgba(22,20,56,.6);border:1px solid #2E2B5C}
/* 選路：左青、右粉，跟兩顆實體按鈕一左一右 */
#fork{width:100%;max-width:540px;display:flex;gap:14px;justify-content:center;margin-top:28px}
#fork button{flex:1;min-height:110px;border:3px solid;border-radius:24px;background:#12112A;font-family:var(--story);font-size:1.2rem;color:#F2EEFF;padding:10px 8px;line-height:1.4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s}
#fork button[data-choice=left]{border-color:#00E5FF;animation:pulseL 1.8s ease-in-out infinite}
#fork button[data-choice=right]{border-color:#FF3DA6;animation:pulseR 1.8s ease-in-out infinite .9s}
@keyframes pulseL{0%,100%{box-shadow:0 0 10px rgba(0,229,255,.25)}50%{box-shadow:0 0 30px rgba(0,229,255,.6)}}
@keyframes pulseR{0%,100%{box-shadow:0 0 10px rgba(255,61,166,.25)}50%{box-shadow:0 0 30px rgba(255,61,166,.6)}}
#fork button:active{transform:scale(.96)}
#fork .arrow{font-size:1.5rem;line-height:1}
#fork button[data-choice=left] .arrow{color:#00E5FF}#fork button[data-choice=right] .arrow{color:#FF3DA6}
#fork small{display:block;font-family:var(--ui);font-size:.76rem;color:#9C98C4;margin-top:2px}
#hush{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;color:#55526F;font-size:.82rem;margin:0}
#sheet{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#1B1A3D;border:2px solid #3A3870;border-radius:22px;padding:14px;color:#EDE6D0}
#sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheet button{border:2px solid #3A3870;border-radius:14px;min-height:50px;padding:8px;background:#232150}
#sheet button.hold{grid-column:1/-1;background:#2E2B6B;border-color:#57539E}
#sheet p{margin:10px 2px 0;color:#9C98C4;font-size:.78rem}
#resume{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center}
#resume button{font-family:var(--story);font-weight:700;font-size:1.4rem;color:#2B2A5C;background:var(--moon);border-radius:22px;padding:18px 30px}

/* ── 結束畫面：天亮了 ── */
#finale{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;color:#FFF7E6;
  background:linear-gradient(180deg,#2B2A5C 0%,#6A4594 42%,#F09E82 80%,#FFD9A8 100%);animation:dawn 1.4s ease-out both}
@keyframes dawn{from{opacity:0}to{opacity:1}}
#finale .face{width:5.2em;height:3.2em;font-size:30px}
#finale h2{font-family:var(--story);font-size:2.4rem;margin:8px 0 2px;text-shadow:0 3px 0 rgba(27,24,66,.35)}
#finale .title{font-family:var(--story);font-size:1.2rem;margin:0 0 4px;color:#FFE9C9}
#bye{font-family:var(--story);font-size:1.5rem;margin:0 0 22px}
#stat{display:inline-block;background:rgba(255,247,230,.92);color:var(--ink);font-family:var(--story);font-size:1.08rem;border-radius:999px;padding:8px 18px;margin:0 0 26px}
#stat:empty{display:none}
#again{background:var(--cream);color:var(--ink);border-radius:20px;min-height:60px;padding:12px 28px;font-family:var(--story);font-weight:700;font-size:1.25rem;box-shadow:0 5px 0 #D9B98E}
#again:active{transform:translateY(5px);box-shadow:none}

.mark,.ask,.field>span:first-child,.ages button,.seg button,#begin,.ghost,.past h2,.grown summary,#resume button,#again,#finale h2,.how li::before{font-family:var(--round);font-weight:800}

/* ── RGB 電競燈：慢慢流動的彩虹，不閃爍 ── */
/* 只用一組「夕陽霓虹」顏色：青、紫、粉、桃（和天空的顏色同一家），只放在幾個重點，其他地方保持安靜 */
:root{--c1:#3EE6FF;--c2:#8B6CFF;--c3:#FF5FC8;--c4:#FFB070;
  --rgb:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1))}
@keyframes rgbflow{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes rgbborder{from{background-position:0 0,0% 50%}to{background-position:0 0,200% 50%}}
@keyframes rgbedge{0%,100%{border-color:var(--c1)}25%{border-color:var(--c2)}50%{border-color:var(--c3)}75%{border-color:var(--c4)}}
@keyframes rgbfill{0%,100%{background-color:var(--c1)}25%{background-color:var(--c2)}50%{background-color:var(--c3)}75%{background-color:var(--c4)}}
@keyframes rgbglow{0%,100%{box-shadow:0 6px 0 #17163A,0 0 24px rgba(62,230,255,.45)}25%{box-shadow:0 6px 0 #17163A,0 0 24px rgba(139,108,255,.5)}50%{box-shadow:0 6px 0 #17163A,0 0 24px rgba(255,95,200,.45)}75%{box-shadow:0 6px 0 #17163A,0 0 24px rgba(255,176,112,.45)}}
/* 標題、結束畫面：漸層字，慢慢流動 */
.mark,#finale h2{background:var(--rgb);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 3px 0 rgba(20,18,50,.5));animation:rgbflow 10s linear infinite}
/* 開始按鈕：霓虹邊框＋柔和光暈 */
#begin{border:3px solid transparent;background:linear-gradient(var(--dusk),var(--dusk)) padding-box,var(--rgb) border-box;background-size:100% 100%,200% 100%;
  animation:rgbborder 6s linear infinite,rgbglow 8s linear infinite}
/* 選到的年紀、靈敏度：深色底＋霓虹框，字看得清楚 */
.ages button[aria-pressed=true],.seg button[aria-pressed=true]{color:#fff;border:3px solid transparent;transform:scale(1.08);
  background:linear-gradient(#26225A,#26225A) padding-box,var(--rgb) border-box;background-size:100% 100%,200% 100%;animation:rgbborder 6s linear infinite;box-shadow:0 0 14px rgba(139,108,255,.45)}
.sw input:checked{background:linear-gradient(90deg,var(--c2),var(--c3))}
#idea:focus{border-color:var(--c1)}
#finale h2{filter:drop-shadow(0 3px 0 rgba(20,18,50,.6)) drop-shadow(0 0 3px rgba(20,18,50,.45))}

/* ── 深色電競主題：取代原本的米色，讓 RGB 燈光更亮 ── */
:root{--cream:#0E0D24;--ink:#F2EEFF;--soft:#A7A2D2;--paper-line:#2E2B5C;--card:#17153A;--card-2:#1F1C4A}
body{background:#0E0D24 radial-gradient(circle at 12% 30%,rgba(191,90,242,.16),transparent 38%) fixed,
  radial-gradient(circle at 90% 75%,rgba(0,229,255,.10),transparent 40%) fixed;background-color:#0E0D24}
#idea{background:var(--card);border-color:#3A3670;box-shadow:0 5px 0 #3A3670;color:var(--ink)}
#idea::placeholder{color:#6E69A0}
#idea:focus{box-shadow:0 5px 0 #3A3670,0 0 18px rgba(0,229,255,.25)}
/* 靈感按鈕：統一的深色小卡，碰到時才亮起來 */
.ideas button{background:var(--card)!important;color:var(--ink);border-color:#3A3670!important;box-shadow:0 3px 0 #2A2754!important;transition:transform .12s,border-color .2s,box-shadow .2s}
.ideas button:hover,.ideas button:focus-visible{border-color:var(--c1)!important;box-shadow:0 3px 0 #2A2754,0 0 14px rgba(62,230,255,.3)!important}
.ideas button:active{box-shadow:none!important}
.ages button,.seg button{background:var(--card);border-color:#3A3670;color:var(--ink)}
.ghost{background:var(--card);border-color:var(--c1);color:var(--ink);box-shadow:0 3px 0 #1E8FA3,0 0 12px rgba(62,230,255,.2)}
.how li,.grown{background:var(--card);border-color:#2E2B5C}
.how li::before{color:#1B1940}
.sw input{background:#3A3670}
#notice{color:#FF6B86}
/* 結束畫面：夜空，彩虹字 */
#finale{background:radial-gradient(circle at 50% 30%,#2A2066 0,#0E0D24 70%);color:var(--ink)}
#finale .title{color:#C9C3F2}
#stat{background:var(--card-2);color:var(--ink);border:2px solid #3A3670}
#again{background:var(--card);color:var(--ink);border:3px solid transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,var(--rgb) border-box;background-size:100% 100%,300% 100%;
  animation:rgbborder 6s linear infinite;box-shadow:0 0 18px rgba(0,229,255,.25)}
#again:active{transform:translateY(3px)}
@media (max-width:400px){.mark{font-size:2.5rem}.how{grid-template-columns:1fr}.how li{padding:14px 12px 12px 52px;text-align:left}.how li::before{left:12px;top:50%;margin:-15px 0 0}.ages button{width:44px;height:44px}}
@media (min-width:700px){.sky{height:330px}.mark{font-size:3.4rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="setup">
  <header class="sky">
    <i class="star" style="--x:9%;--y:16%;--s:4px"></i><i class="star" style="--x:24%;--y:52%;--s:3px;--d:.8s"></i><i class="star" style="--x:41%;--y:11%;--s:3px;--d:1.6s"></i>
    <i class="star" style="--x:58%;--y:34%;--s:4px;--d:.4s"></i><i class="star" style="--x:71%;--y:58%;--s:3px;--d:2.1s"></i><i class="star" style="--x:88%;--y:44%;--s:3px;--d:1.1s"></i>
    <i class="star" style="--x:15%;--y:70%;--s:3px;--d:2.6s"></i><i class="star" style="--x:50%;--y:62%;--s:2px;--d:1.9s"></i>
    <div class="crescent" aria-hidden="true"></div>
    <div class="titles">
      <h1 class="mark">聲動奇境</h1>
      <p class="lede">放下手機，跟故事一起動起來。</p>
    </div>
    <svg class="hills" viewBox="0 0 400 112" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 62 Q70 18 150 54 T300 44 T400 30 V112 H0Z" fill="#3B3276"/>
      <path d="M0 92 Q90 50 190 84 T400 66 V112 H0Z" fill="#0E0D24"/>
    </svg>
    <div class="bot mini" id="buddy" data-pose="wave" aria-hidden="true">
      <i class="ant"></i><i class="arm l"></i><i class="arm r"></i>
      <div class="head"><div class="face" data-emo="happy"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i></div></div>
    </div>
  </header>

  <main>
    <label class="ask" for="idea">今天想聽什麼故事？</label>

      <li><button type="button" data-idea="月亮上的麵包店少了一顆星星">🥐 月亮上的麵包店</button></li>
      <li><button type="button" data-idea="不敢睡覺的小貓頭鷹">🦉 不敢睡覺的貓頭鷹</button></li>
      <li><button type="button" data-idea="">🎲 讓故事自己決定</button></li>
    </ul>

    <div class="field">
      <span>孩子幾歲</span>

        <button type="button" data-age="7" aria-pressed="false">7</button><button type="button" data-age="8" aria-pressed="false">8</button>
      </div>

    <div class="field">

      </div>
      <p>沒有手環？故事開始後長按畫面，會出現代替手環的按鈕。長輩的坐姿活動在<a href="./">原本的頁面</a>。</p>
    </details>
  </main>
</div>

<section id="stage" hidden aria-label="故事進行中">
  <div class="bot" id="bot" aria-hidden="true">
    <i class="ant"></i><i class="arm l"></i><i class="arm r"></i>
    <div class="head"><div class="face" id="face" data-emo="calm"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i></div></div>
  </div>

  <p id="caption" hidden></p>
  <div id="fork" hidden>
    <button type="button" data-choice="left"><b class="arrow">◀</b><span id="forkL"></span><small>按左邊的按鈕</small></button>

</section>

<script>
'use strict';
/* ═════════ 設定 ═════════ */
const WORKER_URL='https://lucky-waterfall-f8a2.shopcom2009.workers.dev'; // 換 Worker 網址時只改這一行
const BLE={service:'4fa8691a-136d-4560-84ed-01354051b785',characteristic:'beb5483e-36e1-4688-b7f5-ea07361b26a8'};
// 門檻依 2026/11/14 手環實測：不動 0～1、輕擺 2～3、揮手 4～10、用力跑 7～10
// strong＝衝刺；any＝有在動；light＝輕輕的（太大力會 ≥ tooHard）；stillMax＝不動
const SENS={low:{bodyMin:4,armMin:3,stillMax:1,strongMin:6,moveMin:4,lightMin:1,lightMax:4,tooHard:7},
  mid:{bodyMin:3,armMin:2,stillMax:1,strongMin:5,moveMin:3,lightMin:1,lightMax:4,tooHard:6},
  high:{bodyMin:2,armMin:1,stillMax:1,strongMin:4,moveMin:2,lightMin:1,lightMax:3,tooHard:5}};

/* ENGINE-BEGIN —— 故事流程核心（不碰畫面、聲音、藍牙，全部由外面傳進來，方便測試） */
function createEngine(d){
  const cfg=Object.assign({bodyMin:3,armMin:2,stillMax:1,strongMin:5,moveMin:3,lightMin:1,lightMax:4,tooHard:6,
    tick:100,autoContinue:60,practiceAuto:14,reHint:20,prefetchBoth:true,seated:false,
    sceneGap:900,waitFirst:4,waitDemo:9,waitEvery:7,setbackAfter:16,cueMin:2000,cueMax:4500,cueWindow:2500},d.cfg||{});
  const S={run:0,phase:'idle',paused:false,pauses:0,act:null,story:null,pending:{},choiceWaiter:null,practices:0,moved:0};
  const alive=r=>r===S.run;
  const CMD={body:'ACT:BODY',jump:'ACT:JUMP',arm:'ACT:ARM',still:'ACT:STILL',shake:'ACT:BODY',game:'ACT:BODY'};
  const P_HINT=a=>['跟我一起試試看！','跟我一起'+a+'！','沒關係，我們等一下再試。'];
  // 暖身動作庫：每次隨機洗牌，同一輪不重複。stand＝要站著才能做；jump＝手環要能認跳
  const PRACTICE=[
    {kind:'body',stand:1,do:'原地跑步',lead:'跟我一起，在原地跑一跑！',beats:['跑、跑、跑！','好棒，再一下下！','哇，你跑得好快！'],sound:'step',demo:'swing',target:{type:'seconds',value:5}},
    {kind:'body',stand:1,do:'踩水坑',lead:'地上有好多小水坑，跟我一起踩、踩、踩！',beats:['啪嗒、啪嗒！','水花濺起來了！','哇，好好玩的水坑！'],sound:'splash',demo:'swing',target:{type:'seconds',value:4}},
    {kind:'shake',do:'搖鈴鐺',lead:'手裡拿著一個小鈴鐺，跟我一起搖一搖！',beats:['叮鈴！','叮鈴叮鈴！','鈴鐺在唱歌了！'],sound:'clap',demo:'shake',target:{type:'count',value:3}},
    {kind:'shake',do:'搖果樹',lead:'樹上有好多果子，抓住樹幹，搖一搖！',beats:['咚！掉下一顆！','又掉一顆！','籃子裝滿了！'],sound:'pop',demo:'shake',target:{type:'count',value:3}},
    {kind:'arm',do:'拍翅膀',lead:'我們變成小鳥，兩隻手當翅膀，拍呀拍！',beats:['拍拍拍！','飛高一點！','你飛起來了！'],sound:'rustle',demo:'flap',target:{type:'seconds',value:4}},
    {kind:'arm',do:'划小船',lead:'我們坐上小船，兩隻手一起划、划、划！',beats:['划呀划！','船往前走了！','到對岸了！'],sound:'splash',demo:'swim',target:{type:'seconds',value:4}},
    {kind:'arm',do:'攪魔法湯',lead:'鍋子裡有魔法湯，拿起大湯匙，攪一攪！',beats:['咕嚕咕嚕！','冒泡泡了！','魔法湯煮好了！'],sound:'rustle',demo:'stir',target:{type:'seconds',value:4}},
    {kind:'arm',do:'揮手打招呼',lead:'遠遠的有朋友在看我們，一起揮揮手！',beats:['嗨！','再揮大一點！','朋友看到我們了！'],sound:'rustle',demo:'wave',target:{type:'seconds',value:4}},
    {kind:'arm',do:'開車',lead:'握住方向盤，左轉、右轉，開車出發！',beats:['叭叭！','轉彎囉！','到站了！'],sound:'step',demo:'steer',target:{type:'seconds',value:4}},
    {kind:'still',do:'像木頭人一樣不動',lead:'現在變成木頭人，一動也不要動……',beats:['噓……','很好，繼續不動……','好厲害，你完全沒動！'],sound:'none',demo:'freeze',target:{type:'seconds',value:3}},
    {kind:'still',do:'變成小石頭',lead:'變成一顆小石頭，安安靜靜，一動也不動……',beats:['噓……','小石頭睡著了……','好厲害，一動也沒動！'],sound:'none',demo:'freeze',target:{type:'seconds',value:3}},
    {kind:'jump',stand:1,jump:1,do:'青蛙跳',lead:'我們變成小青蛙，跳、跳！',beats:['呱！','再跳一下！','青蛙跳得好高！'],sound:'splash',demo:'jump',target:{type:'count',value:2}}
  ].map(m=>Object.assign(m,{hints:P_HINT(m.do),hintAt:[3,7,11]}));
  const BETWEEN=['故事快到了，我們再玩一個！','再等一下下，故事就要來囉！','夥伴還在想故事，我們再動一動！','好好玩！再來一個！'];
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  function practiceDeck(){
    const ok=PRACTICE.filter(m=>!(cfg.seated&&m.stand)&&!(m.jump&&!(cfg.gestures||[]).includes('JUMP')));
    // 不要連續兩次都是木頭人：先把動的排前面，木頭人插在中間
    const deck=shuffle(ok);if(deck[0]&&deck[0].kind==='still'){const k=deck.findIndex(m=>m.kind!=='still');if(k>0)[deck[0],deck[k]]=[deck[k],deck[0]]}
    return deck;
  }
  // Fish 配音：下一個暖身動作的句子先準備好（影片實測：沒先準備時，句子之間會突然安靜 1～3 秒）
  const practiceLines=m=>m?[m.lead,...m.beats,m.hints[0]]:[];
  function nextPractice(){if(!S.deck||!S.deck.length)S.deck=practiceDeck();const m=S.deck.shift();
    if(d.prefetchText)d.prefetchText(practiceLines(S.deck[0]));return m}

  async function hold(r){while(alive(r)&&S.paused)await d.sleep(cfg.tick)}
  // 唸一段。聲音層支援暫停時，暫停後會從停下的那一句接著唸；不支援時才整段重唸
  async function say(r,text){
    text=String(text||'').trim();if(!text)return;
    while(alive(r)){await hold(r);if(!alive(r))return;const pc=S.pauses;d.ui('line',text);await d.speak(text);if(d.pauseSpeech||S.pauses===pc)return}
  }
  function makeQueue(r){
    const q=[];let busy=false;
    async function pump(){if(busy)return;busy=true;while(q.length&&alive(r))await say(r,q.shift());busy=false}
    return {push(t){if(t){q.push(t);pump()}},clear(){q.length=0},get idle(){return !busy&&!q.length},async drain(){while(busy&&alive(r))await d.sleep(cfg.tick)}};
  }

  // 一段動作：孩子動的時候旁白跟著進度往下講；沒動時提示一層一層變清楚；絕不卡死
  async function runMove(r,m,opt){
    opt=opt||{};
    const name=S.story?S.story.companion.name:'我';
    const A=S.act={kind:m.kind,sound:m.sound,value:0,target:m.target.value,lastProgress:0,lastPacket:0,skip:false,auto:false};
    d.ui('move',{move:m,practice:!!opt.practice});
    d.cmd(CMD[m.kind]);d.cmd('BUZZ');d.sfx('chime');d.robot('DEMO:'+m.demo);
    const q=makeQueue(r);q.push(m.lead);
    const said=[false,false];let leadDone=0,stage=0,hintClock=0,lastHint=0;
    const auto=(opt.practice?cfg.practiceAuto:cfg.autoContinue)*1000;
    while(alive(r)){
      await hold(r);if(!alive(r))return null;
      const now=d.now();
      if(!leadDone&&q.idle){leadDone=now;hintClock=now}
      const frac=A.value/A.target;
      d.ui('progress',Math.min(1,frac));
      if(A.skip||frac>=1)break;
      if(!said[0]&&frac>=1/3){said[0]=true;q.push(m.beats[0])}
      if(!said[1]&&frac>=2/3){said[1]=true;q.push(m.beats[1])}
      if(A.lastProgress>hintClock){hintClock=A.lastProgress;stage=0}          // 有在動 → 提示重新計時
      if(leadDone&&q.idle){
        const idle=(now-hintClock)/1000;
        if(stage<3&&idle>=m.hintAt[stage]){q.push(m.hints[stage]);d.robot(stage===2?'WAIT':'NUDGE');stage++;lastHint=now}
        else if(stage>=3&&now-lastHint>=cfg.reHint*1000){q.push(m.hints[1]);d.robot('NUDGE');lastHint=now}
        if(now-Math.max(A.lastProgress,leadDone)>=auto){A.auto=true;break}
      }
      await d.sleep(cfg.tick);
    }
    if(!alive(r))return null;
    S.act=null;d.cmd('PAUSE');q.clear();await q.drain();
    if(!alive(r))return null;
    d.ui('progress',1);
    if(!opt.practice)S.moved+=m.target.type==='count'?Math.round(Math.min(A.value,A.target)*1.5):Math.round(Math.min(A.value,A.target));
    if(A.auto){
      d.robot('WAIT');
      if(!opt.practice)await say(r,name+'牽起你的手：「沒關係，我們一起慢慢走過去。」');
    }else{d.robot('CHEER');d.sfx('cheer')}
    if(!(opt.practice&&A.auto))await say(r,m.beats[2]);
    d.ui('progress',0);d.ui('level',0);d.ui('rest');
    return {auto:A.auto,skipped:A.skip};
  }

  // v4 玩法：照 phases 判斷進度，進度旁白照「孩子做了多少」一句一句往下唸。
  // 孩子沒動時故事停著等，但一直有聲音（等待句 → 示範 → 輪流），不會自動跳過；大人可以按右鍵跳過。
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const LV={strong:l=>l>=cfg.strongMin,any:l=>l>=cfg.moveMin,light:l=>l>=cfg.lightMin&&l<=cfg.lightMax};
  const phaseSize=ph=>ph.mode==='count'?ph.n:ph.mode==='cue'?ph.rounds:ph.seconds;
  const phaseDemo=ph=>ph.demo||(ph.mode==='still'?'freeze':ph.mode==='count'?({'P:UP':'up','P:DOWN':'down','G:TWIST':'twist','J':'jump'}[ph.sig]||'shake'):ph.mode==='cue'?'shake':ph.band==='light'?'wave':'swing');
  // 手環沒校正（或用按鈕玩）時，新動作認不出來：改成「有在動就算」，孩子不會卡住
  const SIG_GESTURE={'P:UP':'UP','P:DOWN':'DOWN','G:TWIST':'TWIST','J':'JUMP'};
  const adaptPhase=ph=>{
    if(ph.loose)return ph;                                                   // v5.4：跟著做的動作，有在動就算，不用轉換
    if(ph.mode==='count'&&SIG_GESTURE[ph.sig]&&!(cfg.gestures||[]).includes(SIG_GESTURE[ph.sig]))return {mode:'level',band:'any',seconds:Math.max(2,ph.n*2),call:ph.call,hint:ph.hint};
    return ph;
  };
  async function runGame(r,g,sc){
    const hasOutcome=!!(g.win||g.help);                                     // v5.1：做得順利／需要幫忙，兩種結果
    let setbackDone=false,struggled=false,stillResets=0,totalMisses=0;
    const A=S.act={kind:'game',sound:g.sound,level:0,levelAt:0,sCount:0,counts:{},skip:false,lastProgress:0,lastPacket:0};
    const phases=g.phases.map(adaptPhase);
    d.ui('move',{move:g});d.cmd('ACT:BODY');d.cmd('BUZZ');d.sfx('chime');d.robot('DEMO:'+g.demo);
    const q=makeQueue(r);q.push(g.lead);
    while(alive(r)&&!q.idle&&!A.skip){await hold(r);await d.sleep(cfg.tick)}     // 先唸完「為什麼要動」
    if(!alive(r))return null;
    const total=phases.reduce((s,ph)=>s+phaseSize(ph),0);
    let pi=-1,ph=null,phDone=0,before=0,said=0,last=d.now(),idleSince=d.now(),stage=0,lastLine=0,wi=0,oopsAt=0,moved=0,cue=null,sMark=0,misses=0,fxAt=0;
    let assisted=0,assistT=0;
    const nextPhase=()=>{pi++;ph=phases[pi];phDone=0;cue=null;sMark=A.counts[ph.sig===''?'__none':(ph.sig||'S')]||0;assisted=0;assistT=0;idleSince=d.now();stage=0;
      if(ph.mode==='cue')q.push(ph.hint);else if(ph.call)q.push(ph.call);      // 聽口令搖：開頭只說「等叮再搖」，「搖！」留到叮的時候
      d.robot('DEMO:'+phaseDemo(ph))};
    nextPhase();
    while(alive(r)){
      await hold(r);if(!alive(r))return null;
      const now=d.now(),dt=Math.min(0.3,(now-last)/1000);last=now;
      if(A.skip)break;
      const fresh=now-A.levelAt<800,lv=fresh?A.level:0;
      let progressed=false;
      if(ph.mode==='level'){
        if(LV[ph.band](lv)){phDone+=dt;moved+=dt;progressed=true}
        else if(ph.band==='light'&&lv>cfg.lightMax){                        // 要輕輕的卻太大力：進度倒退，不是亂動也能過
          phDone=Math.max(0,phDone-dt*1.5);progressed=true;
          if(now-oopsAt>4000&&q.idle){oopsAt=now;q.push(ph.oops||'輕一點，慢慢來……')}
        }
      }else if(ph.mode==='still'){
        if(fresh&&lv<=cfg.stillMax){phDone+=dt;progressed=true}
        else if(lv>=cfg.moveMin){                                             // 要停住卻明顯在動：這一次重來
          if(phDone>0.8){stillResets++;if(now-oopsAt>4000&&q.idle){oopsAt=now;q.push(pick(['哎呀，動到了！我們再停一次。','噓……動了喔，再當一次木頭人。']))}}
          phDone=0;
        }
      }else if(ph.mode==='count'){
        const key=ph.sig===''?'__none':(ph.sig||'S');
        const c=(A.counts[key]||0)-sMark+assisted;if(c>phDone){moved+=(c-phDone)*0.8;phDone=c;progressed=true}   // 搖、舉高、放低、轉、跳都用次數算
        // 跟著做的動作（loose）：手環認不出這個動作也沒關係，孩子有在動，每 1.3 秒就算一下，故事照樣往前
        else if(ph.loose&&fresh&&lv>=cfg.moveMin){assistT+=dt;moved+=dt;progressed=true;if(assistT>=1.3){assistT=0;assisted++;d.sfx(g.sound&&g.sound!=='none'?g.sound:'step')}}
        // 保險：已經發生過挫折、孩子明顯在動，手環卻一直認不出這個動作 → 有在動也算（故事走「需要幫忙」），不會卡死
        else if(setbackDone&&fresh&&lv>=cfg.moveMin){assistT+=dt;if(assistT>=2){assistT=0;assisted++;struggled=true}}
      }else if(ph.mode==='cue'){
        progressed=true;                                      // 等口令時本來就要停著，不算「沒動」
        const wait=()=>now+cfg.cueMin+Math.random()*(cfg.cueMax-cfg.cueMin);
        if(!cue){if(q.idle)cue={state:'arm',until:wait(),mark:A.sCount}}
        else if(cue.state==='arm'){
          if(A.sCount>cue.mark){cue.mark=A.sCount;cue.until=wait();if(now-oopsAt>3000&&q.idle){oopsAt=now;q.push(ph.early)}}
          else if(now>=cue.until){d.sfx('ding');d.robot('DEMO:shake');q.push(ph.call);cue={state:'go',until:now+cfg.cueWindow,mark:A.sCount}}
        }else if(A.sCount>cue.mark){phDone+=1;moved+=1;misses=0;d.sfx('cheer');cue=null}
        else if(now>=cue.until){misses++;totalMisses++;cue=null;if(misses>=2){misses=0;q.push(ph.hint);d.robot('DEMO:shake')}else q.push('沒關係，再一次！')}
      }
      // 即時音效：身體一動就聽得到。用力動是腳步聲（越用力越快），輕輕動是沙沙聲，太大力是嘩啦聲，該停住卻在動是「咦？」
      if(fresh&&ph.mode==='level'){
        if(LV[ph.band](lv)){
          const gap=ph.band==='light'?700:Math.max(220,620-lv*45);
          if(now-fxAt>=gap){fxAt=now;d.sfx(ph.band==='light'?'rustle':(g.sound&&g.sound!=='none'?g.sound:'step'))}
        }else if(ph.band==='light'&&lv>cfg.lightMax&&now-fxAt>=500){fxAt=now;d.sfx('splash')}
      }else if(fresh&&ph.mode==='still'&&lv>=cfg.moveMin&&now-fxAt>=1200){fxAt=now;d.sfx('wobble')}
      const frac=Math.min(1,(before+Math.min(phDone,phaseSize(ph)))/total);
      d.ui('progress',frac);
      // 進度旁白：有兩種結果時，steps 全部在過程中唸完（結果另外唸）；舊版的最後一句 step 就是結果
      if(hasOutcome){while(said<g.steps.length&&frac>=(said+1)/(g.steps.length+1)){q.push(g.steps[said]);said++}}
      else while(said<g.steps.length-1&&frac>=(said+1)/g.steps.length){q.push(g.steps[said]);said++}
      if(phDone>=phaseSize(ph)){before+=phaseSize(ph);if(pi+1>=phases.length)break;nextPhase();continue}
      if(progressed){stage=0;idleSince=now}
      else if(q.idle){
        const idle=(now-idleSince)/1000;
        // 一直沒動：發生一個小挫折，夥伴鼓勵再試一次。故事不結束、不跳過，只是走向會變成「需要幫忙」
        if(hasOutcome&&!setbackDone&&g.setback&&idle>=cfg.setbackAfter){
          setbackDone=true;struggled=true;q.push(g.setback);d.sfx('wobble');d.robot('WAIT');
          q.push(g.retry||ph.hint);d.robot('DEMO:'+phaseDemo(ph));stage=2;lastLine=now;
        }
        else if(stage===0&&idle>=cfg.waitFirst){q.push(g.waits[wi++%g.waits.length]);d.robot('NUDGE');stage=1;lastLine=now}
        else if(stage===1&&idle>=cfg.waitDemo){q.push(ph.hint);d.robot('DEMO:'+phaseDemo(ph));stage=2;lastLine=now}
        else if(stage>=2&&now-lastLine>=cfg.waitEvery*1000){
          if(stage%2){q.push(ph.hint);d.robot('DEMO:'+phaseDemo(ph))}else{q.push(g.waits[wi++%g.waits.length]);d.sfx('wind')}
          stage++;lastLine=now}
      }
      await d.sleep(cfg.tick);
    }
    if(!alive(r))return null;
    S.act=null;d.cmd('PAUSE');q.clear();await q.drain();if(!alive(r))return null;
    d.ui('progress',1);S.moved+=Math.round(moved);
    if(hasOutcome){
      // 孩子的表現決定故事怎麼走：順利 → 多了一個好的新發展；需要幫忙 → 夥伴幫忙，用不同方法過關。兩種都會往下走
      if(A.skip||totalMisses>=2||stillResets>=2)struggled=true;
      const outcome=struggled?'help':'win';
      if(outcome==='win'){d.robot('CHEER');d.sfx('cheer')}else{d.robot('NUDGE');d.sfx('chime')}
      await say(r,g[outcome]);
      S.log.push({index:sc?sc.index:0,type:g.type,outcome,reward:g.reward||'',lesson:g.lesson||''});
    }else{
      d.robot('CHEER');d.sfx('cheer');
      await say(r,g.steps[g.steps.length-1]);
    }
    d.ui('progress',0);d.ui('level',0);d.ui('rest');
    return {skipped:A.skip};
  }

  // 手環（或模擬按鈕）送來的訊號
  function signal(sig){
    const now=d.now(),A=S.act;
    if(sig==='CHOICE_LEFT'||sig==='CHOICE_RIGHT'){
      const c=sig==='CHOICE_LEFT'?'left':'right';
      if(S.paused)return;
      if(S.choiceWaiter){const w=S.choiceWaiter;S.choiceWaiter=null;w(c)}
      else S.lastChoice={c,t:now};                                            // 孩子聽到問題就先按了：記下來，等一下直接用
      return}
    if(sig==='START'){if(A)A.skip=true;return}                                // 大人可以按右鍵幫孩子跳過
    if(!A||S.paused)return;
    if(A.kind==='game'){                                                     // v4 玩法：只記下最新強度和搖的次數，判斷交給 runGame
      if(sig==='S'){A.sCount++;A.counts.S=(A.counts.S||0)+1;d.sfx(A.sound==='none'?'clap':A.sound);return}
      if(sig.startsWith('P:')||sig.startsWith('G:')||sig==='J'){            // 新動作：舉高、放低、轉手腕、跳（每認出一次就有聲音）
        A.counts[sig]=(A.counts[sig]||0)+1;
        const fx={'P:UP':'pop','P:DOWN':'step','G:TWIST':'click','J':'splash'}[sig];if(fx)d.sfx(fx);
        return;
      }
      if(sig.length>2&&sig[0]==='A'&&sig[1]===':'){const lv=Number(sig.slice(2));if(Number.isFinite(lv)){A.level=lv;A.levelAt=now;d.ui('level',lv)}}
      return;
    }
    if(sig==='S'&&A.kind==='shake'){A.value+=1;A.lastProgress=now;d.sfx('clap');return}
    if(sig==='J'){if(A.kind==='jump'){A.value+=1;A.lastProgress=now;d.sfx(A.sound)}else if(A.kind==='body')d.sfx(A.sound);return}
    if(sig==='S'){if(A.kind==='body'||A.kind==='arm')d.sfx(A.sound);return}
    if(sig.length>2&&sig[0]==='A'&&sig[1]===':'){
      const lv=Number(sig.slice(2));if(!Number.isFinite(lv))return;
      const dt=A.lastPacket?Math.min(0.5,Math.max(0.05,(now-A.lastPacket)/1000)):0.25;A.lastPacket=now;d.ui('level',lv);
      if(A.kind==='body'){if(lv>=cfg.bodyMin){A.value+=dt;A.lastProgress=now}}
      else if(A.kind==='arm'){if(lv>=cfg.armMin){A.value+=dt;A.lastProgress=now}}
      else if(A.kind==='still'){if(lv<=cfg.stillMax){A.value+=dt;A.lastProgress=now}else if(lv>=cfg.bodyMin)A.value=Math.max(0,A.value-1)}
    }
  }

  // 等 AI 的時候不讓孩子空等：先唸一句，還沒好就一起做小練習
  async function waitWith(r,promise,line){
    let settled=false,val,err;promise.then(v=>{settled=true;val=v},e=>{settled=true;err=e});
    if(d.prefetchText){d.prefetchText([line,...practiceLines(S.deck&&S.deck[0]),...BETWEEN])}
    await d.sleep(300);
    if(!settled&&line)await say(r,line);
    while(alive(r)&&!settled){
      await runMove(r,nextPractice(),{practice:true});S.practices++;
      if(alive(r)&&!settled)await say(r,pick(BETWEEN));
    }
    if(err)throw err;return val;
  }
  // 兩條路的下半段都先準備；準備好的留在 S.halves，故事結束時一起存起來，之後可以「再聽一次」
  function fetchHalf(c){const api=S.story&&S.story.api;const p=d.api(api===5?'/api/v5/next':api===4?'/api/v4/next':'/api/v3/next',{story:S.story,choice:c,log:S.log.slice()});p.then(v=>{if(v&&v.scenes)S.halves[c]=v}).catch(()=>{});return p}

  // onMovesDone：這一半的動作都做完時呼叫一次（v5 用來在這時才寫下半段，這樣下半段才知道孩子剛剛的表現）
  async function playScenes(r,scenes,onMovesDone){
    const fire=()=>{if(onMovesDone){const f=onMovesDone;onMovesDone=null;f()}};
    for(let i=0;i<scenes.length;i++){
      const sc=scenes[i];
      if(!alive(r))return;
      if(!scenes.slice(i).some(s=>s.game||s.move))fire();
      d.ui('scene',sc);d.robot('EMO:'+sc.emotion);if(d.prefetch)d.prefetch(sc);
      if(i>0)await d.sleep(cfg.sceneGap);                                    // 換幕前停一下，像翻頁
      await say(r,sc.text);

  if(name==='cheer'){tone(660,0,.18,.14);tone(880,.12,.18,.14);tone(1100,.24,.4,.16);return}
  if(name==='ding'){tone(1568,0,.6,.24);tone(2350,0,.35,.08);return}
  if(name==='wobble'){tone(392,0,.18,.12);tone(330,.14,.28,.12);return}
  if(name==='pop'){tone(660,0,.08,.14);tone(990,.06,.14,.12);return}                 // 舉高：往上的「啵」
  if(name==='click'){noise(.04,'bandpass',2600,2,.5);return}                          // 轉手腕：「喀」
  if(now-lastSfx<170)return;lastSfx=now;

const band={device:null,ch:null,queue:Promise.resolve(),connected:false};

let bandGestures=[];
function gesturesFromCal(list){
  const ok=String(list).split(',').map(s=>s.trim()).filter(Boolean),out=[];
  if(ok.includes('MID')){if(ok.includes('UP'))out.push('UP');if(ok.includes('DOWN'))out.push('DOWN')}
  if(ok.includes('TWIST'))out.push('TWIST');
  return out;
}
function bandUI(){const el=$('bandState');el.replaceChildren();const i=document.createElement('i');i.className='dot'+(band.connected?' on':'');
  const gName={UP:'舉高',DOWN:'放低',TWIST:'轉手腕'};
  el.append(i,document.createTextNode(band.connected?'手環連上了'+(bandGestures.length?'（新動作：'+bandGestures.map(x=>gName[x]).join('、')+'）':'（新動作還沒校正）'):'手環還沒連上'));$('connect').textContent=band.connected?'中斷連線':'連接手環'}
function cmd(c){if(!band.ch||!band.connected)return;const ch=band.ch;
  band.queue=band.queue.then(()=>ch===band.ch&&band.connected?ch.writeValue(new TextEncoder().encode(c)):null).catch(()=>{})}
// Windows 的 Chrome 第一次連藍牙常常失敗（Connection attempt failed），自動多試幾次
async function connectRetry(dev,tries=4){
  let last;
  for(let i=0;i<tries;i++){
    try{if(dev.gatt.connected)return dev.gatt;return await dev.gatt.connect()}
    catch(e){last=e;notice('正在連接手環……（第 '+(i+2)+' 次）');await new Promise(r=>setTimeout(r,800+i*400))}
  }
  throw last;
}
async function connectBand(){
  if(band.connected){try{band.device.gatt.disconnect()}catch(e){}return}
  if(!navigator.bluetooth||!navigator.bluetooth.requestDevice){notice('這個瀏覽器不能連手環。iPhone 請改用 Bluefy；也可以先用畫面上的按鈕試玩。');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[BLE.service]});
    const server=await connectRetry(dev),svc=await server.getPrimaryService(BLE.service),ch=await svc.getCharacteristic(BLE.characteristic);
    band.device=dev;band.ch=ch;band.connected=true;band.queue=Promise.resolve();
    dev.addEventListener('gattserverdisconnected',()=>{if(band.device!==dev)return;band.connected=false;band.ch=null;bandUI();notice('手環斷線了。可以重新連接，或長按畫面用按鈕代替。')});
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>{const t=new TextDecoder().decode(e.target.value).trim().toUpperCase();
      if(t.startsWith('CAL:LIST:')){bandGestures=gesturesFromCal(t.slice(9));bandUI();return}
      if(t)engine.signal(t)});
    cmd('MODE_CHILD');cmd('GAME_ACTIVE');cmd('PAUSE');cmd('CAL?');                 // 問手環哪些新動作校正好了
    bandUI();notice('手環連上了。');
  }catch(e){band.connected=false;band.ch=null;bandUI();
    const m=String(e&&e.message||e);
    notice(/cancel/i.test(m)?'沒有選擇手環。':'沒有連上手環：'+m+'。請確認手環有開機、沒有被其他分頁或手機連著，再按一次「連接手環」。')}
}

   EMO:<happy|excited|worried|surprised|sad|calm|proud|scared>  換眼睛表情（每一幕開頭）
   DEMO:<swing|up|wave|freeze|shake>  示範動作（一段動作開始）。shake＝雙手一上一下輪流揮
   NUDGE  孩子還沒動，動作做大一點、看向孩子      WAIT  表示「我等你」
   CHEER  孩子完成了，歡呼      ASK  等孩子選路      WAVE  故事結束，揮手說明天見 */

   跟手環一樣用 BLE，但服務 UUID 不同，網頁才分得出來。指令就是上面那些，再加上：
   TALK:1／TALK:0  正在說話（OLED 嘴巴開合）　REST  回到休息姿勢　MIC:1／MIC:0  開關麥克風（回報 V:0～10 音量） */
const BOT={service:'a8f2c0de-3b1d-4f7e-9c55-5d9030000001',characteristic:'a8f2c0de-3b1d-4f7e-9c55-5d9030000002'};
const bot={device:null,ch:null,queue:Promise.resolve(),connected:false,level:0};
function botUI(){const el=$('botState');el.replaceChildren();const i=document.createElement('i');i.className='dot'+(bot.connected?' on':'');
  el.append(i,document.createTextNode(bot.connected?'機器人連上了':'機器人還沒連上'));$('connectBot').textContent=bot.connected?'中斷連線':'連接機器人'}
function botSend(c){if(!bot.ch||!bot.connected)return;const ch=bot.ch;
  bot.queue=bot.queue.then(()=>ch===bot.ch&&bot.connected?ch.writeValueWithoutResponse(new TextEncoder().encode(c)):null).catch(()=>{})}
async function connectBot(){
  if(bot.connected){try{bot.device.gatt.disconnect()}catch(e){}return}
  if(!navigator.bluetooth||!navigator.bluetooth.requestDevice){notice('這個瀏覽器不能連機器人，請用電腦版的 Chrome 或 Edge。');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[BOT.service]}]});
    const server=await connectRetry(dev),svc=await server.getPrimaryService(BOT.service),ch=await svc.getCharacteristic(BOT.characteristic);
    bot.device=dev;bot.ch=ch;bot.connected=true;bot.queue=Promise.resolve();
    dev.addEventListener('gattserverdisconnected',()=>{if(bot.device!==dev)return;bot.connected=false;bot.ch=null;botUI();notice('機器人斷線了，可以重新連接。')});
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>{const t=new TextDecoder().decode(e.target.value).trim();
      if(t.startsWith('V:')){bot.level=Number(t.slice(2))||0;engine.signal('VOL:'+bot.level)}});    // 麥克風音量
    botUI();notice('機器人連上了。記得在電腦的藍牙設定連接「SDQ-30 Speaker」，聲音才會從機器人身上出來。');
  }catch(e){bot.connected=false;bot.ch=null;botUI();

    notice(/cancel/i.test(m)?'沒有選擇機器人。':'沒有連上機器人：'+m+'。請確認機器人有開機，再按一次「連接機器人」。')}
}

async function api(path,body){
  // 連不上（Failed to fetch）通常是 Worker 當下出錯或網路不穩：自動再試一次
  for(let attempt=0;;attempt++){
    const c=new AbortController(),t=setTimeout(()=>c.abort(),180000);   // Worker 下半段最多等 2.5 分鐘，這裡要更久
    try{
      const r=await fetch(WORKER_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw Object.assign(Error(j.error||(r.status===404?'Worker 還是舊版，請先部署 worker_v4.js':'故事伺服器回傳錯誤（'+r.status+'）')),{server:true});
      return j;
    }catch(e){
      if(e.name==='AbortError')throw Error('故事等太久了，請再試一次');
      if(e.server)throw e;
      if(attempt<1){await new Promise(r=>setTimeout(r,2500));continue}
      throw Error('連不到故事伺服器。請打開 Worker 的 /health 看看有沒有回應，或稍後再試');
    }finally{clearTimeout(t)}
  }
}

const SAVED_KEY='sdq-v4-saved',SAVED_MAX=8;
let replayId=null;

function savedStories(){try{return JSON.parse(localStorage.getItem(SAVED_KEY)||'{}')}catch(e){return {}}}
function storeSaved(all){
  // 空間不夠就丟掉最舊的，再試一次
  const ids=Object.keys(all).sort((a,b)=>(all[a].t||0)-(all[b].t||0));
  while(ids.length){try{localStorage.setItem(SAVED_KEY,JSON.stringify(all));return}catch(e){delete all[ids.shift()]}}
  try{localStorage.removeItem(SAVED_KEY)}catch(e){}
}
function remember(story,moved,save,isReplay){
  try{
    const all=savedStories();
    if(isReplay&&replayId&&all[replayId]){                       // 重聽：不新增一筆，只把這次新準備好的另一條路補進去
      if(save)Object.assign(all[replayId].halves,save.halves||{});
      storeSaved(all);renderPast();return;
    }
    const id='s'+Date.now(),list=pastStories();
    list.unshift({id,title:story.title,name:story.companion.name,moved:moved||0,t:Date.now()});
    localStorage.setItem('sdq-v3-stories',JSON.stringify(list.slice(0,SAVED_MAX)));
    if(save&&save.start&&save.start.scenes){
      all[id]={t:Date.now(),start:save.start,halves:save.halves||{}};
      const keep=new Set(list.slice(0,SAVED_MAX).map(x=>x.id));
      for(const k of Object.keys(all))if(!keep.has(k))delete all[k];
      storeSaved(all);
    }
  }catch(e){}

let ageValue='6',sensValue='mid';
function setSens(v){sensValue=v;document.querySelectorAll('#sensSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sens===v)))}
$('sensSeg').addEventListener('click',e=>{const b=e.target.closest('[data-sens]');if(b)setSens(b.dataset.sens)});
function setAge(a){ageValue=String(a);document.querySelectorAll('#ages button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.age===ageValue)))}
$('ages').addEventListener('click',e=>{const b=e.target.closest('[data-age]');if(b)setAge(b.dataset.age)});
$('connect').onclick=connectBand;
$('connectBot').onclick=connectBot;
try{const s=JSON.parse(localStorage.getItem('sdq-v3')||'{}');if(s.age&&/^[5-8]$/.test(String(s.age)))setAge(s.age);$('fish').checked=s.voiceV===2?s.voice==='fish':true;   /* v5.6 起預設用 Fish 配音 */if(s.sens&&SENS[s.sens])setSens(s.sens);$('seated').checked=!!s.seated;$('subs').checked=!!s.subs}catch(e){}
function begin(replay){
  notice('');
  if(!(replay&&replay.start&&replay.start.scenes)){replay=null;replayId=null}   // 一般開始；replay 是「再聽一次」存下來的故事
  // 這些一定要在「按下按鈕」的當下做，手機才允許之後自動播放聲音
  audio();try{player.src=silentWav();Promise.resolve(player.play()).catch(()=>{})}catch(e){}
  try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}
  keepAwake();
  voiceMode=$('fish').checked?'fish':'device';fishFails=0;voiceCache.clear();
  const seated=$('seated').checked;
  // 用按鈕玩或手環沒校正：不用新動作。跳不用校正，但坐著玩不跳
  const gestures=band.connected?bandGestures.concat($('seated').checked?[]:['JUMP']):[];
  Object.assign(engine.cfg,SENS[sensValue]||SENS.mid,{seated,gestures});
  try{localStorage.setItem('sdq-v3',JSON.stringify({age:ageValue,voice:voiceMode,voiceV:2,sens:sensValue,seated,subs:$('subs').checked}))}catch(e){}
  simStart();
  engine.start({mode:'child',player:'solo',posture:seated?'seated':'general',age:Number(ageValue),topic:$('idea').value.trim(),chat:[],gestures,recent:recentLibIds()},replay||undefined);
}
$('begin').onclick=()=>begin(null);
$('again').onclick=()=>{show('finale',false);show('setup',true);window.scrollTo(0,0)};
window.addEventListener('pagehide',()=>{cancelSpeech();cmd('PAUSE')});
bandUI();botUI();renderPast();
</script>
</body>
</html>
