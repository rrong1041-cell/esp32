<script>


// =====================================================
// Worker
// =====================================================

const WORKER_URL =
    "https://empty-credit-1539.rrong1041.workers.dev";


// =====================================================
// 全域變數
// =====================================================

let bleDevice = null;

let bleCharacteristic = null;

let selectedTheme =
    "勇敢的小騎士與巨龍";

let selectedDifficulty =
    "easy";

let currentStory = "";

let history = [];

let waitingForAction = false;

let expectedAction = "";

let busy = false;

let seniorMode = false;

let seniorLevel = "easy";

let seniorRoundIndex = 0;

let seniorRunning = false;

let seniorExpectedAction = "";

let seniorRecentActions = [];

let seniorCurrentStory = "";


// =====================================================
// DOM
// =====================================================

const $ = id =>
    document.getElementById(id);


// =====================================================
// Toast
// =====================================================

function showToast(text) {

    const toast =
        $("toast");

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 2000);
}


// =====================================================
// 顯示動作
// =====================================================

function actionLabel(action) {

    const map = {

        SWIPE_LEFT:
            "⬅️ 請向左輕輕揮動手臂",

        SWIPE_RIGHT:
            "➡️ 請向右輕輕揮動手臂",

        JUMP:
            "⬆️ 請向上跳一下",

        SHAKE:
            "📳 請輕輕搖動手環",

        RUN:
            "🏃 請原地跑步，手臂前後擺動",

        ARM_UP:
            "🙋 請慢慢抬高手臂",

        ARM_DOWN:
            "🙆 請慢慢放下手臂",

        TILT_LEFT:
            "↩️ 請慢慢向左傾斜",

        TILT_RIGHT:
            "↪️ 請慢慢向右傾斜",

        HOLD_UP:
            "✋ 請抬高手臂並保持一下"
    };


    return (
        map[action] ||
        "📳 請依照提示操作裝置"
    );
}


// =====================================================
// 語音文字
// 不含 Emoji
// =====================================================

function actionSpeechLabel(action) {

    const map = {

        SWIPE_LEFT:
            "請向左輕輕揮動手臂",

        SWIPE_RIGHT:
            "請向右輕輕揮動手臂",

        JUMP:
            "請向上跳一下",

        SHAKE:
            "請輕輕搖動手環",

        RUN:
            "請原地跑步，手臂前後擺動",

        ARM_UP:
            "請慢慢抬高手臂",

        ARM_DOWN:
            "請慢慢放下手臂",

        TILT_LEFT:
            "請慢慢向左傾斜",

        TILT_RIGHT:
            "請慢慢向右傾斜",

        HOLD_UP:
            "請抬高手臂並保持一下"
    };


    return (
        map[action] ||
        "請依照提示操作裝置"
    );
}


// =====================================================
// 語音
// =====================================================

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    if (!text) {
        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "zh-TW";

    utterance.rate =
        0.95;

    utterance.pitch =
        1.0;


    window.speechSynthesis.speak(
        utterance
    );
}


// =====================================================
// 成功
// =====================================================

function speakSuccess() {

    speak(
        "成功！做得很好！"
    );
}


// =====================================================
// 失敗
// =====================================================

function speakFailure() {

    speak(
        "失敗，再試一次。"
    );
}


// =====================================================
// 動作語音
// =====================================================

function speakAction(action) {

    speak(
        actionSpeechLabel(action)
    );
}


// =====================================================
// BLE
// =====================================================

async function sendBLE(command) {

    if (!bleCharacteristic) {

        console.log(
            "BLE 尚未連接，無法傳送：",
            command
        );

        return false;
    }


    try {

        const encoder =
            new TextEncoder();


        await bleCharacteristic.writeValue(
            encoder.encode(command)
        );


        console.log(
            "BLE →",
            command
        );


        return true;

    }
    catch (error) {

        console.error(
            "BLE 傳送失敗：",
            error
        );

        return false;
    }
}


// =====================================================
// BLE 接收
// =====================================================

function onBleEvent(event) {

    const decoder =
        new TextDecoder();


    const value =
        decoder.decode(
            event.target.value
        ).trim();


    console.log(
        "BLE ←",
        value
    );


    // -----------------------------------------------
    // 模式切換
    // -----------------------------------------------

    if (
        value === "MODE_SENIOR"
    ) {

        setMode(true);

        return;
    }


    if (
        value === "MODE_CHILD"
    ) {

        setMode(false);

        return;
    }


    // -----------------------------------------------
    // START
    // -----------------------------------------------

    if (
        value === "START"
    ) {

        if (seniorMode) {

            if (!seniorRunning) {

                startSeniorActivity();
            }

        }

        return;
    }


    // -----------------------------------------------
    // 長輩動作
    // -----------------------------------------------

    if (seniorMode) {

        handleSeniorAction(
            value
        );

        return;
    }


    // -----------------------------------------------
    // 兒童動作
    // -----------------------------------------------

    if (waitingForAction) {

        handleChildAction(
            value
        );
    }
}


// =====================================================
// BLE 連接
// =====================================================

async function connectBLE() {

    try {

        $("bleStatus").textContent =
            "正在尋找 ESP32...";


        bleDevice =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        name:
                            "ESP32-Story-Device"
                    }
                ],

                optionalServices: [
                    "4fa8691a-136d-4560-84ed-01354051b785"
                ]
            });


        const server =
            await bleDevice.gatt.connect();


        const service =
            await server.getPrimaryService(
                "4fa8691a-136d-4560-84ed-01354051b785"
            );


        bleCharacteristic =
            await service.getCharacteristic(
                "beb5483e-36e1-4688-b7f5-ea07361b26a8"
            );


        await bleCharacteristic.startNotifications();


        bleCharacteristic.addEventListener(
            "characteristicvaluechanged",
            onBleEvent
        );


        $("bleStatus").textContent =
            "🟢 ESP32 已連接";


        showToast(
            "ESP32 連接成功！"
        );


        await sendBLE(
            "READY"
        );


        await sendBLE(
            seniorMode
            ? "MODE_SENIOR"
            : "MODE_CHILD"
        );

    }
    catch (error) {

        console.error(
            error
        );


        $("bleStatus").textContent =
            "🔴 連接失敗";


        showToast(
            "ESP32 連接失敗"
        );
    }
}


// =====================================================
// 模式切換
// =====================================================

async function setMode(isSenior) {

    seniorMode =
        isSenior;


    if (seniorMode) {

        $("childPanel")
            .classList.add("hidden");

        $("seniorPanel")
            .classList.remove("hidden");


        $("btnModeToggle")
            .textContent =
            "👵 長輩模式";


        $("btnModeToggle")
            .classList.remove(
                "bg-purple-600"
            );

        $("btnModeToggle")
            .classList.add(
                "bg-red-500"
            );


        await sendBLE(
            "MODE_SENIOR"
        );

    }
    else {

        $("childPanel")
            .classList.remove("hidden");

        $("seniorPanel")
            .classList.add("hidden");


        $("btnModeToggle")
            .textContent =
            "🧒 兒童模式";


        $("btnModeToggle")
            .classList.remove(
                "bg-red-500"
            );

        $("btnModeToggle")
            .classList.add(
                "bg-purple-600"
            );


        seniorRunning =
            false;


        await sendBLE(
            "MODE_CHILD"
        );
    }
}


// =====================================================
// 主題
// =====================================================

document
    .querySelectorAll(".theme-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document

// 難度

document

                button.classList.add(

                seniorLevel =
                    button.dataset.level;

// =====================================================
// 生成兒童故事
// =====================================================

async function generateStory() {

    if (busy) {
        return;
    }


    busy = true;

    waitingForAction =
        false;


    let topic =
        $("customTopic")
            .value
            .trim();


    if (!topic) {

        topic =
            selectedTheme;
    }


    $("storyDisplay").textContent =
        "AI 正在創作故事...";


    $("actionPrompt").textContent =
        "請稍候";


    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/story",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        mode:
                            "child",

                        topic:
                            topic,

                        difficulty:
                            "easy"
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Worker 回應錯誤"
            );
        }


        const data =
            await response.json();


        currentStory =
            data.story || "";


        expectedAction =
            data.action || "";


        history = [];


        $("storyDisplay")
            .textContent =
            currentStory;


        $("actionPrompt")
            .textContent =
            actionLabel(
                expectedAction
            );


        $("actionSubText")
            .textContent =
            "請完成上面的動作";


        waitingForAction =
            true;


        speak(
            currentStory
        );


        setTimeout(() => {

            speakAction(
                expectedAction
            );

        }, 700);


        await sendBLE(
            "START_STORY"
        );

    }
    catch (error) {

        console.error(
            error
        );


        $("storyDisplay")
            .textContent =
            "故事生成失敗，請確認網路連線。";


        speak(
            "故事生成失敗，請確認網路連線。"
        );
    }


    busy = false;
}


// =====================================================
// 兒童動作
// =====================================================

async function handleChildAction(
    action
) {

    if (!waitingForAction) {
        return;
    }


    if (busy) {
        return;
    }


    // ================================================
    // 錯誤
    // ================================================

    if (
        action !== expectedAction
    ) {

        showToast(
            "❌ 失敗，再試一次！"
        );


        $("childResult")
            .textContent =
            "❌ 失敗，再試一次！";


        $("childResult")
            .className =
            "text-center font-bold mt-4 failure";


        speakFailure();


        await sendBLE(
            "ACTION_FAIL"
        );


        $("actionSubText")
            .textContent =
            "目前需要：" +
            actionLabel(
                expectedAction
            );


        return;
    }


    // ================================================
    // 成功
    // ================================================

    busy = true;

    waitingForAction =
        false;


    showToast(
        "🎉 成功！"
    );


    $("childResult")
        .textContent =
        "🎉 成功！做得很好！";


    $("childResult")
        .className =
        "text-center font-bold mt-4 success";


    speakSuccess();


    await sendBLE(
        "ACTION_OK"
    );


    // ================================================
    // 下一段
    // ================================================

    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/action",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        mode:
                            "child",

                        topic:
                            selectedTheme,

                        difficulty:
                            "easy",

                        action:
                            action,

                        currentStory:
                            currentStory,

                        recentActions:
                            history
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Worker 回應錯誤"
            );
        }


        const data =
            await response.json();


        if (data.done) {

            currentStory =
                data.story ||
                "故事完成了！";


            $("storyDisplay")
                .textContent =
                currentStory;


            $("actionPrompt")
                .textContent =
                "🎉 故事完成！";


            $("actionSubText")
                .textContent =
                "你完成了這次冒險！";


            speak(
                "故事完成了！你完成了這次冒險！"
            );


            busy = false;

            return;
        }


        currentStory =
            data.story || "";


        expectedAction =
            data.action || "";


        history.push(
            expectedAction
        );


        if (
            history.length > 5
        ) {

            history =
                history.slice(-5);
        }


        $("storyDisplay")
            .textContent =
            currentStory;


        $("actionPrompt")
            .textContent =
            actionLabel(
                expectedAction
            );


        $("actionSubText")
            .textContent =
            "請完成下一個動作";


        $("childResult")
            .textContent =
            "";


        speak(
            currentStory
        );


        setTimeout(() => {

            speakAction(
                expectedAction
            );

        }, 600);


        waitingForAction =
            true;


        await sendBLE(
            "START_STORY"
        );

    }
    catch (error) {

        console.error(
            error
        );


        speak(
            "取得下一段故事失敗。"
        );


        $("childResult")
            .textContent =
            "⚠️ 下一段故事取得失敗";
    }


    busy = false;
}


// =====================================================
// 長輩故事開始
// =====================================================

async function startSeniorActivity() {

    if (seniorRunning) {
        return;
    }


    seniorRunning =
        true;


    seniorRoundIndex =
        1;


    seniorRecentActions =
        [];


    seniorExpectedAction =
        "";


    seniorCurrentStory =
        "";


    $("seniorRound")
        .textContent =
        "第 1 回合";


    $("seniorStory")
        .textContent =
        "AI 正在準備故事...";


    $("seniorInstruction")
        .textContent =
        "請稍候";


    $("seniorResult")
        .textContent =
        "";


    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/story",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        mode:
                            "senior",

                        topic:
                            selectedTheme,

                        difficulty:
                            seniorLevel
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Worker 回應錯誤"
            );
        }


        const data =
            await response.json();


        seniorCurrentStory =
            data.story || "";


        seniorExpectedAction =
            data.action || "";


        if (
            !seniorExpectedAction
        ) {

            throw new Error(
                "Worker 沒有回傳 action"
            );
        }


        seniorRecentActions.push(
            seniorExpectedAction
        );


        $("seniorStory")
            .textContent =
            seniorCurrentStory;


        $("seniorInstruction")
            .textContent =
            actionLabel(
                seniorExpectedAction
            );


        $("seniorResult")
            .textContent =
            "請依照提示完成動作";


        speak(
            seniorCurrentStory
        );


        setTimeout(() => {

            speakAction(
                seniorExpectedAction
            );

        }, 600);


        await sendBLE(
            "START_STORY"
        );

    }
    catch (error) {

        console.error(
            error
        );


        seniorRunning =
            false;


        $("seniorStory")
            .textContent =
            "故事開始失敗";


        $("seniorInstruction")
            .textContent =
            "請確認網路連線";


        speak(
            "故事開始失敗，請確認網路連線。"
        );
    }
}


// =====================================================
// 長輩動作
// =====================================================

async function handleSeniorAction(
    action
) {

    if (!seniorMode) {
        return;
    }


    if (!seniorRunning) {
        return;
    }


    if (!seniorExpectedAction) {
        return;
    }


    // ================================================
    // 錯誤
    // ================================================

    if (
        action !== seniorExpectedAction
    ) {

        $("seniorResult")
            .textContent =
            "❌ 失敗，再試一次。";


        $("seniorResult")
            .className =
            "text-center font-bold mt-5 failure";


        speakFailure();


        await sendBLE(
            "ACTION_FAIL"
        );


        return;
    }


    // ================================================
    // 成功
    // ================================================

    $("seniorResult")
        .textContent =
        "🎉 成功！做得很好！";


    $("seniorResult")
        .className =
        "text-center font-bold mt-5 success";


    speakSuccess();


    await sendBLE(
        "ACTION_OK"
    );


    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/action",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        mode:
                            "senior",

                        topic:
                            selectedTheme,

                        difficulty:
                            seniorLevel,

                        action:
                            action,

                        currentStory:
                            seniorCurrentStory,

                        recentActions:
                            seniorRecentActions
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Worker 回應錯誤"
            );
        }


        const data =
            await response.json();


        // ==========================================
        // 故事完成
        // ==========================================

        if (data.done) {

            seniorRunning =
                false;


            seniorExpectedAction =
                "";


            $("seniorStory")
                .textContent =
                data.story ||
                "故事完成了！";


            $("seniorInstruction")
                .textContent =
                "🎉 故事完成！";


            $("seniorResult")
                .textContent =
                "今天的冒險完成了！";


            speak(
                "故事完成了！今天的冒險完成了！"
            );


            return;
        }


        // ==========================================
        // 下一段
        // ==========================================

        seniorRoundIndex++;


        seniorCurrentStory =
            data.story || "";


        seniorExpectedAction =
            data.action || "";


        if (
            seniorExpectedAction
        ) {

            seniorRecentActions.push(
                seniorExpectedAction
            );
        }


        if (
            seniorRecentActions.length > 5
        ) {

            seniorRecentActions =
                seniorRecentActions.slice(-5);
        }


        $("seniorRound")
            .textContent =
            "第 " +
            seniorRoundIndex +
            " 回合";


        $("seniorStory")
            .textContent =
            seniorCurrentStory;


        $("seniorInstruction")
            .textContent =
            actionLabel(
                seniorExpectedAction
            );


        $("seniorResult")
            .textContent =
            "請依照提示完成下一個動作";


        speak(
            seniorCurrentStory
        );


        setTimeout(() => {

            speakAction(
                seniorExpectedAction
            );

        }, 600);


        await sendBLE(
            "START_STORY"
        );

    }
    catch (error) {

        console.error(
            error
        );


        $("seniorResult")
            .textContent =
            "⚠️ 下一段故事取得失敗";


        speak(
            "取得下一段故事失敗。"
        );
    }
}

$("btnSpeak")
    .addEventListener(

            if (currentStory) {

                setTimeout(() => {

                    speakAction(

$("btnModeToggle")
    .addEventListener(

        () => {

            setMode(
                !seniorMode
            );
        }

// =====================================================

$("btnConnect")
    .addEventListener(
        "click",
        connectBLE
    );

$("btnGenerate")
    .addEventListener(
        "click",
        generateStory
    );


// =====================================================
// 長輩開始
// =====================================================

$("btnSeniorStart")
    .addEventListener(
        "click",
        startSeniorActivity
    );


// =====================================================
// 手動測試
// =====================================================

$("btnManualAction")
    .addEventListener(
        "click",
        () => {

            if (seniorMode) {

                if (
                    seniorExpectedAction
                ) {

                    handleSeniorAction(
                        seniorExpectedAction
                    );
                }

            }
            else {

                if (
                    expectedAction
                ) {

                    handleChildAction(
                        expectedAction
                    );
                }
            }
        }
    );


// =====================================================
// 長輩手動測試
// =====================================================

$("btnSeniorManual")
    .addEventListener(
        "click",
        () => {

            if (
                seniorExpectedAction
            ) {

                handleSeniorAction(
                    seniorExpectedAction
                );
            }
        }
    );


// =====================================================
// 預設模式
// =====================================================

setMode(false);

</script>
