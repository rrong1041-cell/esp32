<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聲動奇境 - 體感互動系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'NotoSans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- 頂部標題列 -->
    <header class="flex justify-between items-center max-w-4xl mx-auto w-full bg-slate-900/80 border border-slate-800 px-6 py-4 rounded-2xl backdrop-blur-md shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <h1 class="font-black text-lg tracking-wide bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">聲動奇境</h1>
                <p class="text-xs text-slate-400" id="modeSubtitle">AI 體感互動冒險系統</p>
            </div>
        </div>

        <!-- 模式切換與藍牙狀態 -->
        <div class="flex items-center gap-3">
            <div class="flex bg-slate-950 border border-slate-800 p-1 rounded-xl">
                <button onclick="switchMode('child')" id="btnModeChild" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow">兒童模式</button>
                <button onclick="switchMode('senior')" id="btnModeSenior" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">長輩模式</button>
            </div>
            <button onclick="connectBluetooth()" id="btnBle" class="flex items-center gap-2 bg-slate-900 border border-slate-700 hover:border-emerald-500 px-4 py-2 rounded-xl text-xs font-bold transition-all">
                <i class="fa-brands fa-bluetooth text-cyan-400"></i>
                <span id="bleText">連接手環</span>
            </button>
        </div>
    </header>

    <!-- 主畫面容器 -->
    <main class="max-w-4xl mx-auto w-full my-6 flex-1 flex flex-col justify-center">
        
        <!-- 初始設定畫面 (選擇主題或難度) -->
        <section id="setupSection" class="bg-slate-900/60 border border-slate-800 rounded-3xl p-8 backdrop-blur-md shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 rounded-2xl bg-emerald-500/10 text-emerald-400 text-2xl mb-1">
                    <i class="fa-solid fa-compass" id="setupIcon"></i>
                </div>
                <h2 class="text-2xl font-black tracking-wide" id="setupTitle">準備好展開今日冒險了嗎？</h2>
                <p class="text-sm text-slate-400" id="setupDesc">選擇喜愛的故事主題，跟著語音與體感手環一起探索奇幻世界。</p>
            </div>

            <!-- 動態主題或難度選單區塊 -->
            <div class="space-y-3" id="themeButtonsContainer">
                <!-- 預設由 JS 渲染 -->
            </div>

            <!-- 開始按鈕 -->
            <button onclick="generateStory()" id="btnGenerate" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black text-base shadow-lg shadow-emerald-500/20 hover:opacity-95 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-play" id="btnIcon"></i>
                <span id="btnText">開始精彩故事冒險</span>
            </button>
        </section>

        <!-- 互動進行中畫面 (預設隱藏) -->
        <section id="gameSection" class="hidden bg-slate-900/60 border border-slate-800 rounded-3xl p-8 backdrop-blur-md shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <span id="currentStatusTag" class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-bold border border-emerald-500/20">冒險進行中</span>
                <button onclick="resetGame()" class="text-xs text-slate-400 hover:text-white transition-all"><i class="fa-solid fa-rotate-left mr-1"></i>重新開始</button>
            </div>

            <!-- AI 故事文字顯示 -->
            <div class="bg-slate-950/80 border border-slate-800/80 rounded-2xl p-6 min-h-[140px] flex items-center">
                <p id="storyText" class="text-lg md:text-xl leading-relaxed text-slate-200 font-medium">載入故事中...</p>
            </div>

            <!-- 目標動作指示 -->
            <div class="bg-gradient-to-r from-emerald-950/40 to-cyan-950/40 border border-emerald-500/30 rounded-2xl p-6 text-center space-y-2">
                <p class="text-xs uppercase tracking-widest text-emerald-400 font-bold">請完成下列動作指令</p>
                <h3 id="actionLabel" class="text-2xl md:text-3xl font-black text-white">等待指令...</h3>
            </div>
        </section>
    </main>

    <!-- 底部資訊 -->
    <footer class="text-center text-xs text-slate-500 max-w-4xl mx-auto w-full">
        聲動奇境 AI Interactive System &bull; Powered by Cloudflare Workers AI
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // ==========================================
        // 請在此填入您的 Cloudflare Worker 網址
        // ==========================================
        const WORKER_URL = "https://your-worker-subdomain.workers.dev"; 

        let currentMode = 'child'; // 'child' 或 'senior'
        let selectedTheme = '魔法森林探險';
        let selectedDifficulty = 1; // 長輩模式難度 (1, 2, 3)
        let currentStory = "";
        let currentAction = "";
        let isWaitingAI = false;

        // 藍牙變數
        let bluetoothDevice = null;
        let rxCharacteristic = null;

        const $ = (id) => document.getElementById(id);

        // 初始化畫面主題按鈕
        function initThemeButtons() {
            const container = $('themeButtonsContainer');
            if (currentMode === 'child') {
                container.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <button onclick="selectTheme('魔法森林探險')" class="theme-btn p-4 rounded-2xl border text-left transition-all bg-emerald-950/40 border-emerald-500 text-white font-bold text-sm flex flex-col gap-1">
                            <i class="fa-solid fa-tree text-emerald-400"></i> 魔法森林探險
                        </button>
                        <button onclick="selectTheme('太空星際漫遊')" class="theme-btn p-4 rounded-2xl border text-left transition-all bg-slate-900 border-slate-800 text-slate-300 font-bold text-sm flex flex-col gap-1">
                            <i class="fa-solid fa-rocket text-cyan-400"></i> 太空星際漫遊
                        </button>
                        <button onclick="selectTheme('深海尋寶奇航')" class="theme-btn p-4 rounded-2xl border text-left transition-all bg-slate-900 border-slate-800 text-slate-300 font-bold text-sm flex flex-col gap-1">
                            <i class="fa-solid fa-water text-blue-400"></i> 深海尋寶奇航
                        </button>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <input type="text" id="customTopicInput" placeholder="或者輸入自訂故事主題..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>
                `;
            } else {
                // 長輩模式：顯示難度 1、2、3 選擇
                container.innerHTML = `
                    <div class="space-y-3">
                        <label class="text-xs text-slate-400 font-bold">選擇坐姿健康操活動難度：</label>
                        <div class="grid grid-cols-3 gap-2" id="difficultyButtonsContainer">
                            <button data-difficulty="1" onclick="selectDifficulty(1)" class="diff-btn ${selectedDifficulty === 1 ? 'bg-emerald-900/50 border-emerald-500 text-emerald-200' : 'bg-slate-900 border-slate-800 text-slate-400'} border py-3 px-2 rounded-xl text-xs font-bold transition-all">
                                🟢 難度 1<br><span class="text-[10px] opacity-80">輕鬆伸展</span>
                            </button>
                            <button data-difficulty="2" onclick="selectDifficulty(2)" class="diff-btn ${selectedDifficulty === 2 ? 'bg-emerald-900/50 border-emerald-500 text-emerald-200' : 'bg-slate-900 border-slate-800 text-slate-400'} border py-3 px-2 rounded-xl text-xs font-bold transition-all">
                                🟡 難度 2<br><span class="text-[10px] opacity-80">標準流暢</span>
                            </button>
                            <button data-difficulty="3" onclick="selectDifficulty(3)" class="diff-btn ${selectedDifficulty === 3 ? 'bg-emerald-900/50 border-emerald-500 text-emerald-200' : 'bg-slate-900 border-slate-800 text-slate-400'} border py-3 px-2 rounded-xl text-xs font-bold transition-all">
                                🔴 難度 3<br><span class="text-[10px] opacity-80">進階挑戰</span>
                            </button>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <input type="text" id="customTopicInput" placeholder="或者輸入自訂健康操主題..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                `;
            }
        }

        function selectTheme(theme) {
            selectedTheme = theme;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.className = "theme-btn p-4 rounded-2xl border text-left transition-all bg-slate-900 border-slate-800 text-slate-300 font-bold text-sm flex flex-col gap-1";
            });
            event.currentTarget.className = "theme-btn p-4 rounded-2xl border text-left transition-all bg-emerald-950/40 border-emerald-500 text-white font-bold text-sm flex flex-col gap-1";
        }

        function selectDifficulty(diff) {
            selectedDifficulty = diff;
            initThemeButtons(); // 重新渲染以更新樣式
        }

        // 切換兒童 / 長輩模式
        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'child') {
                $('btnModeChild').className = "px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow";
                $('btnModeSenior').className = "px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                $('modeSubtitle').textContent = "AI 體感互動冒險系統";
                $('setupIcon').className = "fa-solid fa-compass";
                $('setupTitle').textContent = "準備好展開今日冒險了嗎？";
                $('setupDesc').textContent = "選擇喜愛的故事主題，跟著語音與體感手環一起探索奇幻世界。";
                $('btnText').textContent = "開始精彩故事冒險";
            } else {
                $('btnModeSenior').className = "px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow";
                $('btnModeChild').className = "px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                $('modeSubtitle').textContent = "AI 坐姿健康操與關節伸展";
                $('setupIcon').className = "fa-solid fa-heart-pulse";
                $('setupTitle').textContent = "準備好開始今日健康活動了嗎？";
                $('setupDesc').textContent = "選擇安全坐姿伸展難度，跟著語音指令輕鬆活動筋骨。";
                $('btnText').textContent = "開始健康坐姿活動";
            }
            initThemeButtons();
            resetGame();
        }

        // 產生故事與呼叫 AI
        async function generateStory() {
            if (isWaitingAI) return;
            isWaitingAI = true;

            const custom = $('customTopicInput') ?$('customTopicInput').value.trim() : "";
            const btn = $('btnGenerate');$('btnText').textContent = currentMode === 'senior' ? `正在規劃難度 ${selectedDifficulty} 健康活動...` : 'AI 正在編寫冒險...';
            $('btnIcon').className = 'fa-solid fa-spinner animate-spin';
            btn.disabled = true;

            try {
                const requestBody = {
                    mode: currentMode,
                    difficulty: selectedDifficulty
                };

                if (currentMode === 'child') {
                    requestBody.topic = custom || selectedTheme;
                } else {
                    requestBody.topic = custom || `長輩坐姿健康操 難度${selectedDifficulty}`;
                }

                const res = await fetch(WORKER_URL + '/api/story', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await res.json();
                handleStoryResponse(data);

            } catch (error) {
                console.error("API 錯誤：", error);
                alert("無法連線到 AI 伺服器，請檢查網路或 Worker 網址。");
            } finally {
                isWaitingAI = false;
                btn.disabled = false;
                $('btnIcon').className = 'fa-solid fa-play';$('btnText').textContent = currentMode === 'senior' ? '開始健康坐姿活動' : '開始精彩故事冒險';
            }
        }

        function handleStoryResponse(data) {
            currentStory = data.story;
            currentAction = data.action;

            $('storyText').textContent = currentStory;
            $('actionLabel').textContent = data.actionLabel || "請依照提示操作";

            // 切換畫面
            $('setupSection').classList.add('hidden');$('gameSection').classList.remove('hidden');
        }

        // 接收到手環動作後推進故事
        async function handleDeviceAction(actionValue) {
            if (isWaitingAI) return;
            isWaitingAI = true;

            $('storyText').textContent = "AI 正在接收動作並產生下一段內容...";
            $('actionLabel').className = "text-2xl md:text-3xl font-black text-emerald-400 animate-pulse";

            try {
                const requestBody = {
                    mode: currentMode,
                    difficulty: selectedDifficulty,
                    topic: currentMode === 'child' ? selectedTheme : `長輩坐姿健康操 難度${selectedDifficulty}`,
                    currentStory: currentStory,
                    action: actionValue
                };

                const res = await fetch(WORKER_URL + '/api/story', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await res.json();
                
                if (data.done) {
                    $('storyText').textContent = data.story;
                    $('actionLabel').textContent = "🎉 活動圓滿結束！";
                    setTimeout(() => { resetGame(); }, 5000);
                } else {
                    handleStoryResponse(data);
                }
            } catch (error) {
                console.error("推進故事錯誤：", error);
            } finally {
                isWaitingAI = false;
            }
        }

        function resetGame() {
            $('setupSection').classList.remove('hidden');$('gameSection').classList.add('hidden');
            currentStory = "";
            currentAction = "";
        }

        // ==========================================
        // 藍牙連線與接收 ESP32 資料
        // ==========================================
        async function connectBluetooth() {
            try {
                $('bleText').textContent = "搜尋中...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e'] // 通常 Nordic UART Service
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                rxCharacteristic = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');

                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const decoder = new TextDecoder('utf-8');
                    const value = decoder.decode(event.target.value).trim();
                    console.log("收到手環訊號:", value);
                    
                    // 當收到 ESP32 傳來的動作代碼時，自動推進劇情
                    if (value) {
                        handleDeviceAction(value);
                    }
                });

                $('bleText').textContent = "手環已連線";
                $('btnBle').classList.add('border-emerald-500', 'bg-emerald-950/40');
            } catch (error) {
                console.error("藍牙連線失敗:", error);
                $('bleText').textContent = "連接失敗";
            }
        }

        // 頁面載入初始化
        window.onload = () => {
            initThemeButtons();
        };
    </script>
</body>
</html>
