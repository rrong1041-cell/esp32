function removeEmoji(text) {

    if (!text)
        return '';


    try {

        return text
            .replace(
                /[\p{Extended_Pictographic}\uFE0F]/gu,
                ''
            )
            .replace(
                /\s{2,}/g,
                ' '
            )
            .trim();

    }

    catch {

        return text.trim();

    }

}

function getSentenceEmotion(text) {

    const profile =
        EMOTION_PROFILES[
            voiceSettings.emotion
        ]
        ||
        EMOTION_PROFILES.natural;


    let rate =
        Number(
            voiceSettings.rate
        ) *
        profile.rate;


    let pitch =
        Number(
            voiceSettings.pitch
        ) *
        profile.pitch;


    if (/！!/.test(text)) {

        rate *= 1.04;

        pitch *= 1.07;

    }


    if (/？\?/.test(text)) {

        pitch *= 1.05;

    }


    if (
        /危險|快跑|救命|小心|怪獸|糟糕|逃|攻擊|火焰/.test(text)
    ) {

        rate *= 1.06;

        pitch *= 1.06;

    }


    if (
        /慢慢|輕輕|溫柔|放心|安心|休息/.test(text)
    ) {

        rate *= .94;

        pitch *= .96;

    }


    return {

        rate:
            Math.max(
                .65,
                Math.min(
                    1.35,
                    rate
                )
            ),

        pitch:
            Math.max(
                .5,
                Math.min(
                    2,
                    pitch
                )
            )

    };

}


function stopSpeech() {

    speechToken++;


    try {

        speechSynthesis.cancel();

    }

    catch(e) {}


    speechPlaying =
        false;

}


async function speak(text) {

    if (

        !text ||

        !('speechSynthesis' in window)

    ) {

        return;

    }


    const clean =
        removeEmoji(text);


    if (!clean)
        return;


    stopSpeech();


    const token =
        speechToken;


    speechPlaying =
        true;


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    const emotion =
        getSentenceEmotion(
            clean
        );


    if (selectedVoice) {

        utterance.voice =
            selectedVoice;


        utterance.lang =
            selectedVoice.lang ||
            'zh-TW';

    }

    else {

        utterance.lang =
            'zh-TW';

    }


    utterance.rate =
        emotion.rate;


    utterance.pitch =
        emotion.pitch;


    utterance.volume =
        voiceSettings.volume;


    await new Promise(
        resolve => {

            let finished =
                false;


            let timer =
                null;


            const finish =
                () => {

                    if (finished)
                        return;


                    finished =
                        true;


                    clearTimeout(
                        timer
                    );


                    resolve();

                };


            utterance.onend =
                finish;


            utterance.onerror =
                finish;


            timer =
                setTimeout(
                    finish,
                    Math.max(
                        7000,
                        clean.length *
                        500 /
                        Math.max(
                            emotion.rate,
                            .5
                        )
                    )
                );


            try {

                speechSynthesis.speak(
                    utterance
                );

            }

            catch(e) {

                finish();

            }

        }
    );


    if (
        token === speechToken
    ) {

        speechPlaying =
            false;

    }

}

async function connectBLE() {

    if (!navigator.bluetooth) {

        showToast(
            '此瀏覽器不支援 Web Bluetooth。'
        );

        return;

    }


    try {

        showToast(
            '正在搜尋故事裝置……'
        );


        bleDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices:
                    true,

                optionalServices:[
                    BLE_CONFIG.serviceUuid
                ]

            });


        bleDevice.addEventListener(
            'gattserverdisconnected',
            () => {

                $('statusIndicator').className =
                    'w-4 h-4 rounded-full bg-slate-500 inline-block shadow';


                $('statusText').textContent =
                    '已斷線';


                $('statusIcon').className =
                    'fa-solid fa-plug-circle-xmark text-slate-500 text-xl';


                bleCharacteristic =
                    null;


                showToast(
                    '故事裝置已斷線'
                );

            }
        );


        const server =
            await bleDevice.gatt.connect();


        const service =
            await server.getPrimaryService(
                BLE_CONFIG.serviceUuid
            );


        bleCharacteristic =
            await service.getCharacteristic(
                BLE_CONFIG.characteristicUuid
            );


        await bleCharacteristic.startNotifications();


        bleCharacteristic.addEventListener(
            'characteristicvaluechanged',
            onBleEvent
        );


        $('statusIndicator').className =
            'w-4 h-4 rounded-full bg-emerald-500 inline-block shadow-lg animate-pulse';


        $('statusText').textContent =
            '已連線';


        $('statusIcon').className =
            'fa-solid fa-plug-circle-check text-emerald-400 text-xl';


        await sendBLE(
            'READY'
        );


        showToast(
            '藍牙連線成功！'
        );

    }

    catch(e) {

        console.error(e);


        showToast(
            '藍牙連線失敗：' +
            e.message
        );

    }

}


async function onBleEvent(event) {

    const value =
        new TextDecoder()
        .decode(
            event.target.value
        )
        .trim()
        .toUpperCase();


    console.log(
        '收到硬體訊號：',
        value
    );


    if (

        value ===
        'SWITCH_MODE_SENIOR'

        ||

        value ===
        'MODE_SENIOR'

    ) {

        await switchMode(
            'senior',
            false
        );

        return;

    }


    if (

        value ===
        'SWITCH_MODE_CHILD'

        ||

        value ===
        'MODE_CHILD'

    ) {

        await switchMode(
            'child',
            false
        );

        return;

    }


    if (
        !waitingForAction ||
        busy
    ) {

        return;

    }


    const now =
        Date.now();


    if (
        now - lastActionTime <
        1500
    ) {

        return;

    }


    const expected =
        String(
            expectedAction ||
            ''
        )
        .trim()
        .toUpperCase();


    if (
        value === expected
    ) {

        lastActionTime =
            now;


        await handleAction(
            expected
        );

    }

}


async function sendBLE(command) {

    if (!bleCharacteristic)
        return;


    try {

        await bleCharacteristic.writeValue(
            new TextEncoder().encode(
                command
            )
        );

    }

    catch(e) {

        console.error(
            'BLE 傳送失敗',
            e
        );

    }

}

   ⭐ Gemini API
===================================================== */


/*
 * 將 Gemini 回傳的文字轉成 JSON。
 *
 * 有些模型會乖乖只回 JSON，
 * 有些情況可能會包：
 *
 * ```json
 * {...}
 * ```
 *
 * 所以這裡會自動清掉 Markdown。
 */

function cleanGeminiJSON(text) {

    if (!text)
        throw new Error(
            'Gemini 沒有回傳內容。'
        );


    let cleaned =
        String(text)
        .trim();


    cleaned =
        cleaned.replace(
            /^```json\s*/i,
            ''
        );


    cleaned =
        cleaned.replace(
            /^```\s*/i,
            ''
        );


    cleaned =
        cleaned.replace(
            /\s*```$/i,
            ''
        );


    /*
     * 如果前後還有其他文字，
     * 嘗試抓第一個 { 到最後一個 }。
     */

    const first =
        cleaned.indexOf('{');


    const last =
        cleaned.lastIndexOf('}');


    if (
        first >= 0 &&
        last > first
    ) {

        cleaned =
            cleaned.slice(
                first,
                last + 1
            );

    }


    try {

        return JSON.parse(
            cleaned
        );

    }

    catch(e) {

        console.error(
            'Gemini 原始內容：',
            text
        );


        throw new Error(
            'Gemini 回傳的故事格式無法讀取。'
        );

    }

}

例如可以從：

- 一場比賽
- 一個普通日常
- 一封信
- 一場節慶
- 一個奇怪的傳聞
- 一個正在進行的任務
- 一場旅行
- 一個角色正在尋找某件東西
- 一個已經發生一半的事件
- 一個看似平凡但逐漸不對勁的場景
- 一段角色之間的對話
- 一個重要物品被發現
- 一場暴風雨
- 一個錯誤的選擇
- 一個倒數中的事件

而且每次生成都應該盡量不同。

【故事風格】

希望有：

- 動畫電影般的畫面感
- 有記憶點的角色
- 探索感
- 世界觀
- 角色之間自然對話
- 緊張與放鬆交替
- 冒險感
- 中段轉折
- 最後的高潮
- 溫暖或令人印象深刻的結局

可以有類似大型奇幻冒險遊戲的「探索 → 發現 → 危機 → 戰鬥 → 平靜 → 真相 → 最終挑戰」節奏，
但不要抄襲任何現有作品、角色或台詞。

【互動設計】

每一幕最多安排一個主要體感動作。

動作只能從：

SWIPE_LEFT
SWIPE_RIGHT
JUMP
SHAKE
RUN
ARM_UP
ARM_DOWN
TILT_LEFT
TILT_RIGHT
HOLD_UP

選擇。

動作必須自然融入劇情。

不要為了塞動作而塞動作。

例如：

錯誤：
「前面有東西，現在搖一搖。」

好的：
「藤蔓纏住了船舵，船身開始偏向礁石。主角必須迅速把纏住船舵的藤蔓甩開。」

然後：
action = SHAKE

【動作必須影響故事】

完成動作後，下一幕應該感覺像是：

「因為剛才玩家成功完成了動作，所以故事發生了變化。」

例如：

玩家向左閃避
→ 巨獸撞碎右邊的橋
→ 主角因此被迫走另一條路
→ 發現新的秘密。

而不是：

玩家做完動作
→ 「很好！」
→ 完全重新開始另一件事。

【11 幕節奏】

第 1 幕：
建立世界與事件。
必須讓人想知道接下來會發生什麼。

第 2 幕：
玩家開始探索。
出現第一個線索。

第 3 幕：
主角與夥伴關係開始建立。
出現新的問題。

第 4 幕：
第一次重大危機。

第 5 幕：
暫時脫離危險，探索或角色交流。
可以埋下重要伏筆。

第 6 幕：
中段轉折。
主角發現之前理解的事情可能是錯的。

第 7 幕：
新的目標。
故事開始加速。

第 8 幕：
危機擴大。
角色必須做出選擇。

第 9 幕：
接近最終地點或真相。
回收部分前面的伏筆。

第 10 幕：
最終挑戰。
情緒與危險達到最高點。

第 11 幕：
完整結局。
解決主要問題。
回收重要伏筆。
讓角色的經歷產生意義。
不要寫「冒險才正要開始」。
不要寫「未完待續」。

【故事長度】

每一幕 story 約 120～220 個中文字。

不要過短。

但是也不要一次生成幾千字。

【角色】

至少建立：

主角
夥伴

夥伴必須有自己的個性與反應。

不要每一幕都只是工具人。

不要 Markdown。

不要 ```json。

/* =====================================================
   驗證故事
===================================================== */

function validateStoryPlan(
    plan
) {

    if (
        !plan ||
        typeof plan !== 'object'
    ) {

        throw new Error(
            '故事資料格式錯誤。'
        );

    }


    if (
        !Array.isArray(
            plan.chapters
        )
    ) {

        throw new Error(
            'Gemini 沒有產生 11 幕故事。'
        );

    }


    if (
        plan.chapters.length !== 11
    ) {

        throw new Error(
            `Gemini 產生了 ${plan.chapters.length} 幕，應該是 11 幕。`
        );

    }


    for (
        let i = 0;
        i < 11;
        i++
    ) {

        const chapter =
            plan.chapters[i];


        if (
            Number(
                chapter.round
            ) !==
            i + 1
        ) {

            throw new Error(
                '故事幕數順序錯誤。'
            );

        }


        if (
            !chapter.story
        ) {

            throw new Error(
                `第 ${i + 1} 幕沒有故事內容。`
            );

        }


        if (
            i < 10
        ) {

            if (
                !VALID_ACTIONS.includes(
                    String(
                        chapter.action ||
                        ''
                    )
                    .toUpperCase()
                )
            ) {

                throw new Error(
                    `第 ${i + 1} 幕的動作無效：` +
                    chapter.action
                );

            }

        }

    }


    /*
     * 第 11 幕一定是結局，
     * 不要求動作。
     */

    plan.chapters[10].action =
        '';

    plan.chapters[10].actionNarration =
        '';

}


/* =====================================================
   取得目前章節
===================================================== */

function getCurrentChapter() {

    if (!storyPlan)
        return null;


    const index =
        currentRound - 1;


    if (
        index < 0 ||
        index >= storyPlan.chapters.length
    ) {

        return null;

    }


    return storyPlan.chapters[index];

}

===================================================== */

function appendStory(
    title,
    text
) {

    const display =
        $('storyDisplay');


    const box =
        document.createElement(
            'div'
        );


    box.className =
        'p-4 rounded-xl bg-slate-900/70 border border-slate-800';


    const titleEl =
        document.createElement(
            'div'
        );


    titleEl.className =
        currentMode === 'senior'

            ?

        'text-xs font-bold text-emerald-300 mb-2'

            :

        'text-xs font-bold text-purple-300 mb-2';


    titleEl.textContent =
        title;


    box.appendChild(
        titleEl
    );


    const p =
        document.createElement(
            'p'
        );


    p.className =
        'text-slate-200';


    p.textContent =
        text;


    box.appendChild(
        p
    );


    display.appendChild(
        box
    );


    $('storyScroll').scrollTop =
        $('storyScroll').scrollHeight;

}


/* =====================================================
   動作
===================================================== */

function showAction(data) {

    const action =
        String(
            data?.action ||
            ''
        )
        .trim()
        .toUpperCase();


    if (!action) {

        waitingForAction =
            false;


        expectedAction =
            '';


        $('actionPrompt')
            .classList
            .add('hidden');


        return;

    }


    currentAction =
        action;


    currentActionNarration =
        data?.actionNarration
        ||
        getActionNarration(data);


    currentActionPurpose =
        data?.actionPurpose
        ||
        '完成這個動作，故事就會繼續。';


    expectedAction =
        action;


    waitingForAction =
        true;


    $('actionPrompt')
        .classList
        .remove(
            'hidden',
            'action-locked'
        );


    $('actionPrompt')
        .classList
        .add(
            'action-ready'
        );


    $('promptText').textContent =
        getActionIcon(action) +
        ' ' +
        currentActionNarration;


    $('actionSubText').textContent =
        '💡 ' +
        currentActionPurpose;

}


function lockAction() {

    $('actionPrompt')
        .classList
        .remove(
            'hidden'
        );


    $('actionPrompt')
        .classList
        .add(
            'action-locked'
        );


    $('actionSubText').textContent =
        '🔒 故事正在播放，請先聽完劇情。';

}


/* =====================================================
   結局
===================================================== */

function showEnding(data) {

    waitingForAction =
        false;


    expectedAction =
        '';


    $('actionPrompt')
        .classList
        .remove(
            'hidden'
        );


    $('actionPrompt')
        .classList
        .remove(
            'action-locked'
        );


    $('promptText').textContent =
        currentMode === 'senior'

            ?

        '🎉 活動圓滿完成！'

            :

        '🎉 冒險圓滿結束！';


    $('actionSubText').textContent =
        currentMode === 'senior'

            ?

        '今天的健康活動已完成。'

            :

        '你完成了這場完整的冒險。';


    showToast(
        currentMode === 'senior'
            ? '🎉 活動完成！'
            : '🎉 故事完成！'
    );

}


/* =====================================================
   播放目前章節
===================================================== */

async function playCurrentChapter() {

    const chapter =
        getCurrentChapter();


    if (!chapter)
        return;


    currentStory =
        chapter.story;


    currentAction =
        String(
            chapter.action ||
            ''
        )
        .trim()
        .toUpperCase();


    currentActionNarration =
        chapter.actionNarration ||
        getActionNarration(chapter);


    currentActionPurpose =
        chapter.actionPurpose ||
        '完成這個動作，故事就會繼續。';


    appendStory(

        currentRound === 11

            ?

        '🎉 最終章'

            :

        `📖 第 ${currentRound} 幕・${chapter.title}`,

        chapter.story

    );


    await speak(
        chapter.story
    );


    if (
        currentRound === 11
    ) {

        showEnding({
            completed:true
        });


        return;

    }


    lockAction();


    await speak(
        currentActionNarration
    );


    showAction({

        action:
            currentAction,

        actionNarration:
            currentActionNarration,

        actionPurpose:
            currentActionPurpose

    });

}


/* =====================================================
   完成動作
===================================================== */

async function handleAction(
    action
) {

    if (
        !waitingForAction ||
        busy
    ) {

        return;

    }


    waitingForAction =
        false;


    busy =
        true;


    expectedAction =
        '';


    $('actionSubText').textContent =
        '✨ 動作完成，故事正在回應你的行動……';


    await sendBLE(
        'ACTION_OK'
    );


    stopSpeech();


    try {

        /*
         * 這裡不再呼叫 API。
         *
         * Gemini 已經把完整 11 幕故事放在 storyPlan。
         *
         * 玩家現在完成的動作，
         * 就代表這一幕成功，
         * 接著進入下一幕。
         */

        const oldRound =
            currentRound;


        const oldChapter =
            getCurrentChapter();


        history.push({

            role:
                'player',

            round:
                oldRound,

            action:
                action,

            consequence:
                oldChapter?.consequence ||
                ''

        });


        currentRound++;


        if (
            currentRound >
            maxRound
        ) {

            currentRound =
                maxRound;

        }


        await playCurrentChapter();

    }

    catch(e) {

        console.error(e);


        showToast(
            '故事播放失敗：' +
            e.message
        );


        showAction({

            action:
                action,

            actionPurpose:
                currentActionPurpose

        });

    }

    finally {

        busy =
            false;

    }

}


/* =====================================================
   開始新故事
===================================================== */

async function generateStory() {

    if (busy)
        return;


    const custom =
        $('customTopicInput')
        .value
        .trim();


    const topic =
        custom ||
        selectedTheme;


    if (!topic) {

        showToast(
            '請先選擇或輸入主題。'
        );


        return;

    }


    resetAdventure();


    primeSpeech();


    busy =
        true;


    const btn =
        $('btnGenerate');


    btn.disabled =
        true;


    $('btnText').textContent =
        currentMode === 'senior'

            ?

        'AI 正在安排完整活動……'

            :

        'AI 正在創造完整冒險……';


    $('btnIcon').className =
        'fa-solid fa-spinner animate-spin';


    try {

        showToast(
            '🪄 Gemini 正在設計完整 11 幕冒險……'
        );


        /*
         * ⭐⭐⭐
         * 只呼叫 Gemini 一次。
         */

        storyPlan =
            await generateGeminiStory(
                topic
            );


        /*
         * 初始化遊戲狀態。
         */

        currentRound =
            1;


        maxRound =
            11;


        history = [

            {

                role:
                    'user',

                topic:
                    topic,

                mode:
                    currentMode,

                difficulty:
                    selectedDifficulty

            }

        ];


        $('welcomeMessage')
            .classList
            .add('hidden');


        $('storyDisplay').innerHTML =
            '';


        $('storyDisplay')
            .classList
            .remove(
                'hidden'
            );


        /*
         * 顯示故事標題。
         */

        if (
            storyPlan.title
        ) {

            appendStory(
                '✨ ' +
                storyPlan.title,

                storyPlan.world
                    ?

                `故事即將開始。\n\n${storyPlan.world}`

                    :

                '故事即將開始……'
            );


            await speak(
                storyPlan.world ||
                storyPlan.title
            );

        }


        /*
         * 播放第一幕。
         */

        await playCurrentChapter();


        $('btnSpeak').disabled =
            false;


        if (bleCharacteristic) {

            await sendBLE(
                currentMode === 'senior'
                    ? 'START'
                    : 'START_STORY'
            );

        }


        showToast(
            '✨ 完整 11 幕冒險建立完成！'
        );

    }

    catch(e) {

        console.error(
            'Gemini 故事生成失敗：',
            e
        );


        showToast(
            '故事生成失敗：' +
            e.message
        );


        /*
         * 讓使用者比較容易知道問題。
         */

        $('storyDisplay').innerHTML =
            '';


        $('storyDisplay')
            .classList
            .remove(
                'hidden'
            );


        appendStory(
            '⚠️ Gemini 暫時無法產生故事',
            e.message
        );

    }

    finally {

        $('btnText').textContent =
            currentMode === 'senior'
                ? '開始健康活動'
                : '開始精彩故事冒險';


        $('btnIcon').className =
            'fa-solid fa-wand-magic-sparkles';


        btn.disabled =
            false;


        busy =
            false;

    }

}


function primeSpeech() {

    if (
        'speechSynthesis' in window
    ) {

        try {

            speechSynthesis.getVoices();

        }

        catch(e) {}

    }

}

                () => {

                    const value =
                        $('voiceSelect').value;


                    if (
                        value ===
                        '__AUTO__'
                    ) {

                        selectedVoice =
                            null;


                        voiceSettings.voiceURI =
                            '';


                        saveVoiceSettings();


                        return;

                    }


                    selectedVoice =
                        availableVoices.find(
                            voice =>
                                voice.voiceURI ===
                                value
                        )
                        ||
                        null;


                    voiceSettings.voiceURI =
                        selectedVoice
                            ? value
                            : '';


                    saveVoiceSettings();

                }
            );


        $('rateRange')
            .addEventListener(
                'input',
                () => {

                    voiceSettings.rate =
                        Number(
                            $('rateRange').value
                        );


                    $('rateValue').textContent =
                        voiceSettings.rate
                        .toFixed(2);


                    saveVoiceSettings();

                }
            );


        $('pitchRange')
            .addEventListener(
                'input',
                () => {

                    voiceSettings.pitch =
                        Number(
                            $('pitchRange').value
                        );


                    $('pitchValue').textContent =
                        voiceSettings.pitch
                        .toFixed(2);


                    saveVoiceSettings();

                }
            );


        $('volumeRange')
            .addEventListener(
                'input',
                () => {

                    voiceSettings.volume =
                        Number(
                            $('volumeRange').value
                        );


                    $('volumeValue').textContent =
                        voiceSettings.volume
                        .toFixed(2);


                    saveVoiceSettings();

                }
            );


        document
            .querySelectorAll(
                '.voice-emotion'
            )
            .forEach(
                button => {

                    button.addEventListener(
                        'click',
                        () => {

                            voiceSettings.emotion =
                                button.dataset.emotion;


                            document
                                .querySelectorAll(
                                    '.voice-emotion'
                                )
                                .forEach(
                                    b => {

                                        b.classList.toggle(
                                            'active',
                                            b === button
                                        );

                                    }
                                );


                            saveVoiceSettings();

                        }
                    );

                }
            );


        $('btnVoiceTest')
            .addEventListener(
                'click',
                async () => {

                    const text =
                        currentMode === 'senior'

                            ?

                        '您好，歡迎來到聲動奇境。請慢慢活動身體，保持輕鬆。'

                            :

                        '等等！前面好像出現了什麼……我們一起看看接下來會發生什麼。';


                    await speak(
                        text
                    );

                }
            );


        $('btnVoiceReset')
            .addEventListener(
                'click',
                () => {

                    stopSpeech();


                    voiceSettings = {

                        rate:1,

                        pitch:1,

                        volume:1,

                        emotion:'natural',

                        voiceURI:'',

                        version:5

                    };


                    selectedVoice =
                        null;


                    saveVoiceSettings();


                    loadVoices();


                    updateVoiceSettingUI();


                    showToast(
                        '🎙️ 已恢復預設聲音設定'
                    );

                }
            );


        $('btnSpeak')
            .addEventListener(
                'click',
                async () => {

                    if (
                        speechPlaying
                    ) {

                        stopSpeech();

                        return;

                    }


                    if (
                        !currentStory
                    )
                        return;


                    const oldAction =
                        expectedAction;


                    const oldPurpose =
                        currentActionPurpose;


                    lockAction();


                    await speak(
                        currentStory
                    );


                    if (oldAction) {

                        const actionText =
                            getActionNarration({

                                action:
                                    oldAction,

                                actionPurpose:
                                    oldPurpose

                            });


                        await speak(
                            actionText
                        );


                        showAction({

                            action:
                                oldAction,

                            actionPurpose:
                                oldPurpose

                        });

                    }

                }
            );

    }
);

</script>

</body>

</html>
