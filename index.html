<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聲動奇境 v3.8 - 全體感 Wi-Fi 互動故事繪本</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        magic: {
                            dark: '#0f172a',
                            card: '#1e1b4b',
                            purple: '#8b5cf6',
                            pink: '#ec4899',
                            yellow: '#f59e0b',
                            cyan: '#06b6d4',
                            emerald: '#10b981'
                        }
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'Noto Sans TC', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at top, #2e1065 0%, #0f172a 100%);
            min-height: 100vh;
        }
        .glow-button {
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-slate-100 p-4 md:p-8 flex flex-col items-center min-h-screen justify-between">

    <!-- 頁頭與標題區域 -->
    <header class="w-full max-w-4xl text-center my-4 animate-float">
        <div class="inline-flex items-center gap-3 bg-indigo-950/80 px-6 py-2 rounded-full border border-indigo-500/30 mb-3 shadow-lg">
            <i class="fa-solid font-bold fa-wand-magic-sparkles text-amber-400 text-xl"></i>
            <span class="text-amber-300 font-semibold tracking-wider text-sm md:text-base">全體感 Wi-Fi 互動故事夥伴 v3.8</span>
        </div>
        <h1 class="text-4xl md:text-6xl font-black bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300 tracking-wide drop-shadow-md">
            聲動奇境 ✨ 體感冒險魔法書
        </h1>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6 my-auto">

        <!-- 左側面板：Wi-Fi 設定與控制 -->
        <section class="md:col-span-1 bg-slate-900/80 backdrop-blur-md p-6 rounded-3xl border border-purple-500/20 shadow-2xl flex flex-col justify-between gap-6">
            <div class="space-y-4">
                <h2 class="text-xl font-bold text-cyan-300 flex items-center gap-2">
                    <i class="fa-solid fa-wifi text-cyan-400"></i> Wi-Fi 裝置連線 v3.8
                </h2>
                
                <div class="space-y-2">
                    <label for="espIpInput" class="block text-xs font-semibold text-slate-400">ESP32 區網 IP 位址 (例如: 192.168.x.x)</label>
                    <input type="text" id="espIpInput" value="192.168.4.1" placeholder="請輸入序列埠顯示的 IP" class="w-full bg-slate-800/80 border border-slate-700 focus:border-purple-400 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none transition">
                </div>

                <div id="connectionStatusCard" class="bg-slate-800/90 p-4 rounded-2xl border border-slate-700/50 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span id="statusIndicator" class="w-4 h-4 rounded-full bg-emerald-500 inline-block shadow"></span>
                        <div>
                            <div class="text-xs text-slate-400">通訊狀態</div>
                            <div id="statusText" class="font-bold text-slate-200">準備就緒 (Wi-Fi)</div>
                        </div>
                    </div>
                    <i id="statusIcon" class="fa-solid fa-signal text-cyan-400 text-xl"></i>
                </div>
            </div>

            <div class="bg-slate-950/40 p-3 rounded-2xl border border-slate-800 space-y-2">
                <button id="btnManualSwipe" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-3 rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2 text-xs">
                    <i class="fa-solid fa-bolt"></i> 測試動作指令 (揮劍/互動)
                </button>
            </div>

            <div class="space-y-2">
                <label for="apiKeyInput" class="block text-xs font-semibold text-slate-400 flex items-center gap-1">
                    <i class="fa-solid fa-key text-amber-400"></i> Gemini API Key
                </label>
                <input type="password" id="apiKeyInput" placeholder="請輸入 Gemini API Key" class="w-full bg-slate-800/80 border border-slate-700 focus:border-purple-400 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none transition">
            </div>
        </section>

        <!-- 右側面板：故事冒險卡片 -->
        <section class="md:col-span-2 bg-slate-900/80 backdrop-blur-md p-6 rounded-3xl border border-purple-500/20 shadow-2xl flex flex-col justify-between gap-6">
            <div class="relative flex-1 bg-slate-950/70 rounded-2xl p-6 border border-slate-800 flex flex-col justify-between min-h-[280px]">
                <div id="storyContainer" class="overflow-y-auto max-h-[300px] pr-2 space-y-4">
                    <div id="welcomeMessage" class="text-center py-8">
                        <div class="text-5xl mb-3">🗡️✨📖</div>
                        <h3 class="text-lg font-bold text-purple-300 mb-1">準備好展開體感冒險 v3.8 了嗎？</h3>
                        <p class="text-sm text-slate-400">生成故事後點擊播放，當故事要求動作或選擇時，手環將自動感應並提供震動回饋！</p>
                    </div>
                    <p id="storyText" class="text-lg md:text-xl leading-relaxed text-slate-100 hidden font-medium"></p>
                </div>

                <div id="actionIndicator" class="hidden mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-sm">
                    <div class="flex items-center gap-2 text-pink-400 font-bold animate-pulse">
                        <i class="fa-solid fa-volume-high"></i>
                        <span id="speechStatusText">語音朗讀與體感等待中...</span>
                    </div>
                    <div id="swipeBadge" class="hidden bg-amber-500/20 border border-amber-500/50 text-amber-300 px-3 py-1 rounded-full text-xs font-bold animate-bounce flex items-center gap-1">
                        <i class="fa-solid fa-bolt"></i> 體感 Wi-Fi 指令已發送！
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
                    <button id="tabAiMode" class="flex-1 py-2 rounded-lg bg-purple-600 text-white transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> AI 靈感主題
                    </button>
                    <button id="tabCustomMode" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-pen-to-square"></i> 自訂/貼上故事
                    </button>
                </div>

                <div id="aiModeContainer" class="space-y-3">
                    <div class="grid grid-cols-3 gap-2">
                        <button data-theme="勇敢的小騎士與巨龍，途中包含揮劍與左右分岔路選擇" class="theme-btn active bg-purple-900/50 border border-purple-500 text-purple-200 py-2 px-3 rounded-xl text-xs md:text-sm font-semibold hover:bg-purple-800/50 transition">
                            ⚔️ 騎士巨龍
                        </button>
                        <button data-theme="神奇魔法森林的密道，包含搖晃樹枝與方向選擇" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-3 rounded-xl text-xs md:text-sm font-semibold hover:bg-slate-700 transition">
                            🌲 魔法森林
                        </button>
                        <button data-theme="海底王國的寶藏探險，包含轉動方向與開啟寶箱" class="theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-3 rounded-xl text-xs md:text-sm font-semibold hover:bg-slate-700 transition">
                            🐬 海底寶藏
                        </button>
                    </div>
                    <div class="relative">
                        <input type="text" id="customThemeInput" placeholder="✍️ 或輸入您想發想的主題..." class="w-full bg-slate-800/90 border border-slate-700 focus:border-purple-400 rounded-xl px-3 py-2.5 text-xs md:text-sm text-slate-200 outline-none transition">
                    </div>
                </div>

                <div id="customModeContainer" class="hidden space-y-2">
                    <textarea id="manualStoryInput" rows="3" placeholder="貼上故事文字..." class="w-full bg-slate-800/90 border border-slate-700 focus:border-purple-400 rounded-xl p-3 text-xs md:text-sm text-slate-200 outline-none transition resize-none"></textarea>
                </div>

                <div class="flex gap-3">
                    <button id="btnGenerate" class="flex-1 glow-button bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 text-white font-black py-4 px-6 rounded-2xl text-lg flex items-center justify-center gap-3">
                        <i id="btnGenerateIcon" class="fa-solid fa-wand-magic-sparkles"></i>
                        <span id="btnGenerateText">生成體感互動故事 (v3.8)</span>
                    </button>
                    <button id="btnSpeak" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 px-5 rounded-2xl border border-slate-700 flex items-center justify-center text-xl transition" title="開始朗讀">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-purple-500/50 text-slate-100 px-6 py-3 rounded-2xl shadow-2xl opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-info text-cyan-400 text-lg"></i>
        <span id="toastMessage" class="text-sm font-semibold">提示訊息</span>
    </div>

    <footer class="w-full max-w-4xl text-center py-4 text-xs text-slate-500">
        <p>聲動奇境 Wi-Fi App v3.8 &copy; 2026 - Powered by Gemini 1.5 Flash & Web Speech</p>
    </footer>

    <script>
        let selectedTheme = "勇敢的小騎士與巨龍，途中包含揮劍與左右分岔路選擇";
        let currentStory = "";
        let currentMode = 'ai';
        let synth = window.speechSynthesis;
        let utterance = null;

        const espIpInput = document.getElementById('espIpInput');
        const btnManualSwipe = document.getElementById('btnManualSwipe');
        const btnGenerate = document.getElementById('btnGenerate');
        const btnGenerateText = document.getElementById('btnGenerateText');
        const btnGenerateIcon = document.getElementById('btnGenerateIcon');
        const btnSpeak = document.getElementById('btnSpeak');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const storyText = document.getElementById('storyText');
        const actionIndicator = document.getElementById('actionIndicator');
        const speechStatusText = document.getElementById('speechStatusText');
        const swipeBadge = document.getElementById('swipeBadge');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        const tabAiMode = document.getElementById('tabAiMode');
        const tabCustomMode = document.getElementById('tabCustomMode');
        const aiModeContainer = document.getElementById('aiModeContainer');
        const customModeContainer = document.getElementById('customModeContainer');
        const customThemeInput = document.getElementById('customThemeInput');
        const manualStoryInput = document.getElementById('manualStoryInput');
        const themeBtns = document.querySelectorAll('.theme-btn');

        function showToast(message, type = 'info') {
            toastMessage.textContent = message;
            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-lg';
            } else if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-cyan-400 text-lg';
            }
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        async function sendWifiCommand(commandStr) {
            const ip = espIpInput.value.trim();
            if (!ip) {
                showToast('請先輸入 ESP32 的 IP 位址', 'error');
                return;
            }

            triggerVisualSwipeEffect();

            try {
                const url = `http://${ip}/command?action=${commandStr}`;
                await fetch(url, { mode: 'no-cors' });
                console.log('Wi-Fi 體感指令已發送 (v3.8):', commandStr);
            } catch (error) {
                console.error('Wi-Fi 傳送錯誤:', error);
            }
        }

        function triggerVisualSwipeEffect() {
            swipeBadge.classList.remove('hidden');
            setTimeout(() => {
                swipeBadge.classList.add('hidden');
            }, 3000);
        }

        async function generateAdventureStory() {
            if (currentMode === 'custom') {
                const manualText = manualStoryInput.value.trim();
                if (!manualText) {
                    showToast("請先輸入或貼上故事內容喔！", "error");
                    return;
                }
                currentStory = manualText;
                welcomeMessage.classList.add('hidden');
                storyText.textContent = currentStory;
                storyText.classList.remove('hidden');
                btnSpeak.disabled = false;
                showToast("自訂體感故事已載入 (v3.8)！", "success");
                return;
            }

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                showToast("請先於左側輸入 Gemini API Key", "error");
                apiKeyInput.focus();
                return;
            }

            const userCustomTopic = customThemeInput.value.trim();
            const activeTopic = userCustomTopic || selectedTheme;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            btnGenerate.disabled = true;
            btnGenerateText.textContent = "v3.8 正在編織體感冒險故事...";
            btnGenerateIcon.className = "fa-solid fa-spinner animate-spin";

            const prompt = `你是一位兒童繪本大師。請為小朋友創作一段充滿互動與選擇的冒險故事，主題是「${activeTopic}」。
字數約 250 到 350 字，適合口語朗讀。
故事內容中必須包含具體的動作指令（例如：「前方有怪獸，請想像手上有一把寶劍用力揮砍」或「遇到分岔路，請選擇左邊或右邊」），讓使用者能透過手環動作與選擇來推進故事。`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error.message || "API 錯誤");

                const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!generatedText) throw new Error("無法取得故事內容");

                currentStory = generatedText;
                welcomeMessage.classList.add('hidden');
                storyText.textContent = currentStory;
                storyText.classList.remove('hidden');
                btnSpeak.disabled = false;
                showToast("體感故事生成完畢 (v3.8)！", "success");

            } catch (error) {
                console.error("Gemini API Error:", error);
                showToast("生成失敗：" + error.message, "error");
            } finally {
                btnGenerate.disabled = false;
                btnGenerateText.textContent = "生成體感互動故事 (v3.8)";
                btnGenerateIcon.className = "fa-solid fa-wand-magic-sparkles";
            }
        }

        function toggleSpeech() {
            if (!currentStory) return;

            if (synth.speaking) {
                synth.cancel();
                actionIndicator.classList.add('hidden');
                btnSpeak.innerHTML = `<i class="fa-solid fa-play"></i>`;
                return;
            }

            utterance = new SpeechSynthesisUtterance(currentStory);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.95;

            utterance.onstart = () => {
                actionIndicator.classList.remove('hidden');
                speechStatusText.textContent = "語音朗讀與體感偵測中 (v3.8)...";
                btnSpeak.innerHTML = `<i class="fa-solid fa-stop"></i>`;
                sendWifiCommand("START_STORY");
            };

            utterance.onend = () => {
                actionIndicator.classList.add('hidden');
                btnSpeak.innerHTML = `<i class="fa-solid fa-play"></i>`;
                showToast("故事段落朗讀完畢，請等待動作或進行選擇！", "success");
            };

            utterance.onerror = () => {
                actionIndicator.classList.add('hidden');
                btnSpeak.innerHTML = `<i class="fa-solid fa-play"></i>`;
                showToast("語音播放發生錯誤", "error");
            };

            synth.speak(utterance);
        }

        document.addEventListener('DOMContentLoaded', () => {
            btnManualSwipe.addEventListener('click', () => {
                showToast("發送手動體感互動指令 (v3.8)...", "info");
                sendWifiCommand("SWING_DETECTED");
            });

            themeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    themeBtns.forEach(b => {
                        b.classList.remove('active', 'bg-purple-900/50', 'border-purple-500', 'text-purple-200');
                        b.classList.add('bg-slate-800', 'border-slate-700', 'text-slate-300');
                    });
                    btn.classList.add('active', 'bg-purple-900/50', 'border-purple-500', 'text-purple-200');
                    btn.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-300');
                    selectedTheme = btn.getAttribute('data-theme');
                    customThemeInput.value = '';
                });
            });

            tabAiMode.addEventListener('click', () => {
                currentMode = 'ai';
                tabAiMode.className = 'flex-1 py-2 rounded-lg bg-purple-600 text-white transition flex items-center justify-center gap-1';
                tabCustomMode.className = 'flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-1';
                aiModeContainer.classList.remove('hidden');
                customModeContainer.classList.add('hidden');
            });

            tabCustomMode.addEventListener('click', () => {
                currentMode = 'custom';
                tabCustomMode.className = 'flex-1 py-2 rounded-lg bg-purple-600 text-white transition flex items-center justify-center gap-1';
                tabAiMode.className = 'flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-1';
                customModeContainer.classList.remove('hidden');
                aiModeContainer.classList.add('hidden');
            });

            btnGenerate.addEventListener('click', generateAdventureStory);
            btnSpeak.addEventListener('click', toggleSpeech);
        });
    </script>
</body>
</html>
