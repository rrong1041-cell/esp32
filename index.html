/* =====================================================

===================================================== */

function showToast(msg) {

    const t = $('toast');

    t.textContent = msg;

    t.classList.remove(
        'opacity-0',
        'pointer-events-none'
    );

    t.classList.add('opacity-100');

    setTimeout(() => {

        t.classList.remove('opacity-100');

        t.classList.add(
            'opacity-0',
            'pointer-events-none'
        );

    },3000);

}


/* =====================================================
   Emoji
===================================================== */

function removeEmoji(text) {

    if (!text) return '';

    try {

        return text
            .replace(
                /[\p{Extended_Pictographic}\uFE0F]/gu,
                ''
            )
            .replace(/\s{2,}/g,' ')
            .trim();

    }

    catch {

        return text.trim();

    }

}

const VOICE_STORAGE_KEY =
    'soundAdventureVoiceSettings';

let availableVoices = [];
let selectedVoice = null;

let speechToken = 0;

let voiceSettings = {

    rate:1,
    pitch:1,
    volume:1,
    emotion:'natural',
    voiceURI:'',
    version:5

};

const EMOTION_PROFILES = {

    natural:{
        rate:1,
        pitch:1
    },

    lively:{
        rate:1.05,
        pitch:1.08
    },

    tense:{
        rate:1.02,
        pitch:1.12
    },

    gentle:{
        rate:.88,
        pitch:.94
    }

};

function loadVoiceSettings() {

    try {

        const saved =
            localStorage.getItem(
                VOICE_STORAGE_KEY
            );

        if (!saved) return;

        voiceSettings = {
            ...voiceSettings,
            ...JSON.parse(saved)
        };

    }

    catch(e) {

        console.warn(e);

    }

}

function saveVoiceSettings() {

    try {

        localStorage.setItem(
            VOICE_STORAGE_KEY,
            JSON.stringify(
                voiceSettings
            )
        );

    }

    catch(e) {}

}

function updateVoiceStatus(message) {

    const el = $('voiceStatus');

    if (el) {
        el.textContent = message;
    }

}

function populateVoiceSelect() {

    const select =
        $('voiceSelect');

    if (!select) return;

    select.innerHTML = '';

    const auto =
        document.createElement('option');

    auto.value = '__AUTO__';

    auto.textContent =
        '✨ 自動（使用裝置自然語音）';

    select.appendChild(auto);

    const chinese =
        availableVoices.filter(
            v =>
                /^zh/i.test(v.lang) ||
                /Chinese|中文|Taiwan|台灣/i.test(v.name)
        );

    const others =
        availableVoices.filter(
            v => !chinese.includes(v)
        );

    [
        ...chinese,
        ...others
    ].forEach(voice => {

        const option =
            document.createElement('option');

        option.value =
            voice.voiceURI;

        option.textContent =
            `${voice.name} (${voice.lang})`;

        select.appendChild(option);

    });

    restoreSelectedVoice();

    updateVoiceStatus(
        availableVoices.length
            ? `已找到 ${availableVoices.length} 個裝置語音。`
            : '尚未取得裝置語音。'
    );

}

function loadVoices() {

    if (!('speechSynthesis' in window)) {

        updateVoiceStatus(
            '此瀏覽器不支援語音朗讀。'
        );

        return;

    }

    availableVoices =
        speechSynthesis.getVoices();

    populateVoiceSelect();

}

function restoreSelectedVoice() {

    selectedVoice = null;

    if (voiceSettings.voiceURI) {

        selectedVoice =
            availableVoices.find(
                v =>
                    v.voiceURI ===
                    voiceSettings.voiceURI
            )
            ||
            null;

    }

    const select =
        $('voiceSelect');

    if (select) {

        select.value =
            selectedVoice
                ? selectedVoice.voiceURI
                : '__AUTO__';

    }

}

function updateVoiceSettingUI() {

    $('rateRange').value =
        voiceSettings.rate;

    $('pitchRange').value =
        voiceSettings.pitch;

    $('volumeRange').value =
        voiceSettings.volume;

    $('rateValue').textContent =
        Number(
            voiceSettings.rate
        ).toFixed(2);

    $('pitchValue').textContent =
        Number(
            voiceSettings.pitch
        ).toFixed(2);

    $('volumeValue').textContent =
        Number(
            voiceSettings.volume
        ).toFixed(2);

    document
        .querySelectorAll('.voice-emotion')
        .forEach(button => {

            button.classList.toggle(
                'active',
                button.dataset.emotion ===
                voiceSettings.emotion
            );

        });

    restoreSelectedVoice();

}

function getSentenceEmotion(text) {

    const profile =
        EMOTION_PROFILES[
            voiceSettings.emotion
        ]
        ||
        EMOTION_PROFILES.natural;

    let rate =
        Number(voiceSettings.rate) *
        profile.rate;

    let pitch =
        Number(voiceSettings.pitch) *
        profile.pitch;

    if (/！!/.test(text)) {

        rate *= 1.04;
        pitch *= 1.07;

    }

    if (/？\?/.test(text)) {

        pitch *= 1.05;

    }

    if (
        /危險|快跑|救命|小心|怪獸|糟糕|逃|攻擊|火焰/.test(text)
    ) {

        rate *= 1.06;
        pitch *= 1.06;

    }

    if (
        /慢慢|輕輕|溫柔|放心|安心|休息/.test(text)
    ) {

        rate *= .94;
        pitch *= .96;

    }

    return {

        rate:
            Math.max(
                .65,
                Math.min(1.35,rate)
            ),

        pitch:
            Math.max(
                .5,
                Math.min(2,pitch)
            )

    };

}

function stopSpeech() {

    speechToken++;

    try {

        speechSynthesis.cancel();

    }

    catch(e) {}

    speechPlaying = false;

}

async function speak(text) {

    if (
        !text ||
        !('speechSynthesis' in window)
    ) {

        return;

    }

    const clean =
        removeEmoji(text);

    if (!clean) return;

    stopSpeech();

    const token =
        speechToken;

    speechPlaying = true;

    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );

    const emotion =
        getSentenceEmotion(clean);

    if (selectedVoice) {

        utterance.voice =
            selectedVoice;

        utterance.lang =
            selectedVoice.lang ||
            'zh-TW';

    }

    else {

        utterance.lang =
            'zh-TW';

    }

    utterance.rate =
        emotion.rate;

    utterance.pitch =
        emotion.pitch;

    utterance.volume =
        voiceSettings.volume;

    await new Promise(resolve => {

        let finished = false;

        let timer = null;

        const finish = () => {

            if (finished) return;

            finished = true;

            clearTimeout(timer);

            resolve();

        };

        utterance.onend = finish;
        utterance.onerror = finish;

        timer =
            setTimeout(
                finish,
                Math.max(
                    7000,
                    clean.length *
                    500 /
                    Math.max(
                        emotion.rate,
                        .5
                    )
                )
            );

        try {

            speechSynthesis.speak(
                utterance
            );

        }

        catch(e) {

            finish();

        }

    });

    if (
        token === speechToken
    ) {

        speechPlaying = false;

    }

}


/* =====================================================
   BLE
===================================================== */

async function connectBLE() {

    if (!navigator.bluetooth) {

        showToast(
            '此瀏覽器不支援 Web Bluetooth。'
        );

        return;

    }

    try {

        showToast(
            '正在搜尋故事裝置……'
        );

        bleDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices:true,

                optionalServices:[
                    BLE_CONFIG.serviceUuid
                ]

            });

        bleDevice.addEventListener(
            'gattserverdisconnected',
            () => {

                $('statusIndicator').className =
                    'w-4 h-4 rounded-full bg-slate-500 inline-block shadow';

                $('statusText').textContent =
                    '已斷線';

                $('statusIcon').className =
                    'fa-solid fa-plug-circle-xmark text-slate-500 text-xl';

                bleCharacteristic = null;

                showToast(
                    '故事裝置已斷線'
                );

            }
        );

        const server =
            await bleDevice.gatt.connect();

        const service =
            await server.getPrimaryService(
                BLE_CONFIG.serviceUuid
            );

        bleCharacteristic =
            await service.getCharacteristic(
                BLE_CONFIG.characteristicUuid
            );

        await bleCharacteristic.startNotifications();

        bleCharacteristic.addEventListener(
            'characteristicvaluechanged',
            onBleEvent
        );

        $('statusIndicator').className =
            'w-4 h-4 rounded-full bg-emerald-500 inline-block shadow-lg animate-pulse';

        $('statusText').textContent =
            '已連線';

        $('statusIcon').className =
            'fa-solid fa-plug-circle-check text-emerald-400 text-xl';

        await sendBLE('READY');

        showToast(
            '藍牙連線成功！'
        );

    }

    catch(e) {

        console.error(e);

        showToast(
            '藍牙連線失敗：' +
            e.message
        );

    }

}

async function onBleEvent(event) {

    const value =
        new TextDecoder()
        .decode(event.target.value)
        .trim()
        .toUpperCase();

    console.log(
        '收到硬體訊號：',
        value
    );

    if (
        value === 'SWITCH_MODE_SENIOR' ||
        value === 'MODE_SENIOR'
    ) {

        await switchMode(
            'senior',
            false
        );

        return;

    }

    if (
        value === 'SWITCH_MODE_CHILD' ||
        value === 'MODE_CHILD'
    ) {

        await switchMode(
            'child',
            false
        );

        return;

    }

    if (
        !waitingForAction ||
        busy
    ) {

        return;

    }

    const now = Date.now();

    if (
        now - lastActionTime <
        1500
    ) {

        return;

    }

    const expected =
        String(
            expectedAction || ''
        )
        .trim()
        .toUpperCase();

    if (
        value === expected
    ) {

        lastActionTime = now;

        await handleAction(
            expected
        );

    }

}

async function sendBLE(command) {

    if (!bleCharacteristic) return;

    try {

        await bleCharacteristic.writeValue(
            new TextEncoder().encode(
                command
            )
        );

    }

    catch(e) {

        console.error(
            'BLE 傳送失敗',
            e
        );

    }

}

async function parseAIResponse(res) {

    const raw =
        await res.json();

    if (!res.ok) {

        throw new Error(
            raw.error ||
            'Worker 回應失敗'
        );

    }

    return raw;

}

function updateAdventureState(data) {

    if (data.storyMemory) {

        storyMemory =
            data.storyMemory;

    }

    if (data.adventureSeed) {

        adventureSeed =
            data.adventureSeed;

    }

    if (data.round !== undefined) {

        currentRound =
            Number(data.round) || 0;

    }

    if (data.maxRound !== undefined) {

        maxRound =
            Number(data.maxRound) || 11;

    }

    if (data.sceneId) {

        sceneId =
            data.sceneId;

    }

    if (data.sceneSeed) {

        sceneSeed =
            data.sceneSeed;

    }

}

function showAction(data) {

    const action =
        String(
            data?.action || ''
        )
        .trim()
        .toUpperCase();

    if (!action) {

        waitingForAction = false;

        expectedAction = '';

        $('actionPrompt')
            .classList
            .add('hidden');

        return;

    }

    currentAction =
        action;

    currentActionNarration =
        getActionNarration(data);

    currentActionPurpose =
        data?.actionPurpose ||
        '完成這個動作，故事就會繼續。';

    expectedAction =
        action;

    waitingForAction = true;

    $('actionPrompt')
        .classList
        .remove(
            'hidden',
            'action-locked'
        );

    $('actionPrompt')
        .classList
        .add('action-ready');

    $('promptText').textContent =
        getActionIcon(action) +
        ' ' +
        currentActionNarration;

    $('actionSubText').textContent =
        '💡 ' +
        currentActionPurpose;

}

function lockAction() {

    $('actionPrompt')
        .classList
        .remove('hidden');

    $('actionPrompt')
        .classList
        .add('action-locked');

    $('actionSubText').textContent =
        '🔒 故事正在播放，請先聽完劇情。';

}

function showEnding(data) {

    waitingForAction = false;

    expectedAction = '';

    $('actionPrompt')
        .classList
        .remove('hidden');

    $('actionPrompt')
        .classList
        .remove('action-locked');

            : '你完成了這場完整的冒險。';

            ? '🎉 活動完成！'
            : '🎉 故事完成！'
    );

}


/* =====================================================
   執行動作
===================================================== */

async function handleAction(action) {

    if (
        !waitingForAction ||
        busy
    ) {

        return;

    }

    waitingForAction = false;

    busy = true;

    expectedAction = '';

    $('actionSubText').textContent =
        '✨ 動作完成，故事正在回應你的行動……';

    await sendBLE('ACTION_OK');

    stopSpeech();

    try {

        const res =
            await fetch(
                WORKER_URL +
                '/api/action',
                {

                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({

                        mode:
                            currentMode,

                        topic:
                            selectedTheme,

                        difficulty:
                            selectedDifficulty,

                        action:
                            action,

                        actionSuccess:
                            true,

                        currentStory:
                            currentStory,

                        currentScene:
                            currentStory,

                        previousAction:
                            action,

                        storyMemory:
                            storyMemory,

                        adventureSeed:
                            adventureSeed,

                        round:
                            currentRound,

                        maxRound:
                            maxRound,

                        sceneId:
                            sceneId,

                        sceneSeed:
                            sceneSeed,

                        history:
                            history

                    })

                }
            );

        const data =
            await parseAIResponse(res);

        updateAdventureState(data);

        currentStory =
            data.story || '';

        if (data.story) {

            appendStory(
                data.completed
                    ? '🎉 最終章'
                    : '✨ 劇情繼續',
                data.story
            );

            await speak(
                data.story
            );

        }

        /*
         * ⭐ 最重要的修正
         *
         * 只有 completed === true
         * 才能顯示結局。
         *
         * actionRequired === false
         * 不再被當成結局。
         */

        if (data.completed === true) {

            showEnding(data);

        }

        else if (
            data.actionRequired === true &&
            data.action
        ) {

            lockAction();

            const actionText =
                getActionNarration(data);

            await speak(
                actionText
            );

            showAction(data);

        }

        else {

            /*
             * 如果 AI 這一幕沒有動作，
             * 不結束故事。
             *
             * Worker 正常情況下會提供 action，
             * 這裡只是安全 fallback。
             */

            showToast(
                '✨ 劇情繼續……'
            );

            await continueWithoutAction(
                data
            );

        }

        history.push({

            role:'assistant',

            story:
                data.story,

            action:
                data.action || '',

            actionNarration:
                getActionNarration(data),

            actionPurpose:
                data.actionPurpose || '',

            round:
                data.round,

            completed:
                data.completed === true

        });

    }

    catch(e) {

        console.error(e);

        showToast(
            '故事連線失敗：' +
            e.message
        );

        showAction({

            action:
                action,

            actionPurpose:
                currentActionPurpose

        });

    }

    finally {

        busy = false;

    }

}


/* =====================================================
   無動作場景
===================================================== */

async function continueWithoutAction(data) {

    if (data.completed === true) {

        showEnding(data);

        return;

    }

    /*
     * 這裡不把場景當結局。
     *
     * Worker 正常會在下一個需要互動的場景
     * 回傳 action。
     */

    $('actionPrompt')
        .classList
        .remove('hidden');

    $('promptText').textContent =
        '📖 劇情正在推進……';

    $('actionSubText').textContent =
        '請稍等，下一個互動即將出現。';

}


/* =====================================================
   開始新故事
===================================================== */

async function generateStory() {

    if (busy) return;

    const custom =
        $('customTopicInput')
        .value
        .trim();

    const topic =
        custom ||
        selectedTheme;

    if (!topic) {

        showToast(
            '請先選擇或輸入主題。'
        );

        return;

    }

    resetAdventure();

    primeSpeech();

    busy = true;

    const btn =
        $('btnGenerate');

    btn.disabled = true;

    $('btnText').textContent =
        currentMode === 'senior'
            ? 'AI 正在安排活動……'
            : 'AI 正在創造冒險……';

    $('btnIcon').className =
        'fa-solid fa-spinner animate-spin';

    try {

        const res =
            await fetch(
                WORKER_URL +
                '/api/story',
                {

                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({

                        mode:
                            currentMode,

                        topic:
                            topic,

                        difficulty:
                            selectedDifficulty,

                        newAdventure:true,

                        storyMemory:null,

                        adventureSeed:'',

                        round:0

                    })

                }
            );

        const data =
            await parseAIResponse(res);

        updateAdventureState(data);

        $('welcomeMessage')
            .classList
            .add('hidden');

        $('storyDisplay').innerHTML = '';

        $('storyDisplay')
            .classList
            .remove('hidden');

        currentStory =
            data.story || '';

        history = [

            {
                role:'user',
                topic:topic
            },

            {
                role:'assistant',

                story:
                    currentStory,

                action:
                    data.action || '',

                actionNarration:
                    getActionNarration(data),

                actionPurpose:
                    data.actionPurpose || '',

                round:
                    data.round

            }

        ];

        appendStory(
            currentMode === 'senior'
                ? '🌿 活動開始'
                : '📖 第一章',
            currentStory
        );

        await speak(
            currentStory
        );

        /*
         * ⭐⭐⭐ 最重要的修正 ⭐⭐⭐
         *
         * 不再使用：
         *
         *     data.done || !data.action
         *
         * 因為 actionRequired=false
         * 不代表故事結束。
         */

        if (data.completed === true) {

            showEnding(data);

        }

        else if (
            data.actionRequired === true &&
            data.action
        ) {

            lockAction();

            const actionText =
                getActionNarration(data);

            await speak(
                actionText
            );

            showAction(data);

        }

        else {

            await continueWithoutAction(
                data
            );

        }

        $('btnSpeak').disabled =
            false;

        if (bleCharacteristic) {

            await sendBLE(
                currentMode === 'senior'
                    ? 'START'
                    : 'START_STORY'
            );

        }

        showToast(
            '✨ 新冒險建立完成！'
        );

    }

    catch(e) {

        console.error(e);

        showToast(
            '故事生成失敗：' +
            e.message
        );

    }

    finally {

        $('btnText').textContent =
            currentMode === 'senior'
                ? '開始健康活動'
                : '開始精彩故事冒險';

        $('btnIcon').className =
            'fa-solid fa-wand-magic-sparkles';

        btn.disabled = false;

        busy = false;

    }

}

function primeSpeech() {

    if (
        'speechSynthesis' in window
    ) {

        try {

            speechSynthesis.getVoices();

        }

        catch(e) {}

    }

}


/* =====================================================
   初始化
===================================================== */

document.addEventListener(
    'DOMContentLoaded',
    () => {

        renderChildThemes();

        loadVoiceSettings();

        updateVoiceSettingUI();

        primeSpeech();

        if (
            'speechSynthesis' in window
        ) {

            speechSynthesis.addEventListener(
                'voiceschanged',
                loadVoices
            );

        }

        loadVoices();

        $('btnConnect')
            .addEventListener(
                'click',
                connectBLE
            );

        $('btnGenerate')
            .addEventListener(
                'click',
                generateStory
            );

        $('btnManualAction')
            .addEventListener(
                'click',
                async () => {

                    if (!waitingForAction) {

                        showToast(
                            '🔒 目前沒有等待中的動作。'
                        );

                        return;

                    }

                    await handleAction(
                        expectedAction
                    );

                }
            );

        $('customTopicInput')
            .addEventListener(
                'input',
                () => {

                    const value =
                        $('customTopicInput')
                        .value
                        .trim();

                    if (!value) return;

                    document
                        .querySelectorAll(
                            '.theme-btn'
                        )
                        .forEach(b => {

                            b.className =
                                'theme-btn bg-slate-800 border border-slate-700 text-slate-300 py-2 px-2 rounded-xl text-xs font-semibold';

                        });

                }
            );

        document
            .querySelectorAll(
                '.difficulty-btn'
            )
            .forEach(button => {

                button.addEventListener(
                    'click',
                    () => {

                        document
                            .querySelectorAll(
                                '.difficulty-btn'
                            )
                            .forEach(b => {

                                b.classList.remove(
                                    'active'
                                );

                            });

                        button.classList.add(
                            'active'
                        );

                        selectedDifficulty =
                            button.dataset.difficulty;

                    }
                );

            });

        $('btnVoiceSettings')
            .addEventListener(
                'click',
                () => {

                    loadVoices();

                    updateVoiceSettingUI();

                    $('voiceModal')
                        .classList
                        .remove('hidden');

                }
            );

        $('btnCloseVoiceSettings')
            .addEventListener(
                'click',
                () => {

                    $('voiceModal')
                        .classList
                        .add('hidden');

                }
            );

        $('voiceModal')
            .addEventListener(
                'click',
                event => {

                    if (
                        event.target ===
                        $('voiceModal')
                    ) {

                        $('voiceModal')
                            .classList
                            .add('hidden');

                    }

                }
            );

        $('voiceSelect')
            .addEventListener(
                'change',
                () => {

                    const value =
                        $('voiceSelect').value;

                    if (
                        value === '__AUTO__'
                    ) {

                        selectedVoice = null;

                        voiceSettings.voiceURI =
                            '';

                        saveVoiceSettings();

                        return;

                    }

                    selectedVoice =
                        availableVoices.find(
                            voice =>
                                voice.voiceURI ===
                                value
                        ) || null;

                    voiceSettings.voiceURI =
                        selectedVoice
                            ? value
                            : '';

                    saveVoiceSettings();

                }
            );

        $('rateRange')
            .addEventListener(
                'input',
                () => {

                    voiceSettings.rate =
                        Number(
                            $('rateRange').value
                        );

                    $('rateValue').textContent =
                        voiceSettings.rate
                        .toFixed(2);

                    saveVoiceSettings();

                }
            );

        $('pitchRange')
            .addEventListener(
                'input',
                () => {

                    voiceSettings.pitch =
                        Number(
                            $('pitchRange').value
                        );

                    $('pitchValue').textContent =
                        voiceSettings.pitch
                        .toFixed(2);

                    saveVoiceSettings();

                }
            );

        $('volumeRange')
            .addEventListener(
                'input',
                () => {

                    voiceSettings.volume =
                        Number(
                            $('volumeRange').value
                        );

                    $('volumeValue').textContent =
                        voiceSettings.volume
                        .toFixed(2);

                    saveVoiceSettings();

                }
            );

        document
            .querySelectorAll(
                '.voice-emotion'
            )
            .forEach(button => {

                button.addEventListener(
                    'click',
                    () => {

                        voiceSettings.emotion =
                            button.dataset.emotion;

                        document
                            .querySelectorAll(
                                '.voice-emotion'
                            )
                            .forEach(b => {

                                b.classList.toggle(
                                    'active',
                                    b === button
                                );

                            });

                        saveVoiceSettings();

                    }
                );

            });

        $('btnVoiceTest')
            .addEventListener(
                'click',
                async () => {

                    const text =
                        currentMode === 'senior'

                            ?

                        '您好，歡迎來到聲動奇境。請慢慢活動身體，保持輕鬆。'

                            :

                        '等等！前面好像出現了什麼……我們一起看看接下來會發生什麼。';

                    await speak(text);

                }
            );

        $('btnVoiceReset')
            .addEventListener(
                'click',
                () => {

                    stopSpeech();

                    voiceSettings = {

                        rate:1,
                        pitch:1,
                        volume:1,
                        emotion:'natural',
                        voiceURI:'',
                        version:5

                    };

                    selectedVoice = null;

                    saveVoiceSettings();

                    loadVoices();

                    updateVoiceSettingUI();

                    showToast(
                        '🎙️ 已恢復預設聲音設定'
                    );

                }
            );

        $('btnSpeak')
            .addEventListener(
                'click',
                async () => {

                    if (speechPlaying) {

                        stopSpeech();

                        return;

                    }

                    if (!currentStory) return;

                    const oldAction =
                        expectedAction;

                    const oldPurpose =
                        currentActionPurpose;

                    lockAction();

                    await speak(
                        currentStory
                    );

                    if (oldAction) {

                        const actionText =
                            getActionNarration({

                                action:
                                    oldAction,

                                actionPurpose:
                                    oldPurpose

                            });

                        await speak(
                            actionText
                        );

                        showAction({

                            action:
                                oldAction,

                            actionPurpose:
                                oldPurpose

                        });

                    }

                }
            );

    }
);

</script>

</body>
</html>
