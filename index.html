<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聲動奇境</title>
<style>
:root{--bg:#0f2a3a;--panel:#173b50;--ink:#fdf6e3;--dim:#9fb8c6;--lamp:#ffc857;--ok:#7be0ad;--bad:#ff8a73;--line:#2b5670}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:16px;max-width:720px;margin-inline:auto}
h1{font-size:28px;margin:8px 0 2px}
.sub{color:var(--dim);margin:0 0 16px;font-size:15px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 16px;min-height:48px;cursor:pointer}
button.main{background:var(--lamp);color:#2a1d00;border-color:var(--lamp);font-weight:700}
button.on{border-color:var(--lamp);color:var(--lamp)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
textarea{width:100%;min-height:140px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;font:15px/1.5 monospace;resize:vertical}
input{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;min-height:48px}
input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
summary{cursor:pointer;color:var(--dim);font-size:15px}
#msg{min-height:26px;font-size:15px;color:var(--dim)}
#msg.warn{color:var(--lamp)}
#task{display:none;border-color:var(--lamp)}
#taskText{font-size:24px;font-weight:700;margin:0 0 8px}
progress{width:100%;height:16px;accent-color:var(--ok)}
#fb{min-height:28px;font-weight:700;color:var(--ok)}
#fb.bad{color:var(--bad)}
#log{max-height:260px;overflow:auto;font-size:17px}
#log p{margin:0 0 8px}
#log .after{color:var(--ok)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#667;margin-right:6px}
.dot.live{background:var(--ok)}
.hide{display:none}
</style>
</head>
<body>
<h1>聲動奇境</h1>
<p class="sub">聽故事、站起來動一動，故事才會繼續。</p>

<div class="box">
  <div class="row">
    <span><span id="dot" class="dot"></span><span id="conn">裝置未連線</span></span>
    <button id="btnConn">連接裝置</button>
    <button id="btnDisc" class="hide">中斷</button>
  </div>
</div>

<div class="box">
  <div class="row">
    <button id="mChild" class="on">兒童模式</button>
    <button id="mSenior">長輩模式（請坐有椅背的椅子）</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label for="level">難度</label>
    <select id="level"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">挑戰</option></select>
    <label for="rate">語速</label>
    <select id="rate"><option value="0.85">慢</option><option value="0.95" selected>正常</option><option value="1.05">快</option></select>
  </div>
</div>

<div id="childBox" class="box">
  <label for="idea">你想聽什麼故事？</label>
  <input id="idea" maxlength="100" placeholder="例如：小兔子想幫月亮找回掉下來的星星">
  <div class="row" style="margin-top:8px">
    <label for="age">孩子年齡</label>
    <select id="age"><option>5</option><option selected>6</option><option>7</option><option>8</option></select>
    <button id="btnGen" class="main">生成故事</button>
  </div>
  <details style="margin-top:10px"><summary>改用手動貼上故事</summary>
    <textarea id="json" placeholder='{"title":"…","scenes":[…]}' aria-label="故事 JSON" style="margin-top:8px"></textarea>
    <div class="row" style="margin-top:8px"><button id="btnLoad">載入故事</button></div>
  </details>
</div>

<div class="box">
  <div id="msg" role="status" aria-live="polite">請先載入故事。</div>
  <div class="row" style="margin-top:8px">
    <button id="btnStart" class="main">開始</button>
    <button id="btnPause" disabled>休息一下</button>
    <button id="btnStop" disabled>結束</button>
  </div>
</div>

<div id="task" class="box">
  <p id="taskText"></p>
  <progress id="bar" max="1" value="0" aria-label="動作進度"></progress>
  <div id="fb" role="status" aria-live="polite"></div>
  <button id="btnSim">模擬做動作（測試用）</button>
</div>

<div class="box"><div id="log" aria-label="故事內容"></div></div>

<script>
const SVC='4fa8691a-136d-4560-84ed-01354051b785', CHR='beb5483e-36e1-4688-b7f5-ea07361b26a8';
const $=id=>document.getElementById(id);
const WORKER_URL='https://lucky-waterfall-f8a2.shopcom2009.workers.dev';
// 兒童站著做，次數和秒數要夠多才有運動量；長輩坐著，幅度小、次數適中。
const LEVELS={
  child:{easy:{count:6,sec:6,jump:3,run:10},normal:{count:8,sec:8,jump:5,run:15},hard:{count:12,sec:10,jump:8,run:20}},
  senior:{easy:{count:4,sec:4},normal:{count:6,sec:6},hard:{count:8,sec:8}}
};
const ACTIONS={
  SWIPE_LEFT:['count',(n,g)=>g?`手慢慢向左移，再回到中間，做 ${n} 次。`:`站著，手臂大大地向左揮 ${n} 次，每次回到中間。`],
  SWIPE_RIGHT:['count',(n,g)=>g?`手慢慢向右移，再回到中間，做 ${n} 次。`:`站著，手臂大大地向右揮 ${n} 次，每次回到中間。`],
  JUMP:['count',n=>`原地小跳 ${n} 次。`],
  SHAKE:['time',n=>`用力搖動雙手，搖 ${n} 秒。`],
  ARM_UP:['time',(n,g)=>g?`手慢慢往上翹，保持 ${n} 秒。`:`雙手高高舉起，保持 ${n} 秒。`],
  ARM_DOWN:['time',(n,g)=>g?`手慢慢往下彎，保持 ${n} 秒。`:`手臂往下壓，手腕向下彎，保持 ${n} 秒。`],
  RUN:['time',n=>`原地踏步，膝蓋抬高，踏 ${n} 秒。`]
};
const SENIOR_STEPS=['ARM_UP','SWIPE_RIGHT','ARM_DOWN','SWIPE_LEFT','ARM_UP','SWIPE_RIGHT','ARM_DOWN','SWIPE_LEFT','ARM_UP','SWIPE_RIGHT','ARM_DOWN','SWIPE_LEFT'];
const BAD_WORDS=/抬起|舉高|壓低|揮|搖|跳|踏|手腕|請你|用力/;
const HOLD_GAP=1200;

const S={mode:'child',story:null,run:0,paused:false,cur:null,ch:null,dev:null,queue:Promise.resolve(),lastFail:0};

/* ---------- 顯示 ---------- */
function msg(t,warn){$('msg').textContent=t;$('msg').className=warn?'warn':'';}
function log(t,cls){const p=document.createElement('p');p.textContent=t;if(cls)p.className=cls;$('log').appendChild(p);$('log').scrollTop=1e6;}
function feedback(t,bad){$('fb').textContent=t;$('fb').className=bad?'bad':'';}

/* ---------- 朗讀 ---------- */
function pickVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/zh.?TW/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null;}
function deviceSpeak(text){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){setTimeout(res,Math.min(8000,text.length*200));return;}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text),v=pickVoice();
    if(v)u.voice=v;u.lang=v?.lang||'zh-TW';u.rate=Number($('rate').value);
    let done=false;const end=()=>{if(!done){done=true;clearTimeout(t);res();}};
    const t=setTimeout(end,Math.max(5000,text.length*500));
    u.onend=end;u.onerror=end;speechSynthesis.speak(u);
  });
}

const player=new Audio(),clips=new Map();let endClip=null,cloudFails=0,ac=null;
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function primeAudio(){try{player.src=SILENT;player.play().catch(()=>{});if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(_){}}
function beep(f=880,d=.12){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(_){}}
function fetchClip(text){
  if(!clips.has(text)){
    const p=fetch(WORKER_URL+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})
      .then(r=>{if(!r.ok||!/audio/.test(r.headers.get('Content-Type')||''))throw new Error('tts');return r.blob();})
      .then(b=>URL.createObjectURL(b));
    p.catch(()=>clips.delete(text));clips.set(text,p);
  }
  return clips.get(text);
}
function prefetch(...texts){if(cloudFails<2)texts.filter(Boolean).forEach(t=>fetchClip(t).catch(()=>{}));}
function stopAudio(){player.pause();if(endClip)endClip(true);}
function playClip(url){
  return new Promise(res=>{
    const done=ok=>{clearTimeout(t);player.onended=player.onerror=null;endClip=null;res(ok);};
    const t=setTimeout(()=>done(false),60000);
    endClip=done;player.onended=()=>done(true);player.onerror=()=>done(false);
    player.src=url;player.playbackRate=Number($('rate').value);
    player.play().catch(()=>done(false));
  });
}
async function speak(text){
  stopAudio();
  if(cloudFails<2){
    try{
      const url=await Promise.race([fetchClip(text),new Promise((_,rej)=>setTimeout(()=>rej(new Error('slow')),10000))]);
      if(await playClip(url)){cloudFails=0;return;}
    }catch(_){}
    if(++cloudFails>=2)msg('雲端語音連不上，改用裝置聲音。',true);
  }
  return deviceSpeak(text);
}

/* ---------- 藍牙 ---------- */
function send(cmd){
  const c=S.ch;if(!c)return Promise.resolve(false);
  S.queue=S.queue.then(()=>c.writeValue(new TextEncoder().encode(cmd))).then(()=>true,()=>false);
  return S.queue;
}
async function connect(){
  if(!navigator.bluetooth){msg('這個瀏覽器不支援藍牙，請用 Android 或電腦的 Chrome／Edge。',true);return;}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});
    dev.addEventListener('gattserverdisconnected',()=>{S.ch=null;S.dev=null;ui();msg('裝置已斷線，可重新連接。',true);});
    const server=await dev.gatt.connect();
    const ch=await (await server.getPrimaryService(SVC)).getCharacteristic(CHR);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',onDevice);
    S.dev=dev;S.ch=ch;ui();
    await send(S.mode==='senior'?'MODE_SENIOR':'MODE_CHILD');
    msg('裝置已連線。');
  }catch(e){msg(e.name==='NotFoundError'?'已取消選擇裝置。':'連線失敗：'+e.message,true);}
}
function disconnect(){S.dev?.gatt?.connected&&S.dev.gatt.disconnect();}
function onDevice(ev){
  const v=new TextDecoder().decode(ev.target.value).trim().toUpperCase();
  if(v==='START'){if(!S.run)start();return;}                       // 按鈕一：開始
  if(/SWITCH_MODE_SENIOR|^MODE_SENIOR$/.test(v)){setMode('senior',false);return;} // 按鈕二：切換模式
  if(/SWITCH_MODE_CHILD|^MODE_CHILD$/.test(v)){setMode('child',false);return;}
  if(v==='HOLD_END'){if(S.cur)S.cur.last=null;return;}
  if(ACTIONS[v])onAction(v);
}

/* ---------- 動作判定 ---------- */
function failOnce(){
  const now=performance.now();if(now-S.lastFail<8000)return;S.lastFail=now;
  feedback('沒關係，再試一次！',true);send('ACTION_FAIL');speak('沒關係，再試一次。');
}
function onAction(v){
  const c=S.cur;if(!c||S.paused)return;
  if(v!==c.action){failOnce();return;}
  const now=performance.now();
  if(c.kind==='count'){
    c.count++;beep(880);feedback(`成功 ${c.count} / ${c.n} 次`);
    if(c.count<c.n)send('ACTION_TICK');
    if(c.count>=c.n)c.finish();
  }else{
    if(c.last&&now-c.last<HOLD_GAP)c.acc+=now-c.last; // 累積時間，中斷後不歸零
    c.last=now;
    const sec=Math.floor(c.acc/1000);if(sec>c.lastSec){c.lastSec=sec;beep(660,.08);}
    if(c.acc>=c.n*1000)c.finish();
  }
  render();
}
function render(){
  const c=S.cur;if(!c)return;
  if(c.kind==='count'){$('bar').max=c.n;$('bar').value=c.count;}
  else{$('bar').max=c.n;$('bar').value=Math.min(c.n,c.acc/1000);}
}
setInterval(()=>{const c=S.cur;if(c&&c.last&&performance.now()-c.last>HOLD_GAP)c.last=null;render();},200);

function planTask(action,level){
  const g=S.mode==='senior',L=LEVELS[g?'senior':'child'][level],[kind,say]=ACTIONS[action];
  const n=action==='JUMP'?L.jump:action==='RUN'?L.run:kind==='count'?L.count:L.sec;
  return {kind,n,text:(g?'慢慢來。':'')+say(n,g)};
}
function waitAction(action,level){
  const {kind,n,text}=planTask(action,level);
  return new Promise(async resolve=>{
    let remind;
    const c={action,kind,n,count:0,acc:0,last:null,lastSec:0,text,
      finish(){clearInterval(remind);S.cur=null;resolve(true);}};
    c.cancel=()=>{clearInterval(remind);S.cur=null;resolve(false);};
    $('taskText').textContent=text;$('task').style.display='block';feedback('');render();
    await speak(text);
    if(S.cur===null&&S.run===0)return;
    S.cur=c;render();
    send((kind==='time'?'TIMED:':'EXPECT:')+action);
    remind=setInterval(()=>{if(!S.paused&&S.cur===c&&!speechSynthesis.speaking&&player.paused)speak('準備好了再做。'+text);},25000);
  });
}

/* ---------- 流程 ---------- */
const gate=()=>new Promise(r=>{(function w(){S.paused?setTimeout(w,300):r();})();});

async function runSteps(steps,token){
  const lv=$('level').value;
  const ahead=x=>x&&[x.text,x.action&&planTask(x.action,lv).text];
  prefetch(...(ahead(steps[0])||[]),...(ahead(steps[1])||[]));
  for(let i=0;i<steps.length;i++){
    const s=steps[i];
    prefetch(...(ahead(steps[i+1])||[]),...(ahead(steps[i+2])||[]),s.action&&(S.mode==='senior'?'完成了。慢慢把手放回原位。':'成功了！'+(s.after||'')));
    await gate();if(token!==S.run)return;
    if(s.text){log(s.text);await speak(s.text);}
    await gate();if(token!==S.run)return;
    if(s.action){
      const ok=await waitAction(s.action,$('level').value);
      if(!ok||token!==S.run)return;
      $('task').style.display='none';
      await send('PAUSE');await send('ACTION_OK');
      const w=S.mode==='senior'?'完成了。慢慢把手放回原位。':'成功了！'+(s.after||'');
      if(S.mode==='senior'){log('完成了。','after');}else{log('✓ '+(s.after||'成功了！'),'after');}
      await speak(w);
    }
  }
  if(token===S.run){finish();}
}
function seniorSteps(){
  const steps=[{text:'今天做一些輕柔的手部活動。請坐穩，雙腳平放，手肘靠好。不舒服就休息。'}];
  SENIOR_STEPS.forEach((a,i)=>{
    steps.push({action:a});
    if(i===5)steps.push({text:'中間休息一下，自然呼吸。'});
  });
  steps.push({text:'全部完成了，辛苦了。把手放在腿上，慢慢放鬆。'});
  return steps;
}
async function start(){
  if(S.run)return;
  primeAudio();
  let steps;
  if(S.mode==='senior')steps=seniorSteps();
  else{
    if(!S.story){msg('請先貼上並載入故事。',true);return;}
    steps=[{text:'先站起來，前後左右留一點空間，我們要出發囉！'},...S.story.scenes.map(s=>({text:s.text,action:s.action,after:s.after}))];
  }
  $('log').replaceChildren();S.paused=false;
  const token=++S.run;ui();msg(S.mode==='senior'?'活動進行中':'故事進行中');
  if(S.story&&S.mode==='child')log('《'+S.story.title+'》');
  await send('GAME_ACTIVE');
  runSteps(steps,token);
}
async function finish(){
  S.run=0;S.cur=null;$('task').style.display='none';
  await send('STORY_COMPLETE');await send('GAME_IDLE');
  msg('完成了！🎉');ui();
}
function stop(){
  S.run=0;if(S.cur)S.cur.cancel();S.cur=null;S.paused=false;
  speechSynthesis.cancel();stopAudio();send('PAUSE');send('GAME_IDLE');
  $('task').style.display='none';msg('已結束。');ui();
}
function pause(){
  S.paused=!S.paused;
  if(S.paused){speechSynthesis.cancel();stopAudio();send('PAUSE');msg('休息中。準備好了按「繼續」。');}
  else{msg('繼續進行。');if(S.cur){send((S.cur.kind==='time'?'TIMED:':'EXPECT:')+S.cur.action);speak(S.cur.text);}}
  ui();
}

/* ---------- 故事載入 ---------- */
const ACTION_NAMES=Object.keys(ACTIONS);
function parseStory(raw){
  let t=raw.replace(/^\uFEFF/,'').replace(/```json|```/gi,'').trim();
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('找不到 JSON，請貼上完整內容。');
  const d=JSON.parse(t.slice(a,b+1));
  if(!Array.isArray(d.scenes)||d.scenes.length<2)throw new Error('故事需要 scenes 陣列。');
  const warns=[];let jumps=0,moves=0;
  const scenes=d.scenes.map((s,i)=>{
    const text=String(s.text||'').trim();if(!text)throw new Error(`第 ${i+1} 段沒有文字。`);
    const action=s.action==null?null:String(s.action).trim().toUpperCase();
    if(action&&!ACTION_NAMES.includes(action))throw new Error(`第 ${i+1} 段的動作 ${action} 不支援。`);
    if(action){moves++;if(action==='JUMP')jumps++;if(BAD_WORDS.test(text))warns.push(`第 ${i+1} 段台詞含動作字眼，朗讀時可能和動作指令重複`);}
    return {text,action,after:String(s.after||'').trim()};
  });
  if(!moves)throw new Error('故事裡沒有任何動作。');
  if(jumps>3)warns.push('小跳出現太多次');
  return {title:String(d.title||'未命名故事'),scenes,warns,moves};
}
function loadStory(){
  try{
    const s=parseStory($('json').value);S.story=s;
    msg(`已載入《${s.title}》，共 ${s.scenes.length} 段、${s.moves} 個動作。`+(s.warns.length?' 提醒：'+s.warns.slice(0,3).join('；'):''),s.warns.length>0);
  }catch(e){S.story=null;msg('載入失敗：'+e.message,true);}
  ui();
}

async function generate(){
  const idea=$('idea').value.trim();
  if(!idea){msg('請先寫下故事點子。',true);return;}
  $('btnGen').disabled=true;msg('正在創作故事，大約 20～40 秒……');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),120000);
  try{
    const r=await fetch(WORKER_URL+'/generate',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({idea,age:Number($('age').value)})});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||'生成失敗');
    $('json').value=JSON.stringify(d.story);
    loadStory();
  }catch(e){msg(e.name==='AbortError'?'等太久了，請再試一次。':'生成失敗：'+e.message,true);}
  finally{clearTimeout(t);$('btnGen').disabled=false;}
}

/* ---------- 模式與介面 ---------- */
function setMode(m,notify=true){
  if(S.run)return;
  S.mode=m;$('mChild').classList.toggle('on',m==='child');$('mSenior').classList.toggle('on',m==='senior');
  $('childBox').classList.toggle('hide',m==='senior');
  if(notify)send(m==='senior'?'MODE_SENIOR':'MODE_CHILD');
  msg(m==='senior'?'長輩模式：選好難度，按「開始」。':S.story?'已載入故事，按「開始」。':'請先載入故事。');
  ui();
}
function ui(){
  const on=!!S.ch,running=!!S.run;
  $('dot').classList.toggle('live',on);$('conn').textContent=on?'裝置已連線':'裝置未連線';
  $('btnConn').classList.toggle('hide',on);$('btnDisc').classList.toggle('hide',!on);
  $('btnStart').disabled=running||(S.mode==='child'&&!S.story);
  $('btnPause').disabled=!running;$('btnPause').textContent=S.paused?'繼續':'休息一下';
  $('btnStop').disabled=!running;
  $('mChild').disabled=$('mSenior').disabled=running;
}
$('btnConn').onclick=connect;$('btnDisc').onclick=disconnect;
$('mChild').onclick=()=>setMode('child');$('mSenior').onclick=()=>setMode('senior');
$('btnLoad').onclick=loadStory;$('btnGen').onclick=generate;$('btnStart').onclick=start;$('btnPause').onclick=pause;$('btnStop').onclick=stop;
$('btnSim').onclick=()=>{ // 沒有裝置時測試：計次按一下算一次；計時動作會持續送訊號
  const c=S.cur;if(!c)return;
  if(c.kind==='count'){onAction(c.action);return;}
  const t=setInterval(()=>{if(S.cur!==c){clearInterval(t);return;}onAction(c.action);},300);
};
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
ui();
</script>
