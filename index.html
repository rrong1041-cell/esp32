<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聲動奇境互動控制台</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f7f6; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
        #log { margin: 20px auto; width: 80%; height: 150px; background: #222; color: #00ff00; text-align: left; padding: 10px; font-family: monospace; overflow-y: scroll; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>聲動奇境互動控制台</h1>
    <p id="status">狀態：尚未連線</p>
    <button id="connectBtn" onclick="connectBLE()">連接故事裝置</button>

    <div id="log"></div>

    <script>
        // 與 ESP32 完全相符的全新 UUID
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914c";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26aaf";

        let bluetoothDevice;
        let bluetoothCharacteristic;

        function log(message) {
            const time = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function connectBLE() {
            try {
                log("正在尋找藍牙裝置 (SmartStory-ESP32)...");
                
                // 請求藍牙裝置
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'SmartStory-ESP32' }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                log("正在連線到 GATT 伺服器...");
                const server = await bluetoothDevice.gatt.connect();

                log("正在取得藍牙服務...");
                const service = await server.getPrimaryService(SERVICE_UUID);

                log("正在綁定特徵值...");
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                document.getElementById('status').innerText = "狀態：已連線";
                document.getElementById('status').style.color = "green";
                log("藍牙連線成功！");

            } catch (error) {
                log(`連線失敗: ${error}`);
                console.error(error);
            }
        }

        function onDisconnected(event) {
            document.getElementById('status').innerText = "狀態：已斷線";
            document.getElementById('status').style.color = "red";
            log("已中斷藍牙連線");
        }
    </script>
</body>
</html>
